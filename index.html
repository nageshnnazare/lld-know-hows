// ============== Elevator ==============

class Elevator {
private:
    int id;
    int currentFloor;
    int capacity;
    Direction direction;
    ElevatorState state;

    set&lt;int&gt; upRequests;    // Floors requested going up
    set&lt;int&gt; downRequests;  // Floors requested going down

    Door door;
    Display display;

    mutex elevatorMutex;
    condition_variable cv;
    bool running;

public:
    Elevator(int elevatorId, int maxFloor) 
        : id(elevatorId), currentFloor(1), capacity(10), 
          direction(Direction::IDLE), state(ElevatorState::IDLE), 
          running(true) {}

    int getId() const { return id; }
    int getCurrentFloor() const { return currentFloor; }
    Direction getDirection() const { return direction; }
    ElevatorState getState() const { return state; }

    void addRequest(int floor, Direction requestDir) {
        lock_guard&lt;mutex&gt; lock(elevatorMutex);

        if (floor == currentFloor) {
            return; // Already at the floor
        }

        if (floor &gt; currentFloor) {
            upRequests.insert(floor);
        } else {
            downRequests.insert(floor);
        }

        cout &lt;&lt; &quot;[Elevator &quot; &lt;&lt; id &lt;&lt; &quot;] Request added: Floor &quot; 
             &lt;&lt; floor &lt;&lt; endl;

        cv.notify_one();
    }

    void processRequests() {
        while (running) {
            unique_lock&lt;mutex&gt; lock(elevatorMutex);

            // Wait if no requests
            cv.wait(lock, [this] { 
                return !upRequests.empty() || !downRequests.empty() || !running; 
            });

            if (!running) break;

            // Process requests based on current direction
            if (direction == Direction::IDLE) {
                if (!upRequests.empty()) {
                    direction = Direction::UP;
                } else if (!downRequests.empty()) {
                    direction = Direction::DOWN;
                }
            }

            lock.unlock();

            if (direction == Direction::UP) {
                processUpRequests();
            } else if (direction == Direction::DOWN) {
                processDownRequests();
            }
        }
    }

    void processUpRequests() {
        while (true) {
            lock_guard&lt;mutex&gt; lock(elevatorMutex);

            if (upRequests.empty()) {
                direction = Direction::IDLE;
                break;
            }

            // Get next floor
            auto it = upRequests.begin();
            int targetFloor = *it;

            if (targetFloor &gt; currentFloor) {
                moveToFloor(targetFloor);
            }

            // Arrive at floor
            upRequests.erase(it);
            stopAtFloor(targetFloor);
        }
    }

    void processDownRequests() {
        while (true) {
            lock_guard&lt;mutex&gt; lock(elevatorMutex);

            if (downRequests.empty()) {
                direction = Direction::IDLE;
                break;
            }

            // Get next floor (highest in down requests)
            auto it = downRequests.rbegin();
            int targetFloor = *it;

            if (targetFloor &lt; currentFloor) {
                moveToFloor(targetFloor);
            }

            // Arrive at floor
            downRequests.erase(*it);
            stopAtFloor(targetFloor);
        }
    }

    void moveToFloor(int targetFloor) {
        state = ElevatorState::MOVING;

        while (currentFloor != targetFloor) {
            this_thread::sleep_for(chrono::milliseconds(1000)); // 1 sec per floor

            if (currentFloor &lt; targetFloor) {
                currentFloor++;
                direction = Direction::UP;
            } else {
                currentFloor--;
                direction = Direction::DOWN;
            }

            display.showFloor(id, currentFloor, direction);
        }
    }

    void stopAtFloor(int floor) {
        state = ElevatorState::STOPPED;
        display.showMessage(id, &quot;Arrived at floor &quot; + to_string(floor));

        door.open();
        state = ElevatorState::DOOR_OPEN;

        // Wait for passengers
        this_thread::sleep_for(chrono::milliseconds(2000));

        door.close();
        state = ElevatorState::IDLE;
    }

    void stop() {
        running = false;
        cv.notify_one();
    }

    // For scheduling algorithm
    int calculateDistance(int fromFloor, Direction requestDir) const {
        int distance = abs(currentFloor - fromFloor);

        // If elevator is moving in same direction, prioritize
        if (direction == requestDir) {
            if (direction == Direction::UP &amp;&amp; fromFloor &gt;= currentFloor) {
                return distance;
            } else if (direction == Direction::DOWN &amp;&amp; fromFloor &lt;= currentFloor) {
                return distance;
            }
        }

        // If idle, just distance matters
        if (direction == Direction::IDLE) {
            return distance;
        }

        // Moving in opposite direction - higher cost
        return distance + 100;
    }
};

// ============== Scheduling Strategy ==============

class SchedulingStrategy {
public:
    virtual ~SchedulingStrategy() = default;
    virtual Elevator* selectElevator(vector&lt;unique_ptr&lt;Elevator&gt;&gt;&amp; elevators, 
                                     int floor, Direction direction) = 0;
};

// Nearest Car Algorithm
class NearestCarStrategy : public SchedulingStrategy {
public:
    Elevator* selectElevator(vector&lt;unique_ptr&lt;Elevator&gt;&gt;&amp; elevators, 
                            int floor, Direction direction) override {
        Elevator* best = nullptr;
        int minDistance = INT_MAX;

        for (auto&amp; elevator : elevators) {
            if (elevator-&gt;getState() == ElevatorState::MAINTENANCE) {
                continue;
            }

            int distance = elevator-&gt;calculateDistance(floor, direction);

            if (distance &lt; minDistance) {
                minDistance = distance;
                best = elevator.get();
            }
        }

        return best;
    }
};

// ============== Elevator Controller ==============

class ElevatorController {
private:
    static ElevatorController* instance;
    static mutex mtx;

    vector&lt;unique_ptr&lt;Elevator&gt;&gt; elevators;
    unique_ptr&lt;SchedulingStrategy&gt; strategy;
    int numFloors;
    vector&lt;thread&gt; elevatorThreads;

    ElevatorController(int numElevators, int floors) : numFloors(floors) {
        strategy = make_unique&lt;NearestCarStrategy&gt;();

        for (int i = 0; i &lt; numElevators; i++) {
            elevators.push_back(make_unique&lt;Elevator&gt;(i + 1, floors));
        }
    }

public:
    static ElevatorController* getInstance(int numElevators = 3, int floors = 10) {
        lock_guard&lt;mutex&gt; lock(mtx);
        if (instance == nullptr) {
            instance = new ElevatorController(numElevators, floors);
        }
        return instance;
    }

    void startAll() {
        for (auto&amp; elevator : elevators) {
            elevatorThreads.emplace_back(&amp;Elevator::processRequests, elevator.get());
        }
    }

    void requestElevator(int floor, Direction direction) {
        cout &lt;&lt; &quot;\\n[REQUEST] Floor &quot; &lt;&lt; floor &lt;&lt; &quot; Direction: &quot; 
             &lt;&lt; (direction == Direction::UP ? &quot;UP&quot; : &quot;DOWN&quot;) &lt;&lt; endl;

        Elevator* selectedElevator = strategy-&gt;selectElevator(elevators, floor, direction);

        if (selectedElevator) {
            cout &lt;&lt; &quot;[ASSIGNED] Elevator &quot; &lt;&lt; selectedElevator-&gt;getId() &lt;&lt; endl;
            selectedElevator-&gt;addRequest(floor, direction);
        } else {
            cout &lt;&lt; &quot;[ERROR] No elevator available!&quot; &lt;&lt; endl;
        }
    }

    void selectDestination(int elevatorId, int floor) {
        if (elevatorId &gt; 0 &amp;&amp; elevatorId &lt;= elevators.size()) {
            elevators[elevatorId - 1]-&gt;addRequest(floor, Direction::IDLE);
        }
    }

    void displayStatus() {
        cout &lt;&lt; &quot;\\n========== ELEVATOR STATUS ==========&quot; &lt;&lt; endl;
        for (auto&amp; elevator : elevators) {
            cout &lt;&lt; &quot;Elevator &quot; &lt;&lt; elevator-&gt;getId() &lt;&lt; &quot;: &quot;
                 &lt;&lt; &quot;Floor &quot; &lt;&lt; elevator-&gt;getCurrentFloor() &lt;&lt; &quot; | &quot;
                 &lt;&lt; &quot;State: &quot; &lt;&lt; (int)elevator-&gt;getState() &lt;&lt; endl;
        }
        cout &lt;&lt; &quot;====================================\\n&quot; &lt;&lt; endl;
    }

    void stopAll() {
        for (auto&amp; elevator : elevators) {
            elevator-&gt;stop();
        }

        for (auto&amp; thread : elevatorThreads) {
            if (thread.joinable()) {
                thread.join();
            }
        }
    }

    static void cleanup() {
        if (instance) {
            instance-&gt;stopAll();
            delete instance;
            instance = nullptr;
        }
    }
};

        while (current &lt; other) {

    map&lt;RoomType, double&gt; basePrice = {
        {RoomType::SINGLE, 100.0},
        {RoomType::DOUBLE, 150.0},
        {RoomType::DELUXE, 250.0},
        {RoomType::SUITE, 500.0}
    };

public:
    double calculatePrice(RoomType type, const Date&amp; date, int nights) override {
        double price = basePrice[type] * nights;

        // Weekend pricing (simplified: day 6,7 of month)
        if (date.day % 7 &gt;= 5) {
            price *= 1.5;
        }

        return price;
    }
};

// ============== Room ==============

class Room {
private:
    string roomNumber;
    RoomType type;
    int capacity;
    double basePrice;
    RoomStatus status;
    map&lt;Date, bool&gt; availability; // date -&gt; isAvailable
    mutex roomMutex;

public:
    Room(const string&amp; num, RoomType t, int cap, double price)
        : roomNumber(num), type(t), capacity(cap), 
          basePrice(price), status(RoomStatus::AVAILABLE) {}

    string getRoomNumber() const { return roomNumber; }
    RoomType getType() const { return type; }
    int getCapacity() const { return capacity; }
    double getBasePrice() const { return basePrice; }
    RoomStatus getStatus() const { return status; }

    bool isAvailableForDateRange(const Date&amp; checkIn, const Date&amp; checkOut) {
        lock_guard&lt;mutex&gt; lock(roomMutex);

        Date current = checkIn;
        while (current &lt; checkOut) {
            if (availability.count(current) &amp;&amp; !availability[current]) {
                return false;
            }
            current = current.nextDay();
        }
        return true;
    }

    bool blockDates(const Date&amp; checkIn, const Date&amp; checkOut) {
        lock_guard&lt;mutex&gt; lock(roomMutex);

        if (!isAvailableForDateRange(checkIn, checkOut)) {
            return false;
        }

        Date current = checkIn;
        while (current &lt; checkOut) {
            availability[current] = false;
            current = current.nextDay();
        }

        status = RoomStatus::BOOKED;
        return true;
    }

    void releaseDates(const Date&amp; checkIn, const Date&amp; checkOut) {
        lock_guard&lt;mutex&gt; lock(roomMutex);

        Date current = checkIn;
        while (current &lt; checkOut) {
            availability[current] = true;
            current = current.nextDay();
        }

        status = RoomStatus::AVAILABLE;
    }

    void setStatus(RoomStatus s) {
        status = s;
    }

    string getTypeString() const {
        switch(type) {
            case RoomType::SINGLE: return &quot;Single&quot;;
            case RoomType::DOUBLE: return &quot;Double&quot;;
            case RoomType::DELUXE: return &quot;Deluxe&quot;;
            case RoomType::SUITE: return &quot;Suite&quot;;
            default: return &quot;Unknown&quot;;
        }
    }
};

// ============== Booking ==============

class Booking {
private:
    string bookingId;
    Guest* guest;
    Room* room;
    Date checkInDate;
    Date checkOutDate;
    BookingStatus status;
    double totalAmount;
    time_t bookingTime;

    static int bookingCounter;

public:
    Booking(Guest* g, Room* r, const Date&amp; in, const Date&amp; out, double amount)
        : guest(g), room(r), checkInDate(in), checkOutDate(out),
          status(BookingStatus::PENDING), totalAmount(amount) {

        bookingId = &quot;BK&quot; + to_string(++bookingCounter);
        bookingTime = time(nullptr);
    }

    string getBookingId() const { return bookingId; }
    Guest* getGuest() const { return guest; }
    Room* getRoom() const { return room; }
    Date getCheckInDate() const { return checkInDate; }
    Date getCheckOutDate() const { return checkOutDate; }
    BookingStatus getStatus() const { return status; }
    double getTotalAmount() const { return totalAmount; }

    void confirm() {
        status = BookingStatus::CONFIRMED;
    }

    void checkIn() {
        if (status == BookingStatus::CONFIRMED) {
            status = BookingStatus::CHECKED_IN;
            room-&gt;setStatus(RoomStatus::OCCUPIED);
        }
    }

    void checkOut() {
        if (status == BookingStatus::CHECKED_IN) {
            status = BookingStatus::CHECKED_OUT;
            room-&gt;setStatus(RoomStatus::AVAILABLE);
        }
    }

    void cancel() {
        status = BookingStatus::CANCELLED;
        room-&gt;releaseDates(checkInDate, checkOutDate);
    }

    void display() const {
        cout &lt;&lt; &quot;\\n========== BOOKING DETAILS ==========&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;Booking ID: &quot; &lt;&lt; bookingId &lt;&lt; endl;
        cout &lt;&lt; &quot;Guest: &quot; &lt;&lt; guest-&gt;getName() &lt;&lt; endl;
        cout &lt;&lt; &quot;Room: &quot; &lt;&lt; room-&gt;getRoomNumber() 
             &lt;&lt; &quot; (&quot; &lt;&lt; room-&gt;getTypeString() &lt;&lt; &quot;)&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;Check-in: &quot; &lt;&lt; checkInDate.toString() &lt;&lt; endl;
        cout &lt;&lt; &quot;Check-out: &quot; &lt;&lt; checkOutDate.toString() &lt;&lt; endl;
        cout &lt;&lt; &quot;Nights: &quot; &lt;&lt; checkInDate.daysBetween(checkOutDate) &lt;&lt; endl;
        cout &lt;&lt; &quot;Total: $&quot; &lt;&lt; totalAmount &lt;&lt; endl;
        cout &lt;&lt; &quot;Status: &quot; &lt;&lt; (int)status &lt;&lt; endl;
        cout &lt;&lt; &quot;====================================\\n&quot; &lt;&lt; endl;
    }
};

// ============== Hotel ==============

class Hotel {
private:
    string name;
    vector&lt;unique_ptr&lt;Room&gt;&gt; rooms;
    map&lt;string, unique_ptr&lt;Guest&gt;&gt; guests;
    map&lt;string, unique_ptr&lt;Booking&gt;&gt; bookings;
    unique_ptr&lt;PricingStrategy&gt; pricingStrategy;
    mutex hotelMutex;

public:
    Hotel(const string&amp; n) : name(n) {
        pricingStrategy = make_unique&lt;StandardPricing&gt;();
        initializeRooms();
    }

    void initializeRooms() {
        // Add some rooms
        rooms.push_back(make_unique&lt;Room&gt;(&quot;101&quot;, RoomType::SINGLE, 1, 100));
        rooms.push_back(make_unique&lt;Room&gt;(&quot;102&quot;, RoomType::SINGLE, 1, 100));
        rooms.push_back(make_unique&lt;Room&gt;(&quot;201&quot;, RoomType::DOUBLE, 2, 150));
        rooms.push_back(make_unique&lt;Room&gt;(&quot;202&quot;, RoomType::DOUBLE, 2, 150));
        rooms.push_back(make_unique&lt;Room&gt;(&quot;301&quot;, RoomType::DELUXE, 2, 250));
        rooms.push_back(make_unique&lt;Room&gt;(&quot;401&quot;, RoomType::SUITE, 4, 500));
    }

    Guest* registerGuest(const string&amp; id, const string&amp; name, 
                        const string&amp; email, const string&amp; phone) {
        lock_guard&lt;mutex&gt; lock(hotelMutex);

        if (guests.find(id) != guests.end()) {
            return guests[id].get();
        }

        auto guest = make_unique&lt;Guest&gt;(id, name, email, phone);
        Guest* guestPtr = guest.get();
        guests[id] = move(guest);

        return guestPtr;
    }

    vector&lt;Room*&gt; searchAvailableRooms(const Date&amp; checkIn, const Date&amp; checkOut,
                                       RoomType type, int guests) {
        vector&lt;Room*&gt; available;

        for (auto&amp; room : rooms) {
            if (room-&gt;getType() == type &amp;&amp; 
                room-&gt;getCapacity() &gt;= guests &amp;&amp;
                room-&gt;isAvailableForDateRange(checkIn, checkOut)) {
                available.push_back(room.get());
            }
        }

        return available;
    }

    Booking* makeBooking(Guest* guest, Room* room, 
                        const Date&amp; checkIn, const Date&amp; checkOut) {
        lock_guard&lt;mutex&gt; lock(hotelMutex);

        // Calculate price
        int nights = checkIn.daysBetween(checkOut);
        double price = pricingStrategy-&gt;calculatePrice(room-&gt;getType(), checkIn, nights);

        // Block room dates
        if (!room-&gt;blockDates(checkIn, checkOut)) {
            cout &lt;&lt; &quot;Failed to book room - not available!&quot; &lt;&lt; endl;
            return nullptr;
        }

        // Create booking
        auto booking = make_unique&lt;Booking&gt;(guest, room, checkIn, checkOut, price);
        booking-&gt;confirm();

        Booking* bookingPtr = booking.get();
        bookings[booking-&gt;getBookingId()] = move(booking);

        cout &lt;&lt; &quot;✓ Booking successful!&quot; &lt;&lt; endl;
        return bookingPtr;
    }

    bool cancelBooking(const string&amp; bookingId) {
        lock_guard&lt;mutex&gt; lock(hotelMutex);

        auto it = bookings.find(bookingId);
        if (it == bookings.end()) {
            return false;
        }

        it-&gt;second-&gt;cancel();
        cout &lt;&lt; &quot;✓ Booking cancelled&quot; &lt;&lt; endl;
        return true;
    }

    bool checkIn(const string&amp; bookingId) {
        lock_guard&lt;mutex&gt; lock(hotelMutex);

        auto it = bookings.find(bookingId);
        if (it == bookings.end()) {
            return false;
        }

        it-&gt;second-&gt;checkIn();
        cout &lt;&lt; &quot;✓ Checked in successfully&quot; &lt;&lt; endl;
        return true;
    }

    bool checkOut(const string&amp; bookingId) {
        lock_guard&lt;mutex&gt; lock(hotelMutex);

        auto it = bookings.find(bookingId);
        if (it == bookings.end()) {
            return false;
        }

        it-&gt;second-&gt;checkOut();
        cout &lt;&lt; &quot;✓ Checked out successfully&quot; &lt;&lt; endl;
        return true;
    }

    void displayAvailableRooms(const Date&amp; checkIn, const Date&amp; checkOut) {
        cout &lt;&lt; &quot;\\n========== AVAILABLE ROOMS ==========&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;Check-in: &quot; &lt;&lt; checkIn.toString() &lt;&lt; endl;
        cout &lt;&lt; &quot;Check-out: &quot; &lt;&lt; checkOut.toString() &lt;&lt; endl;
        cout &lt;&lt; &quot;-------------------------------------&quot; &lt;&lt; endl;

        for (auto&amp; room : rooms) {
            if (room-&gt;isAvailableForDateRange(checkIn, checkOut)) {
                cout &lt;&lt; room-&gt;getRoomNumber() &lt;&lt; &quot; - &quot; 
                     &lt;&lt; room-&gt;getTypeString() &lt;&lt; &quot; - $&quot; 
                     &lt;&lt; room-&gt;getBasePrice() &lt;&lt; &quot;/night&quot; &lt;&lt; endl;
            }
        }
        cout &lt;&lt; &quot;====================================\\n&quot; &lt;&lt; endl;
    }
};

<pre><code class="language-cpp">#include &lt;iostream&gt;

using namespace std;

enum class SeatType { REGULAR, PREMIUM, VIP };
enum class SeatStatus { AVAILABLE, LOCKED, BOOKED };
enum class BookingStatus { PENDING, CONFIRMED, CANCELLED };

// ============== Seat ==============

class Seat {
private:
    string seatNumber;
    SeatType type;
    SeatStatus status;
    double price;
    chrono::system_clock::time_point lockExpiry;
    mutex seatMutex;

public:
    Seat(const string&amp; num, SeatType t, double p)
        : seatNumber(num), type(t), status(SeatStatus::AVAILABLE), price(p) {}

    string getSeatNumber() const { return seatNumber; }
    SeatType getType() const { return type; }
    SeatStatus getStatus() { 
        lock_guard&lt;mutex&gt; lock(seatMutex);

        // Check if lock expired
        if (status == SeatStatus::LOCKED) {
            if (chrono::system_clock::now() &gt; lockExpiry) {
                status = SeatStatus::AVAILABLE;
            }
        }
        return status;
    }
    double getPrice() const { return price; }

    bool lock(int minutes = 10) {
        lock_guard&lt;mutex&gt; lock(seatMutex);

        if (status != SeatStatus::AVAILABLE) {
            return false;
        }

        status = SeatStatus::LOCKED;
        lockExpiry = chrono::system_clock::now() + chrono::minutes(minutes);
        return true;
    }

    bool unlock() {
        lock_guard&lt;mutex&gt; lock(seatMutex);

        if (status == SeatStatus::LOCKED) {
            status = SeatStatus::AVAILABLE;
            return true;
        }
        return false;
    }

    bool book() {
        lock_guard&lt;mutex&gt; lock(seatMutex);

        if (status != SeatStatus::LOCKED) {
            return false;
        }

        status = SeatStatus::BOOKED;
        return true;
    }

    bool release() {
        lock_guard&lt;mutex&gt; lock(seatMutex);

        if (status == SeatStatus::BOOKED) {
            status = SeatStatus::AVAILABLE;
            return true;
        }
        return false;
    }

    char getDisplayChar() {
        switch(getStatus()) {
            case SeatStatus::AVAILABLE: return 'O';
            case SeatStatus::LOCKED: return 'L';
            case SeatStatus::BOOKED: return 'X';
            default: return '?';
        }
    }
};

// ============== Show ==============

class Show {
private:
    string showId;
    Movie* movie;
    string date;
    string time;
    vector&lt;vector&lt;unique_ptr&lt;Seat&gt;&gt;&gt; seats; // 2D seat layout
    int rows, cols;

public:
    Show(const string&amp; id, Movie* m, const string&amp; d, const string&amp; t, int r, int c)
        : showId(id), movie(m), date(d), time(t), rows(r), cols(c) {

        initializeSeats();
    }

    void initializeSeats() {
        for (int i = 0; i &lt; rows; i++) {
            vector&lt;unique_ptr&lt;Seat&gt;&gt; row;
            for (int j = 0; j &lt; cols; j++) {
                string seatNum = string(1, 'A' + i) + to_string(j + 1);

                SeatType type;
                double price;

                if (i &lt; 2) { // Front rows - Regular
                    type = SeatType::REGULAR;
                    price = 10.0;
                } else if (i &lt; 5) { // Middle rows - Premium
                    type = SeatType::PREMIUM;
                    price = 15.0;
                } else { // Back rows - VIP
                    type = SeatType::VIP;
                    price = 20.0;
                }

                row.push_back(make_unique&lt;Seat&gt;(seatNum, type, price));
            }
            seats.push_back(move(row));
        }
    }

    string getShowId() const { return showId; }
    Movie* getMovie() const { return movie; }
    string getDate() const { return date; }
    string getTime() const { return time; }

    Seat* getSeat(int row, int col) {
        if (row &gt;= 0 &amp;&amp; row &lt; rows &amp;&amp; col &gt;= 0 &amp;&amp; col &lt; cols) {
            return seats[row][col].get();
        }
        return nullptr;
    }

    vector&lt;Seat*&gt; getSeats(const vector&lt;pair&lt;int,int&gt;&gt;&amp; positions) {
        vector&lt;Seat*&gt; result;
        for (auto [r, c] : positions) {
            Seat* seat = getSeat(r, c);
            if (seat) result.push_back(seat);
        }
        return result;
    }

    void displaySeats() {
        cout &lt;&lt; &quot;\\n========== SEAT MAP ==========&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;Movie: &quot; &lt;&lt; movie-&gt;getTitle() &lt;&lt; endl;
        cout &lt;&lt; &quot;Show: &quot; &lt;&lt; date &lt;&lt; &quot; &quot; &lt;&lt; time &lt;&lt; endl;
        cout &lt;&lt; &quot;O=Available, L=Locked, X=Booked\\n&quot; &lt;&lt; endl;

        cout &lt;&lt; &quot;  &quot;;
        for (int j = 0; j &lt; cols; j++) {
            cout &lt;&lt; (j + 1) &lt;&lt; &quot; &quot;;
        }
        cout &lt;&lt; endl;

        for (int i = 0; i &lt; rows; i++) {
            cout &lt;&lt; (char)('A' + i) &lt;&lt; &quot; &quot;;
            for (int j = 0; j &lt; cols; j++) {
                cout &lt;&lt; seats[i][j]-&gt;getDisplayChar() &lt;&lt; &quot; &quot;;
            }
            cout &lt;&lt; endl;
        }
        cout &lt;&lt; &quot;==============================\\n&quot; &lt;&lt; endl;
    }

    int getAvailableSeatsCount() {
        int count = 0;
        for (auto&amp; row : seats) {
            for (auto&amp; seat : row) {
                if (seat-&gt;getStatus() == SeatStatus::AVAILABLE) {
                    count++;
                }
            }
        }
        return count;
    }
};

// ============== Booking ==============

class Booking {
private:
    string bookingId;
    Show* show;
    vector&lt;Seat*&gt; seats;
    string customerName;
    string customerEmail;
    BookingStatus status;
    double totalAmount;

    static int bookingCounter;

public:
    Booking(Show* s, const vector&lt;Seat*&gt;&amp; sts, const string&amp; name, const string&amp; email)
        : show(s), seats(sts), customerName(name), customerEmail(email),
          status(BookingStatus::PENDING), totalAmount(0) {

        bookingId = &quot;BK&quot; + to_string(++bookingCounter);

        for (auto* seat : seats) {
            totalAmount += seat-&gt;getPrice();
        }
    }

    string getBookingId() const { return bookingId; }
    BookingStatus getStatus() const { return status; }
    double getTotalAmount() const { return totalAmount; }

    bool confirm() {
        // Book all seats
        for (auto* seat : seats) {
            if (!seat-&gt;book()) {
                // Rollback if any seat fails
                for (auto* s : seats) {
                    s-&gt;unlock();
                }
                return false;
            }
        }

        status = BookingStatus::CONFIRMED;
        return true;
    }

    void cancel() {
        for (auto* seat : seats) {
            seat-&gt;release();
        }
        status = BookingStatus::CANCELLED;
    }

    void display() {
        cout &lt;&lt; &quot;\\n========== BOOKING DETAILS ==========&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;Booking ID: &quot; &lt;&lt; bookingId &lt;&lt; endl;
        cout &lt;&lt; &quot;Customer: &quot; &lt;&lt; customerName &lt;&lt; endl;
        cout &lt;&lt; &quot;Movie: &quot; &lt;&lt; show-&gt;getMovie()-&gt;getTitle() &lt;&lt; endl;
        cout &lt;&lt; &quot;Show: &quot; &lt;&lt; show-&gt;getDate() &lt;&lt; &quot; &quot; &lt;&lt; show-&gt;getTime() &lt;&lt; endl;
        cout &lt;&lt; &quot;Seats: &quot;;
        for (auto* seat : seats) {
            cout &lt;&lt; seat-&gt;getSeatNumber() &lt;&lt; &quot; &quot;;
        }
        cout &lt;&lt; endl;
        cout &lt;&lt; &quot;Total: $&quot; &lt;&lt; totalAmount &lt;&lt; endl;
        cout &lt;&lt; &quot;Status: &quot; &lt;&lt; (status == BookingStatus::CONFIRMED ? &quot;CONFIRMED&quot; : 
                              status == BookingStatus::CANCELLED ? &quot;CANCELLED&quot; : &quot;PENDING&quot;) 
             &lt;&lt; endl;
        cout &lt;&lt; &quot;=====================================\\n&quot; &lt;&lt; endl;
    }
};

class Cinema {
private:
    string name;
    vector&lt;unique_ptr&lt;Movie&gt;&gt; movies;
    vector&lt;unique_ptr&lt;Show&gt;&gt; shows;
    map&lt;string, unique_ptr&lt;Booking&gt;&gt; bookings;
    mutex cinemaMutex;

public:
    Cinema(const string&amp; n) : name(n) {
        initializeMoviesAndShows();
    }

    void initializeMoviesAndShows() {
        // Add movies
        movies.push_back(make_unique&lt;Movie&gt;(&quot;M1&quot;, &quot;Inception&quot;, &quot;Sci-Fi&quot;, 148));
        movies.push_back(make_unique&lt;Movie&gt;(&quot;M2&quot;, &quot;The Matrix&quot;, &quot;Action&quot;, 136));
        movies.push_back(make_unique&lt;Movie&gt;(&quot;M3&quot;, &quot;Interstellar&quot;, &quot;Sci-Fi&quot;, 169));

        // Add shows
        shows.push_back(make_unique&lt;Show&gt;(&quot;S1&quot;, movies[0].get(), &quot;2024-03-15&quot;, &quot;10:00 AM&quot;, 8, 10));
        shows.push_back(make_unique&lt;Show&gt;(&quot;S2&quot;, movies[0].get(), &quot;2024-03-15&quot;, &quot;02:00 PM&quot;, 8, 10));
        shows.push_back(make_unique&lt;Show&gt;(&quot;S3&quot;, movies[1].get(), &quot;2024-03-15&quot;, &quot;11:00 AM&quot;, 8, 10));
        shows.push_back(make_unique&lt;Show&gt;(&quot;S4&quot;, movies[2].get(), &quot;2024-03-15&quot;, &quot;03:00 PM&quot;, 8, 10));
    }

    void listMovies() {
        cout &lt;&lt; &quot;\\n========== NOW SHOWING ==========&quot; &lt;&lt; endl;
        for (auto&amp; movie : movies) {
            cout &lt;&lt; movie-&gt;getTitle() &lt;&lt; &quot; (&quot; &lt;&lt; movie-&gt;getGenre() &lt;&lt; &quot;) - &quot; 
                 &lt;&lt; movie-&gt;getDuration() &lt;&lt; &quot; mins&quot; &lt;&lt; endl;
        }
        cout &lt;&lt; &quot;=================================\\n&quot; &lt;&lt; endl;
    }

    void listShows() {
        cout &lt;&lt; &quot;\\n========== SHOWTIMES ==========&quot; &lt;&lt; endl;
        for (auto&amp; show : shows) {
            cout &lt;&lt; show-&gt;getShowId() &lt;&lt; &quot; - &quot; &lt;&lt; show-&gt;getMovie()-&gt;getTitle() 
                 &lt;&lt; &quot; - &quot; &lt;&lt; show-&gt;getDate() &lt;&lt; &quot; &quot; &lt;&lt; show-&gt;getTime()
                 &lt;&lt; &quot; (Available: &quot; &lt;&lt; show-&gt;getAvailableSeatsCount() &lt;&lt; &quot;)&quot; &lt;&lt; endl;
        }
        cout &lt;&lt; &quot;==============================\\n&quot; &lt;&lt; endl;
    }

    Show* getShow(const string&amp; showId) {
        for (auto&amp; show : shows) {
            if (show-&gt;getShowId() == showId) {
                return show.get();
            }
        }
        return nullptr;
    }

    Booking* bookTickets(const string&amp; showId, const vector&lt;pair&lt;int,int&gt;&gt;&amp; seatPositions,
                        const string&amp; customerName, const string&amp; customerEmail) {
        lock_guard&lt;mutex&gt; lock(cinemaMutex);

        Show* show = getShow(showId);
        if (!show) {
            cout &lt;&lt; &quot;Show not found!&quot; &lt;&lt; endl;
            return nullptr;
        }

        // Get seats
        vector&lt;Seat*&gt; seats = show-&gt;getSeats(seatPositions);

        if (seats.size() != seatPositions.size()) {
            cout &lt;&lt; &quot;Invalid seat selection!&quot; &lt;&lt; endl;
            return nullptr;
        }

        // Try to lock all seats
        for (auto* seat : seats) {
            if (!seat-&gt;lock()) {
                cout &lt;&lt; &quot;Seat &quot; &lt;&lt; seat-&gt;getSeatNumber() &lt;&lt; &quot; not available!&quot; &lt;&lt; endl;
                // Unlock previously locked seats
                for (auto* s : seats) {
                    s-&gt;unlock();
                }
                return nullptr;
            }
        }

        // Create booking
        auto booking = make_unique&lt;Booking&gt;(show, seats, customerName, customerEmail);
        Booking* bookingPtr = booking.get();

        cout &lt;&lt; &quot;\\n✓ Seats locked! Please complete payment within 10 minutes.&quot; &lt;&lt; endl;
        bookingPtr-&gt;display();

        bookings[booking-&gt;getBookingId()] = move(booking);

        return bookingPtr;
    }

    bool confirmBooking(const string&amp; bookingId) {
        lock_guard&lt;mutex&gt; lock(cinemaMutex);

        auto it = bookings.find(bookingId);
        if (it == bookings.end()) {
            return false;
        }

        if (it-&gt;second-&gt;confirm()) {
            cout &lt;&lt; &quot;\\n✓ Booking confirmed!&quot; &lt;&lt; endl;
            it-&gt;second-&gt;display();
            return true;
        }

        cout &lt;&lt; &quot;Failed to confirm booking!&quot; &lt;&lt; endl;
        return false;
    }

    bool cancelBooking(const string&amp; bookingId) {
        lock_guard&lt;mutex&gt; lock(cinemaMutex);

        auto it = bookings.find(bookingId);
        if (it == bookings.end()) {
            return false;
        }

        it-&gt;second-&gt;cancel();
        cout &lt;&lt; &quot;✓ Booking cancelled and seats released&quot; &lt;&lt; endl;
        return true;
    }
};

struct Date {
    int year, month, day;

    Date(int y = 2024, int m = 1, int d = 1) : year(y), month(m), day(d) {}

    bool operator&lt;(const Date&amp; other) const {
        if (year != other.year) return year &lt; other.year;
        if (month != other.month) return month &lt; other.month;
        return day &lt; other.day;
    }

    int daysBetween(const Date&amp; other) const {
        // Simplified calculation
        return abs((other.year - year) * 365 + (other.month - month) * 30 + (other.day - day));
    }

    string toString() const {
        return to_string(year) + &quot;-&quot; + to_string(month) + &quot;-&quot; + to_string(day);
    }
};

class Reservation {
private:
    string reservationId;
    Customer* customer;
    Vehicle* vehicle;
    Location* pickupLocation;
    Location* returnLocation;
    Date pickupDate;
    Date returnDate;
    ReservationStatus status;
    double totalCost;
    time_t createdAt;

    static int reservationCounter;

public:
    Reservation(Customer* cust, Vehicle* veh, Location* pickup, Location* ret,
                const Date&amp; pDate, const Date&amp; rDate)
        : customer(cust), vehicle(veh), pickupLocation(pickup), returnLocation(ret),
          pickupDate(pDate), returnDate(rDate), status(ReservationStatus::PENDING),
          totalCost(0), createdAt(time(nullptr)) {

        reservationId = &quot;RES&quot; + to_string(++reservationCounter);
        calculateCost();
    }

    void calculateCost() {
        int days = pickupDate.daysBetween(returnDate);
        if (days &lt; 1) days = 1;

        totalCost = vehicle-&gt;getDailyRate() * days;

        // Add location fee if different pickup/return
        if (pickupLocation != returnLocation) {
            totalCost += 50.0; // One-way fee
        }
    }

    string getReservationId() const { return reservationId; }
    Vehicle* getVehicle() const { return vehicle; }
    ReservationStatus getStatus() const { return status; }
    double getTotalCost() const { return totalCost; }
    Date getPickupDate() const { return pickupDate; }
    Date getReturnDate() const { return returnDate; }

    void confirm() {
        status = ReservationStatus::CONFIRMED;
        vehicle-&gt;setStatus(VehicleStatus::RESERVED);
    }

    void activate() {
        status = ReservationStatus::ACTIVE;
        vehicle-&gt;setStatus(VehicleStatus::RENTED);
    }

    void complete(int additionalCharges = 0) {
        status = ReservationStatus::COMPLETED;
        vehicle-&gt;setStatus(VehicleStatus::AVAILABLE);
        totalCost += additionalCharges;
    }

    void cancel() {
        status = ReservationStatus::CANCELLED;
        vehicle-&gt;setStatus(VehicleStatus::AVAILABLE);
    }

    void display() const {
        cout &lt;&lt; &quot;\\n========== RESERVATION ==========&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;ID: &quot; &lt;&lt; reservationId &lt;&lt; endl;

             &lt;&lt; &quot; (&quot; &lt;&lt; pickupDate.toString() &lt;&lt; &quot;)&quot; &lt;&lt; endl;

class CarRentalSystem {
private:
    vector&lt;unique_ptr&lt;Vehicle&gt;&gt; vehicles;
    vector&lt;unique_ptr&lt;Location&gt;&gt; locations;
    map&lt;string, unique_ptr&lt;Customer&gt;&gt; customers;
    map&lt;string, unique_ptr&lt;Reservation&gt;&gt; reservations;

public:
    CarRentalSystem() {
        initializeLocations();
        initializeVehicles();
    }

    void initializeLocations() {
        locations.push_back(make_unique&lt;Location&gt;(&quot;LOC1&quot;, &quot;Downtown&quot;, &quot;123 Main St&quot;));
        locations.push_back(make_unique&lt;Location&gt;(&quot;LOC2&quot;, &quot;Airport&quot;, &quot;Airport Terminal&quot;));
        locations.push_back(make_unique&lt;Location&gt;(&quot;LOC3&quot;, &quot;North Branch&quot;, &quot;456 North Ave&quot;));
    }

    void initializeVehicles() {
        vehicles.push_back(make_unique&lt;Vehicle&gt;(&quot;ABC123&quot;, &quot;Toyota&quot;, &quot;Corolla&quot;, 2023,
                                               VehicleType::ECONOMY, locations[0].get(), 35.0));
        vehicles.push_back(make_unique&lt;Vehicle&gt;(&quot;XYZ789&quot;, &quot;Honda&quot;, &quot;Accord&quot;, 2023,
                                               VehicleType::SEDAN, locations[0].get(), 45.0));
        vehicles.push_back(make_unique&lt;Vehicle&gt;(&quot;SUV456&quot;, &quot;Ford&quot;, &quot;Explorer&quot;, 2023,
                                               VehicleType::SUV, locations[1].get(), 65.0));
        vehicles.push_back(make_unique&lt;Vehicle&gt;(&quot;LUX999&quot;, &quot;BMW&quot;, &quot;5 Series&quot;, 2024,
                                               VehicleType::LUXURY, locations[0].get(), 120.0));
    }

    Customer* registerCustomer(const string&amp; id, const string&amp; name,
                              const string&amp; license, const string&amp; phone) {
        auto customer = make_unique&lt;Customer&gt;(id, name, license, phone);
        Customer* custPtr = customer.get();
        customers[id] = move(customer);
        return custPtr;
    }

    vector&lt;Vehicle*&gt; searchVehicles(VehicleType type, Location* location,
                                    const Date&amp; pickupDate, const Date&amp; returnDate) {
        vector&lt;Vehicle*&gt; available;

        for (auto&amp; vehicle : vehicles) {
            if (vehicle-&gt;getType() == type &amp;&amp;
                vehicle-&gt;getLocation() == location &amp;&amp;
                vehicle-&gt;getStatus() == VehicleStatus::AVAILABLE) {
                available.push_back(vehicle.get());
            }
        }

        return available;
    }

    Reservation* makeReservation(Customer* customer, Vehicle* vehicle,
                                Location* pickup, Location* returnLoc,

<pre><code class="language-cpp">#include &lt;iostream&gt;

// ============== Basic LRU Cache ==============

template&lt;typename K, typename V&gt;
class LRUCache {
private:
    struct Node {
        K key;
        V value;

        Node(const K&amp; k, const V&amp; v) : key(k), value(v) {}
    };

    int capacity;
    list&lt;Node&gt; cacheList;  // Doubly linked list: front = most recent
    unordered_map&lt;K, typename list&lt;Node&gt;::iterator&gt; cacheMap;  // Key -&gt; Iterator

    // Move node to front (most recently used position)
    void moveToFront(typename list&lt;Node&gt;::iterator it) {
        cacheList.splice(cacheList.begin(), cacheList, it);
    }

    // Remove least recently used item (from back)
    void evictLRU() {
        if (cacheList.empty()) return;

        K keyToRemove = cacheList.back().key;
        cacheList.pop_back();
        cacheMap.erase(keyToRemove);

        cout &lt;&lt; &quot;[EVICTED] Key: &quot; &lt;&lt; keyToRemove &lt;&lt; endl;
    }

public:
    LRUCache(int cap) : capacity(cap) {
        if (capacity &lt;= 0) {
            throw invalid_argument(&quot;Capacity must be positive&quot;);
        }
    }

    // Get value by key
    V get(const K&amp; key) {
        auto it = cacheMap.find(key);

        if (it == cacheMap.end()) {
            throw runtime_error(&quot;Key not found&quot;);
        }

        // Move to front (most recently used)
        moveToFront(it-&gt;second);

        return it-&gt;second-&gt;value;
    }

    // Check if key exists
    bool contains(const K&amp; key) const {
        return cacheMap.find(key) != cacheMap.end();
    }

    // Put key-value pair
    void put(const K&amp; key, const V&amp; value) {
        auto it = cacheMap.find(key);

        if (it != cacheMap.end()) {
            // Key exists - update value and move to front
            it-&gt;second-&gt;value = value;
            moveToFront(it-&gt;second);
            cout &lt;&lt; &quot;[UPDATED] Key: &quot; &lt;&lt; key &lt;&lt; &quot; Value: &quot; &lt;&lt; value &lt;&lt; endl;
        } else {
            // Key doesn't exist - add new node
            if (cacheList.size() &gt;= capacity) {
                evictLRU();
            }

            cacheList.emplace_front(key, value);
            cacheMap[key] = cacheList.begin();
            cout &lt;&lt; &quot;[ADDED] Key: &quot; &lt;&lt; key &lt;&lt; &quot; Value: &quot; &lt;&lt; value &lt;&lt; endl;
        }
    }

    // Remove key
    void remove(const K&amp; key) {
        auto it = cacheMap.find(key);

        if (it != cacheMap.end()) {
            cacheList.erase(it-&gt;second);
            cacheMap.erase(it);
            cout &lt;&lt; &quot;[REMOVED] Key: &quot; &lt;&lt; key &lt;&lt; endl;
        }
    }

    // Get current size
    int size() const {
        return cacheList.size();
    }

    // Get capacity
    int getCapacity() const {
        return capacity;
    }

    // Clear cache
    void clear() {
        cacheList.clear();
        cacheMap.clear();
        cout &lt;&lt; &quot;[CLEARED] Cache emptied&quot; &lt;&lt; endl;
    }

    // Display cache contents (most recent first)
    void display() const {
        cout &lt;&lt; &quot;\\n========== LRU Cache ==========&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;Capacity: &quot; &lt;&lt; capacity &lt;&lt; &quot; | Size: &quot; &lt;&lt; cacheList.size() &lt;&lt; endl;
        cout &lt;&lt; &quot;Contents (Most → Least Recent):&quot; &lt;&lt; endl;

        int index = 0;
        for (const auto&amp; node : cacheList) {
            cout &lt;&lt; &quot;[&quot; &lt;&lt; index++ &lt;&lt; &quot;] Key: &quot; &lt;&lt; node.key 
                 &lt;&lt; &quot; Value: &quot; &lt;&lt; node.value &lt;&lt; endl;
        }
        cout &lt;&lt; &quot;==============================\\n&quot; &lt;&lt; endl;
    }
};

public:
    ThreadSafeLRUCache(int capacity) : cache(capacity) {}

    }

    }

        cache.put(key, value);
    }

    void remove(const K&amp; key) {
        lock_guard&lt;mutex&gt; lock(mtx);
        cache.remove(key);
    }

    void display() const {
        lock_guard&lt;mutex&gt; lock(mtx);
        cache.display();
    }

    int size() const {
        lock_guard&lt;mutex&gt; lock(mtx);
        return cache.size();
    }
};

// ============== LRU Cache with Expiration (Advanced) ==============

template&lt;typename K, typename V&gt;
class ExpiringLRUCache {
private:
    struct TimedNode {
        K key;
        V value;
        time_t expirationTime;

        TimedNode(const K&amp; k, const V&amp; v, time_t exp) 
            : key(k), value(v), expirationTime(exp) {}

        bool isExpired() const {
            return time(nullptr) &gt;= expirationTime;
        }
    };

    int capacity;
    int ttlSeconds;
    list&lt;TimedNode&gt; cacheList;
    unordered_map&lt;K, typename list&lt;TimedNode&gt;::iterator&gt; cacheMap;

    void removeExpired() {
        time_t now = time(nullptr);

        auto it = cacheList.rbegin();
        while (it != cacheList.rend()) {
            if (it-&gt;expirationTime &lt;= now) {
                cout &lt;&lt; &quot;[EXPIRED] Key: &quot; &lt;&lt; it-&gt;key &lt;&lt; endl;
                cacheMap.erase(it-&gt;key);
                // Convert reverse iterator to forward iterator for erase
                it = decltype(it)(cacheList.erase(next(it).base()));
            } else {
                ++it;
            }
        }
    }

    void moveToFront(typename list&lt;TimedNode&gt;::iterator it) {
        cacheList.splice(cacheList.begin(), cacheList, it);
    }

    void evictLRU() {
        if (cacheList.empty()) return;

        K keyToRemove = cacheList.back().key;
        cacheList.pop_back();
        cacheMap.erase(keyToRemove);

        cout &lt;&lt; &quot;[EVICTED] Key: &quot; &lt;&lt; keyToRemove &lt;&lt; endl;
    }

public:
    ExpiringLRUCache(int cap, int ttl) 
        : capacity(cap), ttlSeconds(ttl) {}

    V get(const K&amp; key) {
        removeExpired();

        auto it = cacheMap.find(key);

        if (it == cacheMap.end()) {
            throw runtime_error(&quot;Key not found&quot;);
        }

        if (it-&gt;second-&gt;isExpired()) {
            cacheList.erase(it-&gt;second);
            cacheMap.erase(it);
            throw runtime_error(&quot;Key expired&quot;);
        }

        moveToFront(it-&gt;second);
        return it-&gt;second-&gt;value;
    }

    void put(const K&amp; key, const V&amp; value) {
        removeExpired();

        time_t expiration = time(nullptr) + ttlSeconds;
        auto it = cacheMap.find(key);

        if (it != cacheMap.end()) {
            it-&gt;second-&gt;value = value;
            it-&gt;second-&gt;expirationTime = expiration;
            moveToFront(it-&gt;second);
        } else {
            if (cacheList.size() &gt;= capacity) {
                evictLRU();
            }

            cacheList.emplace_front(key, value, expiration);
            cacheMap[key] = cacheList.begin();
        }
    }

    void display() const {
        cout &lt;&lt; &quot;\\n========== Expiring LRU Cache ==========&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;Capacity: &quot; &lt;&lt; capacity &lt;&lt; &quot; | TTL: &quot; &lt;&lt; ttlSeconds &lt;&lt; &quot;s&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;Size: &quot; &lt;&lt; cacheList.size() &lt;&lt; endl;

        time_t now = time(nullptr);
        int index = 0;
        for (const auto&amp; node : cacheList) {
            cout &lt;&lt; &quot;[&quot; &lt;&lt; index++ &lt;&lt; &quot;] Key: &quot; &lt;&lt; node.key 
                 &lt;&lt; &quot; Value: &quot; &lt;&lt; node.value 
                 &lt;&lt; &quot; Expires in: &quot; &lt;&lt; (node.expirationTime - now) &lt;&lt; &quot;s&quot; &lt;&lt; endl;
        }
        cout &lt;&lt; &quot;=======================================\\n&quot; &lt;&lt; endl;
    }
};

// ============== Usage Statistics Decorator ==============

template&lt;typename K, typename V&gt;
class StatisticalLRUCache {
private:
    LRUCache&lt;K, V&gt; cache;
    int hits;
    int misses;

public:
    StatisticalLRUCache(int capacity) : cache(capacity), hits(0), misses(0) {}

    V get(const K&amp; key) {
        try {
            V value = cache.get(key);
            hits++;
            return value;
        } catch (const runtime_error&amp;) {
            misses++;
            throw;
        }
    }

    void put(const K&amp; key, const V&amp; value) {
        cache.put(key, value);
    }

    double getHitRate() const {
        int total = hits + misses;
        return total == 0 ? 0.0 : static_cast&lt;double&gt;(hits) / total;
    }

    void displayStatistics() const {
        cout &lt;&lt; &quot;\\n========== Cache Statistics ==========&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;Hits: &quot; &lt;&lt; hits &lt;&lt; endl;
        cout &lt;&lt; &quot;Misses: &quot; &lt;&lt; misses &lt;&lt; endl;
        cout &lt;&lt; &quot;Hit Rate: &quot; &lt;&lt; (getHitRate() * 100) &lt;&lt; &quot;%&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;======================================\\n&quot; &lt;&lt; endl;
    }

    void display() const {
        cache.display();
    }
};

<h3 id="1-data-structure-choice">1. <strong>Data Structure Choice</strong></h3>
<ul>
<li><strong>HashMap</strong>: O(1) key lookup</li>
<li><strong>Doubly Linked List</strong>: O(1) insertion/deletion at any position</li>

<h3 id="2-order-maintenance">2. <strong>Order Maintenance</strong></h3>
<ul>

<li><code>splice()</code> for efficient reordering</li>
</ul>
<h3 id="3-eviction-policy">3. <strong>Eviction Policy</strong></h3>
<ul>

// ============== Product ==============

class Product {
private:
    string productId;
    string name;
    string description;
    double price;
    string category;
    int stockQuantity;

public:
    Product(const string&amp; id, const string&amp; n, double p, const string&amp; cat, int stock)
        : productId(id), name(n), price(p), category(cat), stockQuantity(stock) {}

    string getId() const { return productId; }
    string getName() const { return name; }
    double getPrice() const { return price; }
    string getCategory() const { return category; }
    int getStock() const { return stockQuantity; }

    bool isInStock(int quantity) const {
        return stockQuantity &gt;= quantity;
    }

    bool reduceStock(int quantity) {
        if (stockQuantity &gt;= quantity) {
            stockQuantity -= quantity;
            return true;
        }
        return false;
    }

    void addStock(int quantity) {
        stockQuantity += quantity;
    }

    void display() const {
        cout &lt;&lt; name &lt;&lt; &quot; - $&quot; &lt;&lt; price &lt;&lt; &quot; (&quot; &lt;&lt; stockQuantity &lt;&lt; &quot; in stock)&quot; &lt;&lt; endl;
    }
};

// ============== Cart Item ==============

class CartItem {
private:
    Product* product;
    int quantity;

public:
    CartItem(Product* p, int qty) : product(p), quantity(qty) {}

    Product* getProduct() const { return product; }
    int getQuantity() const { return quantity; }
    void setQuantity(int qty) { quantity = qty; }

    double getSubtotal() const {
        return product-&gt;getPrice() * quantity;
    }
};

// ============== Shopping Cart ==============

class ShoppingCart {
private:
    map&lt;string, unique_ptr&lt;CartItem&gt;&gt; items; // productId -&gt; CartItem

public:
    void addItem(Product* product, int quantity) {
        string productId = product-&gt;getId();

        if (items.find(productId) != items.end()) {
            // Update quantity
            items[productId]-&gt;setQuantity(items[productId]-&gt;getQuantity() + quantity);
        } else {
            items[productId] = make_unique&lt;CartItem&gt;(product, quantity);
        }

        cout &lt;&lt; &quot;✓ Added &quot; &lt;&lt; quantity &lt;&lt; &quot;x &quot; &lt;&lt; product-&gt;getName() &lt;&lt; &quot; to cart&quot; &lt;&lt; endl;
    }

    void removeItem(const string&amp; productId) {
        items.erase(productId);
        cout &lt;&lt; &quot;✓ Item removed from cart&quot; &lt;&lt; endl;
    }

    void updateQuantity(const string&amp; productId, int quantity) {
        if (items.find(productId) != items.end()) {
            if (quantity &gt; 0) {
                items[productId]-&gt;setQuantity(quantity);
            } else {
                items.erase(productId);
            }
        }
    }

    double getTotal() const {
        double total = 0;
        for (const auto&amp; [id, item] : items) {
            total += item-&gt;getSubtotal();
        }
        return total;
    }

    const map&lt;string, unique_ptr&lt;CartItem&gt;&gt;&amp; getItems() const {
        return items;
    }

    void clear() {
        items.clear();
    }

    bool isEmpty() const {
        return items.empty();
    }

    void display() const {
        cout &lt;&lt; &quot;\\n========== SHOPPING CART ==========&quot; &lt;&lt; endl;

        }

        Order* orderPtr = order.get();
        string orderId = order-&gt;getOrderId();
        orders[orderId] = move(order);
        user-&gt;addOrderToHistory(orderId);

<pre><code class="language-cpp">#include &lt;iostream&gt;

using namespace std;

// ============== Entry (Base class) ==============

enum class EntryType { FILE, DIRECTORY };

class Entry {
protected:
    string name;
    Entry* parent;
    time_t created;
    time_t modified;
    EntryType type;

public:
    Entry(const string&amp; n, Entry* p, EntryType t)
        : name(n), parent(p), type(t) {
        created = modified = time(nullptr);
    }

    virtual ~Entry() = default;

    string getName() const { return name; }
    Entry* getParent() const { return parent; }
    EntryType getType() const { return type; }

    bool isFile() const { return type == EntryType::FILE; }
    bool isDirectory() const { return type == EntryType::DIRECTORY; }

    virtual void display(int indent = 0) const = 0;
    virtual size_t getSize() const = 0;

    string getPath() const {
        if (parent == nullptr) return &quot;/&quot;;

        vector&lt;string&gt; parts;
        const Entry* current = this;

        while (current-&gt;parent != nullptr) {
            parts.push_back(current-&gt;name);
            current = current-&gt;parent;
        }

        if (parts.empty()) return &quot;/&quot;;

        reverse(parts.begin(), parts.end());
        string path = &quot;/&quot;;
        for (size_t i = 0; i &lt; parts.size(); i++) {
            path += parts[i];
            if (i &lt; parts.size() - 1) path += &quot;/&quot;;
        }
        return path;
    }
};

// ============== File ==============

class File : public Entry {
private:
    string content;

public:
    File(const string&amp; name, Entry* parent)
        : Entry(name, parent, EntryType::FILE), content(&quot;&quot;) {}

    string getContent() const { return content; }

    void write(const string&amp; data) {
        content = data;
        modified = time(nullptr);
    }

    void append(const string&amp; data) {
        content += data;
        modified = time(nullptr);
    }

    size_t getSize() const override {
        return content.size();
    }

    void display(int indent = 0) const override {
        for (int i = 0; i &lt; indent; i++) cout &lt;&lt; &quot;  &quot;;
        cout &lt;&lt; name &lt;&lt; &quot; (&quot; &lt;&lt; content.size() &lt;&lt; &quot; bytes)&quot; &lt;&lt; endl;
    }
};

// ============== Directory ==============

class Directory : public Entry {
private:
    map&lt;string, unique_ptr&lt;Entry&gt;&gt; children;

public:
    Directory(const string&amp; name, Entry* parent)
        : Entry(name, parent, EntryType::DIRECTORY) {}

    bool hasChild(const string&amp; name) const {
        return children.find(name) != children.end();
    }

    Entry* getChild(const string&amp; name) const {
        auto it = children.find(name);
        return (it != children.end()) ? it-&gt;second.get() : nullptr;
    }

    File* addFile(const string&amp; name) {
        if (hasChild(name)) {
            cout &lt;&lt; &quot;Error: '&quot; &lt;&lt; name &lt;&lt; &quot;' already exists&quot; &lt;&lt; endl;
            return nullptr;
        }

        auto file = make_unique&lt;File&gt;(name, this);
        File* filePtr = file.get();
        children[name] = move(file);
        return filePtr;
    }

    Directory* addDirectory(const string&amp; name) {
        if (hasChild(name)) {
            cout &lt;&lt; &quot;Error: '&quot; &lt;&lt; name &lt;&lt; &quot;' already exists&quot; &lt;&lt; endl;
            return nullptr;
        }

        auto dir = make_unique&lt;Directory&gt;(name, this);
        Directory* dirPtr = dir.get();
        children[name] = move(dir);
        return dirPtr;
    }

    bool remove(const string&amp; name) {
        auto it = children.find(name);
        if (it != children.end()) {
            children.erase(it);
            return true;
        }
        return false;
    }

    vector&lt;Entry*&gt; listContents() const {
        vector&lt;Entry*&gt; contents;
        for (const auto&amp; [name, entry] : children) {
            contents.push_back(entry.get());
        }
        return contents;
    }

    size_t getSize() const override {
        size_t total = 0;
        for (const auto&amp; [name, entry] : children) {
            total += entry-&gt;getSize();
        }
        return total;
    }

    void display(int indent = 0) const override {
        for (int i = 0; i &lt; indent; i++) cout &lt;&lt; &quot;  &quot;;
        cout &lt;&lt; name &lt;&lt; &quot;/&quot; &lt;&lt; endl;

        for (const auto&amp; [childName, child] : children) {
            child-&gt;display(indent + 1);
        }
    }
};

// ============== File System ==============

class FileSystem {
private:
    unique_ptr&lt;Directory&gt; root;
    Directory* currentDir;

    vector&lt;string&gt; splitPath(const string&amp; path) {
        vector&lt;string&gt; parts;
        stringstream ss(path);
        string part;

        while (getline(ss, part, '/')) {
            if (!part.empty() &amp;&amp; part != &quot;.&quot;) {
                parts.push_back(part);
            }
        }

        return parts;
    }

    Directory* navigateToDirectory(const string&amp; path) {
        if (path.empty() || path == &quot;.&quot;) {
            return currentDir;
        }

        Directory* dir = (path[0] == '/') ? root.get() : currentDir;

        vector&lt;string&gt; parts = splitPath(path);
        for (const string&amp; part : parts) {
            if (part == &quot;..&quot;) {
                if (dir-&gt;getParent() &amp;&amp; dir-&gt;getParent()-&gt;isDirectory()) {
                    dir = static_cast&lt;Directory*&gt;(dir-&gt;getParent());
                }
            } else {
                Entry* entry = dir-&gt;getChild(part);
                if (!entry || !entry-&gt;isDirectory()) {
                    return nullptr;
                }
                dir = static_cast&lt;Directory*&gt;(entry);
            }
        }

        return dir;
    }

    File* navigateToFile(const string&amp; path) {
        size_t lastSlash = path.find_last_of('/');

        Directory* dir;
        string fileName;

        if (lastSlash == string::npos) {
            dir = currentDir;
            fileName = path;
        } else {
            string dirPath = path.substr(0, lastSlash);
            fileName = path.substr(lastSlash + 1);
            dir = navigateToDirectory(dirPath.empty() ? &quot;/&quot; : dirPath);
        }

        if (!dir) return nullptr;

        Entry* entry = dir-&gt;getChild(fileName);
        if (entry &amp;&amp; entry-&gt;isFile()) {
            return static_cast&lt;File*&gt;(entry);
        }

        return nullptr;
    }

public:
    FileSystem() {
        root = make_unique&lt;Directory&gt;(&quot;root&quot;, nullptr);
        currentDir = root.get();
    }

    // Create directory
    bool mkdir(const string&amp; path) {
        size_t lastSlash = path.find_last_of('/');

        Directory* dir;
        string dirName;

        if (lastSlash == string::npos) {
            dir = currentDir;
            dirName = path;
        } else {
            string parentPath = path.substr(0, lastSlash);
            dirName = path.substr(lastSlash + 1);
            dir = navigateToDirectory(parentPath.empty() ? &quot;/&quot; : parentPath);
        }

        if (!dir) {
            cout &lt;&lt; &quot;Error: Parent directory not found&quot; &lt;&lt; endl;
            return false;
        }

        Directory* newDir = dir-&gt;addDirectory(dirName);
        if (newDir) {
            cout &lt;&lt; &quot;✓ Created directory: &quot; &lt;&lt; newDir-&gt;getPath() &lt;&lt; endl;
            return true;
        }
        return false;
    }

    // Create file
    bool touch(const string&amp; path) {
        size_t lastSlash = path.find_last_of('/');

        Directory* dir;
        string fileName;

        if (lastSlash == string::npos) {
            dir = currentDir;
            fileName = path;
        } else {
            string parentPath = path.substr(0, lastSlash);
            fileName = path.substr(lastSlash + 1);
            dir = navigateToDirectory(parentPath.empty() ? &quot;/&quot; : parentPath);
        }

        if (!dir) {
            cout &lt;&lt; &quot;Error: Parent directory not found&quot; &lt;&lt; endl;
            return false;
        }

        File* file = dir-&gt;addFile(fileName);
        if (file) {
            cout &lt;&lt; &quot;✓ Created file: &quot; &lt;&lt; file-&gt;getPath() &lt;&lt; endl;
            return true;
        }
        return false;
    }

    // Change directory
    bool cd(const string&amp; path) {
        Directory* dir = navigateToDirectory(path);

        if (dir) {
            currentDir = dir;
            cout &lt;&lt; &quot;✓ Changed to: &quot; &lt;&lt; getCurrentPath() &lt;&lt; endl;
            return true;
        }

        cout &lt;&lt; &quot;Error: Directory not found&quot; &lt;&lt; endl;
        return false;
    }

    // List contents
    void ls(const string&amp; path = &quot;.&quot;) {
        Directory* dir = (path == &quot;.&quot;) ? currentDir : navigateToDirectory(path);

        if (!dir) {
            cout &lt;&lt; &quot;Error: Directory not found&quot; &lt;&lt; endl;
            return;
        }

        cout &lt;&lt; &quot;\\n========== &quot; &lt;&lt; dir-&gt;getPath() &lt;&lt; &quot; ==========&quot; &lt;&lt; endl;

        vector&lt;Entry*&gt; contents = dir-&gt;listContents();

        if (contents.empty()) {
            cout &lt;&lt; &quot;(empty)&quot; &lt;&lt; endl;
        } else {
            for (Entry* entry : contents) {
                if (entry-&gt;isDirectory()) {
                    cout &lt;&lt; &quot;[DIR]  &quot; &lt;&lt; entry-&gt;getName() &lt;&lt; &quot;/&quot; &lt;&lt; endl;
                } else {
                    File* file = static_cast&lt;File*&gt;(entry);
                    cout &lt;&lt; &quot;[FILE] &quot; &lt;&lt; file-&gt;getName()
                         &lt;&lt; &quot; (&quot; &lt;&lt; file-&gt;getSize() &lt;&lt; &quot; bytes)&quot; &lt;&lt; endl;
                }
            }
        }

        cout &lt;&lt; &quot;======================================\\n&quot; &lt;&lt; endl;
    }

    // Remove file or directory
    bool rm(const string&amp; path) {
        size_t lastSlash = path.find_last_of('/');

        Directory* dir;
        string name;

        if (lastSlash == string::npos) {
            dir = currentDir;
            name = path;
        } else {
            string parentPath = path.substr(0, lastSlash);
            name = path.substr(lastSlash + 1);
            dir = navigateToDirectory(parentPath.empty() ? &quot;/&quot; : parentPath);
        }

        if (!dir) {
            cout &lt;&lt; &quot;Error: Parent directory not found&quot; &lt;&lt; endl;
            return false;
        }

        if (dir-&gt;remove(name)) {
            cout &lt;&lt; &quot;✓ Removed: &quot; &lt;&lt; name &lt;&lt; endl;
            return true;
        }

        cout &lt;&lt; &quot;Error: Not found&quot; &lt;&lt; endl;
        return false;
    }

    // Read file
    void cat(const string&amp; path) {
        File* file = navigateToFile(path);

        if (!file) {
            cout &lt;&lt; &quot;Error: File not found&quot; &lt;&lt; endl;
            return;
        }

        cout &lt;&lt; &quot;\\n========== &quot; &lt;&lt; file-&gt;getName() &lt;&lt; &quot; ==========&quot; &lt;&lt; endl;
        cout &lt;&lt; file-&gt;getContent() &lt;&lt; endl;
        cout &lt;&lt; &quot;==========================================\\n&quot; &lt;&lt; endl;
    }

    // Write to file
    bool write(const string&amp; path, const string&amp; content) {
        File* file = navigateToFile(path);

        if (!file) {
            cout &lt;&lt; &quot;Error: File not found&quot; &lt;&lt; endl;
            return false;
        }

        file-&gt;write(content);
        cout &lt;&lt; &quot;✓ Written to &quot; &lt;&lt; file-&gt;getName() &lt;&lt; &quot; (&quot; &lt;&lt; content.size() &lt;&lt; &quot; bytes)&quot; &lt;&lt; endl;
        return true;
    }

    // Display tree
    void tree() {
        cout &lt;&lt; &quot;\\n========== File System Tree ==========&quot; &lt;&lt; endl;
        root-&gt;display();
        cout &lt;&lt; &quot;======================================\\n&quot; &lt;&lt; endl;
    }

    string getCurrentPath() const {
        return currentDir-&gt;getPath();
    }

    string pwd() const {
        return getCurrentPath();
    }
};

<h3 id="2-path-resolution">2. <strong>Path Resolution</strong></h3>
<ul>
<li>Absolute paths (start with /)</li>

using namespace std;

enum class Color { WHITE, BLACK };
enum class PieceType { KING, QUEEN, ROOK, BISHOP, KNIGHT, PAWN };
enum class GameStatus { ACTIVE, CHECK, CHECKMATE, STALEMATE };

// ============== Position ==============

struct Position {
    int row, col;

    Position(int r = 0, int c = 0) : row(r), col(c) {}

    bool isValid() const {
        return row &gt;= 0 &amp;&amp; row &lt; 8 &amp;&amp; col &gt;= 0 &amp;&amp; col &lt; 8;
    }

    bool operator==(const Position&amp; other) const {
        return row == other.row &amp;&amp; col == other.col;
    }

    string toString() const {
        char file = 'a' + col;
        char rank = '1' + row;
        return string(1, file) + rank;
    }
};

// ============== Piece (Abstract Base) ==============

class Piece {
protected:
    Color color;
    PieceType type;
    bool hasMoved;

public:
    Piece(Color c, PieceType t) : color(c), type(t), hasMoved(false) {}
    virtual ~Piece() = default;

    Color getColor() const { return color; }
    PieceType getType() const { return type; }
    bool hasMovedBefore() const { return hasMoved; }
    void setMoved() { hasMoved = true; }

    virtual char getSymbol() const = 0;
    virtual bool canMove(const Position&amp; from, const Position&amp; to,
                        const vector&lt;vector&lt;Piece*&gt;&gt;&amp; board) const = 0;
};

// ============== King ==============

class King : public Piece {
public:
    King(Color c) : Piece(c, PieceType::KING) {}

    char getSymbol() const override {
        return (color == Color::WHITE) ? 'K' : 'k';
    }

    bool canMove(const Position&amp; from, const Position&amp; to,
                const vector&lt;vector&lt;Piece*&gt;&gt;&amp; board) const override {
        int rowDiff = abs(to.row - from.row);
        int colDiff = abs(to.col - from.col);

        // King moves one square in any direction
        return (rowDiff &lt;= 1 &amp;&amp; colDiff &lt;= 1 &amp;&amp; (rowDiff + colDiff &gt; 0));
    }
};

// ============== Queen ==============

class Queen : public Piece {
public:
    Queen(Color c) : Piece(c, PieceType::QUEEN) {}

    char getSymbol() const override {
        return (color == Color::WHITE) ? 'Q' : 'q';
    }

    bool canMove(const Position&amp; from, const Position&amp; to,
                const vector&lt;vector&lt;Piece*&gt;&gt;&amp; board) const override {
        int rowDiff = abs(to.row - from.row);
        int colDiff = abs(to.col - from.col);

        // Queen moves like rook or bishop
        if (rowDiff == 0 || colDiff == 0 || rowDiff == colDiff) {
            // Check path is clear
            int rowStep = (to.row &gt; from.row) ? 1 : (to.row &lt; from.row ? -1 : 0);
            int colStep = (to.col &gt; from.col) ? 1 : (to.col &lt; from.col ? -1 : 0);

            int r = from.row + rowStep;
            int c = from.col + colStep;

            while (r != to.row || c != to.col) {
                if (board[r][c] != nullptr) return false;
                r += rowStep;
                c += colStep;
            }
            return true;
        }
        return false;
    }
};

// ============== Rook ==============

class Rook : public Piece {
public:
    Rook(Color c) : Piece(c, PieceType::ROOK) {}

    char getSymbol() const override {
        return (color == Color::WHITE) ? 'R' : 'r';
    }

    bool canMove(const Position&amp; from, const Position&amp; to,
                const vector&lt;vector&lt;Piece*&gt;&gt;&amp; board) const override {
        // Rook moves horizontally or vertically
        if (from.row != to.row &amp;&amp; from.col != to.col) return false;

        // Check path is clear
        int rowStep = (to.row &gt; from.row) ? 1 : (to.row &lt; from.row ? -1 : 0);
        int colStep = (to.col &gt; from.col) ? 1 : (to.col &lt; from.col ? -1 : 0);

        int r = from.row + rowStep;
        int c = from.col + colStep;

        while (r != to.row || c != to.col) {
            if (board[r][c] != nullptr) return false;
            r += rowStep;
            c += colStep;
        }
        return true;
    }
};

// ============== Bishop ==============

class Bishop : public Piece {
public:
    Bishop(Color c) : Piece(c, PieceType::BISHOP) {}

    char getSymbol() const override {
        return (color == Color::WHITE) ? 'B' : 'b';
    }

    bool canMove(const Position&amp; from, const Position&amp; to,
                const vector&lt;vector&lt;Piece*&gt;&gt;&amp; board) const override {
        int rowDiff = abs(to.row - from.row);
        int colDiff = abs(to.col - from.col);

        // Bishop moves diagonally
        if (rowDiff != colDiff) return false;

        // Check path is clear
        int rowStep = (to.row &gt; from.row) ? 1 : -1;
        int colStep = (to.col &gt; from.col) ? 1 : -1;

        int r = from.row + rowStep;
        int c = from.col + colStep;

        while (r != to.row || c != to.col) {
            if (board[r][c] != nullptr) return false;
            r += rowStep;
            c += colStep;
        }
        return true;
    }
};

// ============== Knight ==============

class Knight : public Piece {
public:
    Knight(Color c) : Piece(c, PieceType::KNIGHT) {}

    char getSymbol() const override {
        return (color == Color::WHITE) ? 'N' : 'n';
    }

    bool canMove(const Position&amp; from, const Position&amp; to,
                const vector&lt;vector&lt;Piece*&gt;&gt;&amp; board) const override {
        int rowDiff = abs(to.row - from.row);
        int colDiff = abs(to.col - from.col);

        // Knight moves in L-shape
        return (rowDiff == 2 &amp;&amp; colDiff == 1) || (rowDiff == 1 &amp;&amp; colDiff == 2);
    }
};

// ============== Pawn ==============

class Pawn : public Piece {
public:
    Pawn(Color c) : Piece(c, PieceType::PAWN) {}

    char getSymbol() const override {
        return (color == Color::WHITE) ? 'P' : 'p';
    }

    bool canMove(const Position&amp; from, const Position&amp; to,
                const vector&lt;vector&lt;Piece*&gt;&gt;&amp; board) const override {
        int direction = (color == Color::WHITE) ? 1 : -1;
        int rowDiff = to.row - from.row;
        int colDiff = abs(to.col - from.col);

        // Move forward one square
        if (rowDiff == direction &amp;&amp; colDiff == 0 &amp;&amp; board[to.row][to.col] == nullptr) {
            return true;
        }

        // Move forward two squares from starting position
        int startRow = (color == Color::WHITE) ? 1 : 6;
        if (from.row == startRow &amp;&amp; rowDiff == 2 * direction &amp;&amp; colDiff == 0 &amp;&amp;
            board[to.row][to.col] == nullptr &amp;&amp;
            board[from.row + direction][from.col] == nullptr) {
            return true;
        }

        // Capture diagonally
        if (rowDiff == direction &amp;&amp; colDiff == 1 &amp;&amp; board[to.row][to.col] != nullptr) {
            return true;
        }

        return false;
    }
};

// ============== Board ==============

class Board {
private:

public:
    Board() : cells(8, vector&lt;Piece*&gt;(8, nullptr)) {}

    ~Board() {
        for (auto&amp; row : cells) {

            }
        }
    }

    Piece* getPiece(const Position&amp; pos) const {
        if (!pos.isValid()) return nullptr;
        return cells[pos.row][pos.col];
    }

    void setPiece(const Position&amp; pos, Piece* piece) {

            cells[pos.row][pos.col] = piece;
        }
    }

    const vector&lt;vector&lt;Piece*&gt;&gt;&amp; getCells() const {
        return cells;
    }

    void initialize() {
        // Set up pawns
        for (int col = 0; col &lt; 8; col++) {
            cells[1][col] = new Pawn(Color::WHITE);
            cells[6][col] = new Pawn(Color::BLACK);
        }

        // Set up rooks
        cells[0][0] = new Rook(Color::WHITE);
        cells[0][7] = new Rook(Color::WHITE);
        cells[7][0] = new Rook(Color::BLACK);
        cells[7][7] = new Rook(Color::BLACK);

        // Set up knights
        cells[0][1] = new Knight(Color::WHITE);
        cells[0][6] = new Knight(Color::WHITE);
        cells[7][1] = new Knight(Color::BLACK);
        cells[7][6] = new Knight(Color::BLACK);

        // Set up bishops
        cells[0][2] = new Bishop(Color::WHITE);
        cells[0][5] = new Bishop(Color::WHITE);
        cells[7][2] = new Bishop(Color::BLACK);
        cells[7][5] = new Bishop(Color::BLACK);

        // Set up queens
        cells[0][3] = new Queen(Color::WHITE);
        cells[7][3] = new Queen(Color::BLACK);

        // Set up kings
        cells[0][4] = new King(Color::WHITE);
        cells[7][4] = new King(Color::BLACK);
    }

    void display() const {
        cout &lt;&lt; &quot;\\n  a b c d e f g h&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot; ┌─────────────────┐&quot; &lt;&lt; endl;

        for (int row = 7; row &gt;= 0; row--) {
            cout &lt;&lt; row + 1 &lt;&lt; &quot;│&quot;;
            for (int col = 0; col &lt; 8; col++) {
                if (cells[row][col]) {
                    cout &lt;&lt; &quot; &quot; &lt;&lt; cells[row][col]-&gt;getSymbol();
                } else {
                    cout &lt;&lt; &quot; ·&quot;;
                }
            }
            cout &lt;&lt; &quot; │&quot; &lt;&lt; row + 1 &lt;&lt; endl;
        }

        cout &lt;&lt; &quot; └─────────────────┘&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;  a b c d e f g h\\n&quot; &lt;&lt; endl;
    }
};

// ============== Chess Game ==============

class ChessGame {
private:
    Board board;
    Color currentPlayer;
    GameStatus status;

    Position findKing(Color color) const {
        const auto&amp; cells = board.getCells();
        for (int row = 0; row &lt; 8; row++) {
            for (int col = 0; col &lt; 8; col++) {
                Piece* piece = cells[row][col];
                if (piece &amp;&amp; piece-&gt;getType() == PieceType::KING &amp;&amp;
                    piece-&gt;getColor() == color) {
                    return Position(row, col);
                }
            }
        }
        return Position(-1, -1);
    }

    bool isPositionUnderAttack(const Position&amp; pos, Color byColor) const {
        const auto&amp; cells = board.getCells();

        for (int row = 0; row &lt; 8; row++) {
            for (int col = 0; col &lt; 8; col++) {
                Piece* piece = cells[row][col];
                if (piece &amp;&amp; piece-&gt;getColor() == byColor) {
                    Position from(row, col);
                    if (piece-&gt;canMove(from, pos, cells)) {
                        return true;
                    }
                }
            }
        }
        return false;
    }

public:
    ChessGame() : currentPlayer(Color::WHITE), status(GameStatus::ACTIVE) {
        board.initialize();
    }

    bool makeMove(const Position&amp; from, const Position&amp; to) {
        if (!from.isValid() || !to.isValid()) {
            cout &lt;&lt; &quot;Invalid position!&quot; &lt;&lt; endl;
            return false;
        }

        Piece* piece = board.getPiece(from);

        if (!piece) {
            cout &lt;&lt; &quot;No piece at &quot; &lt;&lt; from.toString() &lt;&lt; endl;
            return false;
        }

        if (piece-&gt;getColor() != currentPlayer) {
            cout &lt;&lt; &quot;Not your piece!&quot; &lt;&lt; endl;
            return false;
        }

        Piece* targetPiece = board.getPiece(to);

        if (targetPiece &amp;&amp; targetPiece-&gt;getColor() == currentPlayer) {
            cout &lt;&lt; &quot;Cannot capture your own piece!&quot; &lt;&lt; endl;
            return false;
        }

        if (!piece-&gt;canMove(from, to, board.getCells())) {
            cout &lt;&lt; &quot;Illegal move for this piece!&quot; &lt;&lt; endl;
            return false;
        }

        // Make the move
        board.setPiece(to, piece);
        board.setPiece(from, nullptr);
        piece-&gt;setMoved();

        // Check if own king is in check (invalid move)
        Position kingPos = findKing(currentPlayer);
        Color opponentColor = (currentPlayer == Color::WHITE) ? Color::BLACK : Color::WHITE;

        if (isPositionUnderAttack(kingPos, opponentColor)) {
            // Undo move
            board.setPiece(from, piece);
            board.setPiece(to, targetPiece);
            cout &lt;&lt; &quot;Move puts your king in check!&quot; &lt;&lt; endl;
            return false;
        }

        // Delete captured piece
        if (targetPiece) {
            delete targetPiece;
            cout &lt;&lt; &quot;Captured &quot; &lt;&lt; targetPiece-&gt;getSymbol() &lt;&lt; &quot;!&quot; &lt;&lt; endl;
        }

        // Switch player
        currentPlayer = opponentColor;

        // Check for check/checkmate
        updateGameStatus();

        return true;
    }

    void updateGameStatus() {
        Position kingPos = findKing(currentPlayer);
        Color opponentColor = (currentPlayer == Color::WHITE) ? Color::BLACK : Color::WHITE;

        if (isPositionUnderAttack(kingPos, opponentColor)) {
            status = GameStatus::CHECK;
            cout &lt;&lt; &quot;CHECK!&quot; &lt;&lt; endl;
        } else {
            status = GameStatus::ACTIVE;
        }
    }

    void display() const {
        board.display();
        cout &lt;&lt; &quot;Current player: &quot; &lt;&lt; (currentPlayer == Color::WHITE ? &quot;White&quot; : &quot;Black&quot;) &lt;&lt; endl;
        if (status == GameStatus::CHECK) {
            cout &lt;&lt; &quot;⚠ King is in CHECK!&quot; &lt;&lt; endl;
        }
        cout &lt;&lt; endl;
    }

    Position parsePosition(const string&amp; pos) const {
        if (pos.length() != 2) return Position(-1, -1);

        int col = pos[0] - 'a';
        int row = pos[1] - '1';

        return Position(row, col);
    }
};
