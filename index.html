// ============== Post ==============

class Post {
private:
    string postId;
    User* author;
    string content;
    vector&lt;string&gt; hashtags;
    set&lt;User*&gt; likes;
    vector&lt;unique_ptr&lt;Comment&gt;&gt; comments;
    time_t timestamp;
    static int postCounter;

public:
    Post(User* a, const string&amp; content);

    string getId() const { return postId; }
    User* getAuthor() const { return author; }
    string getContent() const { return content; }
    time_t getTimestamp() const { return timestamp; }

    const vector&lt;string&gt;&amp; getHashtags() const { return hashtags; }

    void like(User* user) {
        likes.insert(user);
    }

    void unlike(User* user) {
        likes.erase(user);
    }

    bool isLikedBy(User* user) const {
        return likes.find(user) != likes.end();
    }

    int getLikeCount() const {
        return likes.size();
    }

    void addComment(User* user, const string&amp; text) {
        comments.push_back(make_unique&lt;Comment&gt;(user, text));
    }

    int getCommentCount() const {
        return comments.size();
    }

    // Engagement score for trending calculation
    double getEngagementScore() const {
        double currentTime = time(nullptr);
        double ageInHours = (currentTime - timestamp) / 3600.0;

        // Decay over time
        double decayFactor = 1.0 / (1.0 + ageInHours);

        return (likes.size() * 2 + comments.size() * 3) * decayFactor;
    }

    void display() const;

    void displayWithComments() const;
};

int Post::postCounter = 0;

// ============== User ==============

class User {
private:
    string userId;
    string username;
    string name;
    set&lt;User*&gt; followers;
    set&lt;User*&gt; following;
    vector&lt;Post*&gt; posts;

public:
    User(const string&amp; id, const string&amp; uname, const string&amp; n)
        : userId(id), username(uname), name(n) {}

    string getUserId() const { return userId; }
    string getUsername() const { return username; }
    string getName() const { return name; }

    void follow(User* user) {
        if (user != this) {
            following.insert(user);
            user-&gt;followers.insert(this);
        }
    }

    void unfollow(User* user) {
        following.erase(user);
        user-&gt;followers.erase(this);
    }

    bool isFollowing(User* user) const {
        return following.find(user) != following.end();
    }

    const set&lt;User*&gt;&amp; getFollowing() const { return following; }
    const set&lt;User*&gt;&amp; getFollowers() const { return followers; }

    void addPost(Post* post) {
        posts.push_back(post);
    }

    const vector&lt;Post*&gt;&amp; getPosts() const { return posts; }

    void displayProfile() const {
        cout &lt;&lt; &quot;\\n========== @&quot; &lt;&lt; username &lt;&lt; &quot; ==========&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;Name: &quot; &lt;&lt; name &lt;&lt; endl;
        cout &lt;&lt; &quot;Followers: &quot; &lt;&lt; followers.size() &lt;&lt; &quot; | Following: &quot; &lt;&lt; following.size() &lt;&lt; endl;
        cout &lt;&lt; &quot;Posts: &quot; &lt;&lt; posts.size() &lt;&lt; endl;
        cout &lt;&lt; &quot;================================\\n&quot; &lt;&lt; endl;
    }
};

Post::Post(User* a, const string&amp; c)
    : author(a), content(c), timestamp(time(nullptr)) {
    postId = &quot;P&quot; + to_string(++postCounter);

    // Extract hashtags
    istringstream iss(content);
    string word;
    while (iss &gt;&gt; word) {
        if (!word.empty() &amp;&amp; word[0] == '#') {
            hashtags.push_back(word);
        }
    }
}

// ============== Feed Generator ==============

class FeedGenerator {
public:
    static vector&lt;Post*&gt; generateFeed(User* user, const map&lt;string, unique_ptr&lt;Post&gt;&gt;&amp; allPosts,
                                     int limit = 10) {
        vector&lt;Post*&gt; feed;

        // Get posts from followed users
        for (User* followedUser : user-&gt;getFollowing()) {
            for (Post* post : followedUser-&gt;getPosts()) {
                feed.push_back(post);
            }
        }

        // Also include own posts
        for (Post* post : user-&gt;getPosts()) {
            feed.push_back(post);
        }

        // Sort by timestamp (most recent first)
        sort(feed.begin(), feed.end(), [](Post* a, Post* b) {
            return a-&gt;getTimestamp() &gt; b-&gt;getTimestamp();
        });

        // Limit results
        if (feed.size() &gt; limit) {
            feed.resize(limit);
        }

        return feed;
    }

    static vector&lt;Post*&gt; getTrendingPosts(const map&lt;string, unique_ptr&lt;Post&gt;&gt;&amp; allPosts,
                                         int limit = 10) {
        vector&lt;Post*&gt; trending;

        for (const auto&amp; [id, post] : allPosts) {
            trending.push_back(post.get());
        }

        // Sort by engagement score
        sort(trending.begin(), trending.end(), [](Post* a, Post* b) {
            return a-&gt;getEngagementScore() &gt; b-&gt;getEngagementScore();
        });

        // Limit results
        if (trending.size() &gt; limit) {
            trending.resize(limit);
        }

        return trending;
    }

    static vector&lt;Post*&gt; searchByHashtag(const string&amp; hashtag,
                                        const map&lt;string, unique_ptr&lt;Post&gt;&gt;&amp; allPosts) {
        vector&lt;Post*&gt; results;

        for (const auto&amp; [id, post] : allPosts) {
            const auto&amp; tags = post-&gt;getHashtags();
            if (find(tags.begin(), tags.end(), hashtag) != tags.end()) {
                results.push_back(post.get());
            }
        }

        // Sort by timestamp
        sort(results.begin(), results.end(), [](Post* a, Post* b) {
            return a-&gt;getTimestamp() &gt; b-&gt;getTimestamp();
        });

        return results;
    }
};

class SocialMediaPlatform {
private:
    map&lt;string, unique_ptr&lt;User&gt;&gt; users;
    map&lt;string, unique_ptr&lt;Post&gt;&gt; posts;

public:
    User* createUser(const string&amp; userId, const string&amp; username, const string&amp; name) {
        auto user = make_unique&lt;User&gt;(userId, username, name);
        User* userPtr = user.get();
        users[userId] = move(user);
        cout &lt;&lt; &quot;✓ User @&quot; &lt;&lt; username &lt;&lt; &quot; created&quot; &lt;&lt; endl;
        return userPtr;
    }

    Post* createPost(User* author, const string&amp; content) {
        auto post = make_unique&lt;Post&gt;(author, content);
        Post* postPtr = post.get();
        string postId = post-&gt;getId();

        posts[postId] = move(post);
        author-&gt;addPost(postPtr);

        cout &lt;&lt; &quot;✓ Post created by @&quot; &lt;&lt; author-&gt;getUsername() &lt;&lt; endl;
        return postPtr;
    }

    vector&lt;Post*&gt; getFeed(User* user, int limit = 10) {
        return FeedGenerator::generateFeed(user, posts, limit);
    }

    vector&lt;Post*&gt; getTrending(int limit = 10) {
        return FeedGenerator::getTrendingPosts(posts, limit);
    }

    vector&lt;Post*&gt; searchHashtag(const string&amp; hashtag) {
        return FeedGenerator::searchByHashtag(hashtag, posts);
    }

    void displayFeed(User* user) {
        cout &lt;&lt; &quot;\\n========== Feed for @&quot; &lt;&lt; user-&gt;getUsername() &lt;&lt; &quot; ==========&quot; &lt;&lt; endl;

            post-&gt;display();
        }
    }
};

class Split {

class Expense {
private:

    double amount;
    User* paidBy;

public:

        : amount(amt), paidBy(payer), splits(move(spls)), description(desc) {

        double totalSplitAmount = 0;

        for (auto&amp; split : splits) {
            totalSplitAmount += split-&gt;getAmount();

        return abs(totalSplitAmount - amount) &lt; 0.01;

// ============== Balance Sheet ==============

class BalanceSheet {
private:
    // balances[userA][userB] = amount means userA owes userB 'amount'
    map&lt;string, map&lt;string, double&gt;&gt; balances;

public:
    void addBalance(const string&amp; user1, const string&amp; user2, double amount) {
        if (amount == 0) return;

        balances[user1][user2] += amount;
        balances[user2][user1] -= amount;
    }

    double getBalance(const string&amp; user1, const string&amp; user2) {
        if (balances.find(user1) != balances.end()) {
            if (balances[user1].find(user2) != balances[user1].end()) {
                return balances[user1][user2];
            }
        }
        return 0;
    }

    void showBalances(User* user) {
        cout &lt;&lt; &quot;\\n=== Balances for &quot; &lt;&lt; user-&gt;getName() &lt;&lt; &quot; ===&quot; &lt;&lt; endl;

        bool hasBalance = false;
        if (balances.find(user-&gt;getId()) != balances.end()) {
            for (const auto&amp; [otherId, amount] : balances[user-&gt;getId()]) {
                if (abs(amount) &gt; 0.01) {
                    hasBalance = true;
                    if (amount &gt; 0) {
                        cout &lt;&lt; &quot;  You owe: $&quot; &lt;&lt; fixed &lt;&lt; setprecision(2) &lt;&lt; amount &lt;&lt; endl;
                    } else {
                        cout &lt;&lt; &quot;  Owes you: $&quot; &lt;&lt; fixed &lt;&lt; setprecision(2) &lt;&lt; -amount &lt;&lt; endl;
                    }
                }
            }
        }

        if (!hasBalance) {
            cout &lt;&lt; &quot;  No pending balances&quot; &lt;&lt; endl;
        }
    }

    void showAllBalances(const map&lt;string, unique_ptr&lt;User&gt;&gt;&amp; users) {
        cout &lt;&lt; &quot;\\n========== All Balances ==========&quot; &lt;&lt; endl;

        bool hasAnyBalance = false;
        for (const auto&amp; [userId1, userBalances] : balances) {
            for (const auto&amp; [userId2, amount] : userBalances) {
                if (amount &gt; 0.01) {  // Only show positive balances (to avoid duplicates)
                    hasAnyBalance = true;
                    cout &lt;&lt; users.at(userId1)-&gt;getName() &lt;&lt; &quot; owes &quot; 
                         &lt;&lt; users.at(userId2)-&gt;getName() &lt;&lt; &quot;: $&quot; 
                         &lt;&lt; fixed &lt;&lt; setprecision(2) &lt;&lt; amount &lt;&lt; endl;
                }
            }
        }

        if (!hasAnyBalance) {
            cout &lt;&lt; &quot;All settled up! 🎉&quot; &lt;&lt; endl;
        }
        cout &lt;&lt; &quot;==================================\\n&quot; &lt;&lt; endl;
    }

    void settleBalance(User* user1, User* user2) {
        double amount = getBalance(user1-&gt;getId(), user2-&gt;getId());

        if (abs(amount) &lt; 0.01) {
            cout &lt;&lt; &quot;No balance to settle between &quot; &lt;&lt; user1-&gt;getName() 
                 &lt;&lt; &quot; and &quot; &lt;&lt; user2-&gt;getName() &lt;&lt; endl;
            return;
        }

        if (amount &gt; 0) {
            cout &lt;&lt; user1-&gt;getName() &lt;&lt; &quot; paid $&quot; &lt;&lt; fixed &lt;&lt; setprecision(2) 
                 &lt;&lt; amount &lt;&lt; &quot; to &quot; &lt;&lt; user2-&gt;getName() &lt;&lt; endl;
        } else {
            cout &lt;&lt; user2-&gt;getName() &lt;&lt; &quot; paid $&quot; &lt;&lt; fixed &lt;&lt; setprecision(2) 
                 &lt;&lt; -amount &lt;&lt; &quot; to &quot; &lt;&lt; user1-&gt;getName() &lt;&lt; endl;
        }

        balances[user1-&gt;getId()][user2-&gt;getId()] = 0;
        balances[user2-&gt;getId()][user1-&gt;getId()] = 0;
    }
};

// ============== Splitwise ==============

class Splitwise {
private:
    map&lt;string, unique_ptr&lt;User&gt;&gt; users;
    vector&lt;unique_ptr&lt;Expense&gt;&gt; expenses;
    BalanceSheet balanceSheet;

public:
    User* addUser(const string&amp; id, const string&amp; name, const string&amp; email) {
        auto user = make_unique&lt;User&gt;(id, name, email);
        User* userPtr = user.get();
        users[id] = move(user);
        cout &lt;&lt; &quot;✓ User added: &quot; &lt;&lt; name &lt;&lt; endl;
        return userPtr;
    }

    User* getUser(const string&amp; id) {
        if (users.find(id) != users.end()) {
            return users[id].get();
        }
        return nullptr;
    }

    void addExpense(SplitType type, double amount, User* paidBy, 
                    vector&lt;User*&gt; participants, vector&lt;double&gt; values, 
                    const string&amp; description) {

        vector&lt;unique_ptr&lt;Split&gt;&gt; splits;

        switch (type) {
            case SplitType::EQUAL: {
                double splitAmount = amount / participants.size();
                for (User* user : participants) {
                    auto split = make_unique&lt;EqualSplit&gt;(user);
                    split-&gt;setAmount(splitAmount);
                    splits.push_back(move(split));
                }
                break;
            }

            case SplitType::EXACT: {
                for (size_t i = 0; i &lt; participants.size(); i++) {
                    auto split = make_unique&lt;ExactSplit&gt;(participants[i], values[i]);
                    splits.push_back(move(split));
                }
                break;
            }

            case SplitType::PERCENTAGE: {
                for (size_t i = 0; i &lt; participants.size(); i++) {
                    auto split = make_unique&lt;PercentSplit&gt;(participants[i], values[i]);
                    dynamic_cast&lt;PercentSplit*&gt;(split.get())-&gt;calculateAmount(amount);
                    splits.push_back(move(split));
                }
                break;
            }
        }

        auto expense = make_unique&lt;Expense&gt;(amount, paidBy, move(splits), description);

        if (!expense-&gt;validate()) {
            cout &lt;&lt; &quot;❌ Invalid expense: amounts don't match!&quot; &lt;&lt; endl;
            return;
        }

        // Update balances
        for (const auto&amp; split : expense-&gt;getSplits()) {
            if (split-&gt;getUser()-&gt;getId() != paidBy-&gt;getId()) {
                balanceSheet.addBalance(split-&gt;getUser()-&gt;getId(), 
                                       paidBy-&gt;getId(), 
                                       split-&gt;getAmount());
            }
        }

        cout &lt;&lt; &quot;✓ Expense added: &quot; &lt;&lt; description &lt;&lt; &quot; ($&quot; &lt;&lt; fixed 
             &lt;&lt; setprecision(2) &lt;&lt; amount &lt;&lt; &quot;)&quot; &lt;&lt; endl;
        expenses.push_back(move(expense));
    }

    void showBalances(User* user) {
        balanceSheet.showBalances(user);
    }

    void showAllBalances() {
        balanceSheet.showAllBalances(users);
    }

    void settleBalance(User* user1, User* user2) {
        balanceSheet.settleBalance(user1, user2);
    }
};

// ============== Demo ==============

int main() {
    Splitwise app;

    cout &lt;&lt; &quot;========== Splitwise Demo ==========\\n&quot; &lt;&lt; endl;

    // Add users
    User* alice = app.addUser(&quot;U1&quot;, &quot;Alice&quot;, &quot;alice@example.com&quot;);
    User* bob = app.addUser(&quot;U2&quot;, &quot;Bob&quot;, &quot;bob@example.com&quot;);
    User* charlie = app.addUser(&quot;U3&quot;, &quot;Charlie&quot;, &quot;charlie@example.com&quot;);
    User* diana = app.addUser(&quot;U4&quot;, &quot;Diana&quot;, &quot;diana@example.com&quot;);

    cout &lt;&lt; endl;

    // Expense 1: Equal split
    cout &lt;&lt; &quot;=== Expense 1: Dinner (Equal Split) ===&quot; &lt;&lt; endl;
    app.addExpense(SplitType::EQUAL, 1000, alice, 
                   {alice, bob, charlie, diana}, {}, 
                   &quot;Dinner at restaurant&quot;);

    app.showAllBalances();

    // Expense 2: Exact split
    cout &lt;&lt; &quot;\\n=== Expense 2: Shopping (Exact Split) ===&quot; &lt;&lt; endl;
    app.addExpense(SplitType::EXACT, 1250, bob, 
                   {alice, bob, charlie}, {370, 880, 0}, 
                   &quot;Shopping&quot;);

    app.showAllBalances();

    // Expense 3: Percentage split
    cout &lt;&lt; &quot;\\n=== Expense 3: Trip (Percentage Split) ===&quot; &lt;&lt; endl;
    app.addExpense(SplitType::PERCENTAGE, 3000, charlie, 
                   {alice, bob, charlie, diana}, {40, 20, 20, 20}, 
                   &quot;Weekend trip&quot;);

    app.showAllBalances();

    // Show individual balances
    app.showBalances(alice);
    app.showBalances(bob);

    // Settle some balances
    cout &lt;&lt; &quot;\\n=== Settling Balances ===&quot; &lt;&lt; endl;
    app.settleBalance(bob, alice);

    app.showAllBalances();

    return 0;
}

<h2 id="key-design-decisions">Key Design Decisions</h2>
<h3 id="1-split-strategy-pattern">1. <strong>Split Strategy Pattern</strong></h3>
<ul>

<li><code>EqualSplit</code>, <code>ExactSplit</code>, <code>PercentSplit</code></li>
<li>Easy to add new split types</li>
</ul>
<h3 id="2-balance-sheet">2. <strong>Balance Sheet</strong></h3>
<ul>
<li>Maintains bidirectional balances</li>
<li>Efficient lookup</li>
<li>Handles settlement</li>
</ul>
<h3 id="3-validation">3. <strong>Validation</strong></h3>
<ul>
<li>Ensure split amounts match total</li>
<li>Prevent invalid expenses</li>
<li>Clear error messages</li>
</ul>

class MusicPlayer {
private:
    Song* currentSong;
    PlayerState state;
    queue&lt;Song*&gt; playQueue;
    vector&lt;Song*&gt; history;
    bool shuffle;
    bool repeat;

public:
    MusicPlayer() : currentSong(nullptr), state(PlayerState::STOPPED), 
                    shuffle(false), repeat(false) {}

    void play(Song* song) {
        currentSong = song;
        state = PlayerState::PLAYING;
        history.push_back(song);

        cout &lt;&lt; &quot;\\n▶️  Now Playing: &quot;;
        song-&gt;display();
        cout &lt;&lt; &quot; by &quot; &lt;&lt; song-&gt;getArtist()-&gt;getName() &lt;&lt; endl;
    }

    void pause() {
        if (state == PlayerState::PLAYING) {
            state = PlayerState::PAUSED;
            cout &lt;&lt; &quot;⏸️  Paused&quot; &lt;&lt; endl;
        }
    }

    void resume() {
        if (state == PlayerState::PAUSED) {
            state = PlayerState::PLAYING;
            cout &lt;&lt; &quot;▶️  Resumed&quot; &lt;&lt; endl;
        }
    }

    void stop() {
        state = PlayerState::STOPPED;
        currentSong = nullptr;
        cout &lt;&lt; &quot;⏹️  Stopped&quot; &lt;&lt; endl;
    }

    void next() {
        if (!playQueue.empty()) {
            Song* nextSong = playQueue.front();
            playQueue.pop();
            play(nextSong);
        } else {
            cout &lt;&lt; &quot;No more songs in queue&quot; &lt;&lt; endl;
        }
    }

    void addToQueue(Song* song) {
        playQueue.push(song);
        cout &lt;&lt; &quot;✓ Added to queue: &quot;;
        song-&gt;display();
        cout &lt;&lt; endl;
    }

    void showQueue() const {
        if (playQueue.empty()) {
            cout &lt;&lt; &quot;Queue is empty&quot; &lt;&lt; endl;
            return;
        }

        cout &lt;&lt; &quot;\\n=== Play Queue ===&quot; &lt;&lt; endl;
        queue&lt;Song*&gt; temp = playQueue;
        int i = 1;
        while (!temp.empty()) {
            cout &lt;&lt; i++ &lt;&lt; &quot;. &quot;;
            temp.front()-&gt;display();
            cout &lt;&lt; endl;
            temp.pop();
        }
    }

    void showHistory() const {
        cout &lt;&lt; &quot;\\n=== Play History ===&quot; &lt;&lt; endl;
        for (int i = history.size() - 1; i &gt;= 0 &amp;&amp; i &gt;= (int)history.size() - 10; i--) {
            history[i]-&gt;display();
            cout &lt;&lt; endl;
        }
    }

    Song* getCurrentSong() const { return currentSong; }
    PlayerState getState() const { return state; }
};

// ============== Music Library ==============

class MusicLibrary {
private:
    map&lt;string, unique_ptr&lt;Song&gt;&gt; songs;
    map&lt;string, unique_ptr&lt;Artist&gt;&gt; artists;
    map&lt;string, unique_ptr&lt;Album&gt;&gt; albums;

public:
    Artist* addArtist(const string&amp; name) {
        auto artist = make_unique&lt;Artist&gt;(name);
        Artist* ptr = artist.get();
        artists[ptr-&gt;getId()] = move(artist);
        return ptr;
    }

    Song* addSong(const string&amp; title, Artist* artist, int duration, const string&amp; genre) {
        auto song = make_unique&lt;Song&gt;(title, artist, duration, genre);
        Song* ptr = song.get();
        songs[ptr-&gt;getId()] = move(song);
        artist-&gt;addSong(ptr);
        return ptr;
    }

    Album* addAlbum(const string&amp; title, Artist* artist, int year) {
        auto album = make_unique&lt;Album&gt;(title, artist, year);
        Album* ptr = album.get();
        albums[ptr-&gt;getId()] = move(album);
        return ptr;
    }

    vector&lt;Song*&gt; searchSongs(const string&amp; query) {
        vector&lt;Song*&gt; results;
        for (const auto&amp; [id, song] : songs) {
            if (song-&gt;getTitle().find(query) != string::npos) {
                results.push_back(song.get());
            }
        }
        return results;
    }

    vector&lt;Artist*&gt; searchArtists(const string&amp; query) {
        vector&lt;Artist*&gt; results;
        for (const auto&amp; [id, artist] : artists) {
            if (artist-&gt;getName().find(query) != string::npos) {
                results.push_back(artist.get());
            }
        }
        return results;
    }
};

private:

    map&lt;string, unique_ptr&lt;User&gt;&gt; users;

                       UserType type = UserType::FREE) {
        auto user = make_unique&lt;User&gt;(name, email, type);
        User* ptr = user.get();
        users[ptr-&gt;getId()] = move(user);
        cout &lt;&lt; &quot;✓ User registered: &quot; &lt;&lt; name &lt;&lt; &quot; (&quot; 
             &lt;&lt; (type == UserType::PREMIUM ? &quot;Premium&quot; : &quot;Free&quot;) &lt;&lt; &quot;)&quot; &lt;&lt; endl;
        return ptr;

    MusicLibrary&amp; getLibrary() { return library; }

    void search(const string&amp; query) {
        cout &lt;&lt; &quot;\\n=== Search Results for: &quot; &lt;&lt; query &lt;&lt; &quot; ===&quot; &lt;&lt; endl;

        auto songs = library.searchSongs(query);
        if (!songs.empty()) {
            cout &lt;&lt; &quot;\\nSongs:&quot; &lt;&lt; endl;
            for (auto song : songs) {
                cout &lt;&lt; &quot;  &quot;;
                song-&gt;display();
                cout &lt;&lt; &quot; by &quot; &lt;&lt; song-&gt;getArtist()-&gt;getName() &lt;&lt; endl;
            }

        auto artists = library.searchArtists(query);
        if (!artists.empty()) {
            cout &lt;&lt; &quot;\\nArtists:&quot; &lt;&lt; endl;
            for (auto artist : artists) {
                cout &lt;&lt; &quot;  &quot;;
                artist-&gt;display();
            }
        }
    }
};

function prettify(component) {
    let c = component.replace(/^[0-9]+[_-]/, '');

    if (c.toLowerCase() === 'readme') return 'README';
    if (c.toLowerCase() === 'cheatsheet') return 'Cheatsheet';
    return c.replace(/\b\w/g, l => l.toUpperCase());
}

/* ───── Cross-document link resolution (supports nested folders) ─────
   Docs may live in sub-directories and link to each other with relative
   paths ("../03_patterns/README.md"), bare files ("CHEATSHEET.md") or even a
   folder ("01_pthreads/"), which we resolve to that folder's README. */
const BY_PATH = {};        // "01_pthreads/readme.md"  -> idx
const BY_DIR_README = {};  // "01_pthreads" / ""        -> idx (README of dir)
const BY_BASENAME = {};    // "cheatsheet.md"           -> idx (only if unique)
const BASENAME_DUP = {};

TAB_DATA.forEach((tab, idx) => {
    const path = (tab.path || '').toLowerCase();
    if (path) BY_PATH[path] = idx;
    const base = path.split('/').pop();
    if (base) {
        if (Object.prototype.hasOwnProperty.call(BY_BASENAME, base)) BASENAME_DUP[base] = true;
        else BY_BASENAME[base] = idx;
    }
    if (base === 'readme.md') {
        BY_DIR_README[(tab.dir || '').toLowerCase()] = idx;
    }
});
Object.keys(BASENAME_DUP).forEach(b => { delete BY_BASENAME[b]; });

/* Join a relative href onto a base directory and normalize . / .. segments. */
function joinPath(baseDir, rel) {
    if (rel.charAt(0) === '/') { baseDir = ''; rel = rel.replace(/^\/+/, ''); }
    const parts = (baseDir ? baseDir.split('/') : []).concat(rel.split('/'));
    const out = [];
    for (const p of parts) {
        if (p === '' || p === '.') continue;
        if (p === '..') { out.pop(); continue; }
        out.push(p);
    }
    return out.join('/');
}

function mdTarget(rawHref, baseDir) {
    if (!rawHref || rawHref.charAt(0) === '#') return null;
    if (/^[a-z][a-z0-9+.-]*:\/\//i.test(rawHref) || /^(mailto|tel):/i.test(rawHref)) return null;

    let anchor = '';
    let pathPart = rawHref;
    const hashIdx = pathPart.indexOf('#');
    if (hashIdx >= 0) {
        anchor = pathPart.substring(hashIdx + 1);
        pathPart = pathPart.substring(0, hashIdx);
        try { anchor = decodeURIComponent(anchor); } catch (e) {}
    }
    const qIdx = pathPart.indexOf('?');
    if (qIdx >= 0) pathPart = pathPart.substring(0, qIdx);
    if (!pathPart) return null;

    const joined = joinPath(baseDir || '', pathPart).toLowerCase();
    let idx;
    if (/\.md$/i.test(pathPart)) {
        idx = BY_PATH[joined];
        if (idx === undefined) {
            const base = joined.split('/').pop();
            idx = BY_BASENAME[base];
        }
    } else {
        // a directory reference -> that folder's README
        idx = BY_DIR_README[joined];
    }
    if (idx === undefined) return null;
    return { idx: idx, anchor: anchor };
}

function baseDirOf(node) {
    const panel = node && node.closest ? node.closest('.tab-content') : null;
    return panel ? (panel.dataset.dir || '') : '';
}

/* Tag links so we can style internal navigation distinctly from external ones. */
function classifyLinks() {
    document.querySelectorAll('.tab-content a[href]').forEach(a => {
        const href = a.getAttribute('href');
        if (!href) return;
        if (href.charAt(0) === '#') {
            a.classList.add('anchor-link');
        } else if (mdTarget(href, baseDirOf(a))) {
            a.classList.add('xref-link');
        } else if (/^[a-z][a-z0-9+.-]*:\/\//i.test(href)) {
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
        }
    });
}

function addCopyButton(pre, block) {
    const btn = document.createElement('button');
    btn.className = 'code-copy-btn';
    btn.type = 'button';
    btn.textContent = 'Copy';
    btn.addEventListener('click', () => {
        const text = block.innerText;
        const done = () => {
            btn.textContent = 'Copied';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1600);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
        } else {
            fallbackCopy(text, done);
        }
    });
    pre.appendChild(btn);
}

function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
}

function highlightAllCode() {
    document.querySelectorAll('.tab-content pre code').forEach(block => {
        if (block.dataset.highlighted === '1') return;
        const pre = block.closest('pre');
        const langClass = Array.from(block.classList).find(c => c.startsWith('language-'));
        if (langClass) {
            const lang = langClass.replace('language-', '');
            const label = document.createElement('span');
            label.className = 'code-lang-label';
            label.textContent = lang;
            pre.appendChild(label);
        }
        hljs.highlightElement(block);
        addCopyButton(pre, block);
        block.dataset.highlighted = '1';
    });
}

function activateTab(idx, resetScroll) {
    if (resetScroll === undefined) resetScroll = true;
    document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + idx).classList.add('active');
    docSelect.value = String(idx);
    docList.querySelectorAll('a').forEach(a => {
        a.classList.toggle('nav-doc-active', parseInt(a.dataset.docIdx, 10) === idx);
    });
    const activeLink = docList.querySelector(`a[data-doc-idx="${idx}"]`);
    if (activeLink) {
        let parent = activeLink.closest('.nav-dir-item');
        while (parent) {
            parent.classList.add('expanded');
            parent = parent.parentElement.closest('.nav-dir-item');
        }
    }
    if (window.innerWidth <= 1024) {
        sidebarNav.classList.add('collapsed');
        document.body.classList.add('sidebar-collapsed');
        const tSidebar = document.getElementById('tocSidebar');
        if (tSidebar) {
            tSidebar.classList.add('collapsed');
            document.body.classList.add('toc-collapsed');
        }
    }
    history.replaceState(null, null, '#tab-' + idx);
    if (typeof buildToc === 'function') buildToc(idx);
    // Reflect the active document's title in the condensing navbar.
    if (navDocTitle && TAB_DATA[idx]) {
        navDocTitle.textContent = TAB_DATA[idx].name.replace(/^\s*\d+\.\s*/, '');
    }
    // Jump back to the top when switching documents so the reader starts at
    // the beginning rather than wherever the previous doc was scrolled to.
    if (resetScroll) {
        window.scrollTo({ top: 0, behavior: 'auto' });
        document.body.classList.remove('nav-condensed');
        navLastY = 0;
    }
}

/* ───── Search index: pre-extract plain text per block ───── */

const searchIndex = [];

TAB_DATA.forEach((tab, tabIdx) => {
    const tmp = document.createElement('div');
    tmp.innerHTML = tab.body;
    let currentHeading = '';

    function walk(node) {
        for (const child of node.childNodes) {
            if (child.nodeType === Node.ELEMENT_NODE) {
                const tag = child.tagName;
                if (/^H[1-6]$/.test(tag)) {
                    currentHeading = child.textContent.trim();
                }
                const text = child.textContent.trim();
                if (text.length > 0) {
                    searchIndex.push({
                        tabIdx: tabIdx,
                        tabName: tab.name,
                        heading: currentHeading,
                        text: text,
                        tag: tag
                    });
                }
                if (/^(P|LI|TD|TH|BLOCKQUOTE|PRE|H[1-6])$/.test(tag)) {
                    continue;
                }
                walk(child);
            }
        }
    }
    walk(tmp);
});

const overlay = document.getElementById('searchOverlay');

function openSearch() {
    overlay.classList.add('open');

    searchInput.focus();
    srBody.innerHTML = '<div class="sr-empty">Type to search across all tabs</div>';
    srCount.textContent = '';
    srActiveIdx = -1;

function closeSearch() {
    overlay.classList.remove('open');
    searchInput.value = '';
}

searchTrigger.addEventListener('click', openSearch);

overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeSearch();
});

document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        if (overlay.classList.contains('open')) closeSearch();
        else openSearch();
        return;
    }
    if (e.key === '/' && !overlay.classList.contains('open') &&
        !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) {
        e.preventDefault();
        openSearch();
        return;
    }
    if (e.key === 'Escape' && overlay.classList.contains('open')) {
        closeSearch();
        return;
    }
    if (overlay.classList.contains('open')) {
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (srResults.length > 0) {
                srActiveIdx = Math.min(srActiveIdx + 1, srResults.length - 1);
                updateActiveResult();
            }
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (srResults.length > 0) {
                srActiveIdx = Math.max(srActiveIdx - 1, 0);
                updateActiveResult();
            }
        } else if (e.key === 'Enter') {
            e.preventDefault();
            if (srActiveIdx >= 0 && srActiveIdx < srResults.length) {
                navigateToResult(srResults[srActiveIdx]);
            }
        }
    }
});

function updateActiveResult() {
    srBody.querySelectorAll('.sr-item').forEach((el, i) => {
        el.classList.toggle('sr-active', i === srActiveIdx);
    });
    const active = srBody.querySelector('.sr-active');
    if (active) active.scrollIntoView({ block: 'nearest' });
}

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function highlightSnippet(text, query, maxLen) {
    const lower = text.toLowerCase();
    const qLower = query.toLowerCase();
    const pos = lower.indexOf(qLower);
    if (pos < 0) return text.substring(0, maxLen);

    const pad = Math.floor((maxLen - query.length) / 2);
    let start = Math.max(0, pos - pad);
    let end = Math.min(text.length, pos + query.length + pad);
    let snippet = text.substring(start, end);
    if (start > 0) snippet = '...' + snippet;
    if (end < text.length) snippet = snippet + '...';

    const re = new RegExp('(' + escapeRegex(query) + ')', 'gi');
    return snippet.replace(re, '<mark>$1</mark>');
}

let searchTimer = null;
searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, 120);
});

function runSearch() {
    const query = searchInput.value.trim();
    if (query.length < 2) {
        srBody.innerHTML = '<div class="sr-empty">Type at least 2 characters</div>';
        srCount.textContent = '';
        srResults = [];
        srActiveIdx = -1;
        return;
    }

    const qLower = query.toLowerCase();
    const matches = [];
    const seen = new Set();

    for (const entry of searchIndex) {
        if (entry.text.toLowerCase().includes(qLower)) {
            const key = entry.tabIdx + ':' + entry.heading + ':' + entry.text.substring(0, 80);
            if (seen.has(key)) continue;
            seen.add(key);
            matches.push(entry);
            if (matches.length >= 100) break;
        }
    }

    srResults = matches;
    srActiveIdx = matches.length > 0 ? 0 : -1;

    if (matches.length === 0) {
        srBody.innerHTML = '<div class="sr-empty">No results for "' +
            query.replace(/</g,'&lt;') + '"</div>';
        srCount.textContent = '0 results';
        return;
    }

    srCount.textContent = matches.length >= 100 ? '100+ results' : matches.length + ' result' + (matches.length > 1 ? 's' : '');

    let html = '';
    matches.forEach((m, i) => {
        const snippet = highlightSnippet(m.text, query, 160);
        html += '<div class="sr-item' + (i === 0 ? ' sr-active' : '') + '" data-ridx="' + i + '">';
        html += '<div class="sr-item-tab">' + m.tabName + '</div>';
        if (m.heading) html += '<div class="sr-item-heading">' + m.heading.replace(/</g,'&lt;') + '</div>';
        html += '<div class="sr-item-snippet">' + snippet + '</div>';
        html += '</div>';
    });
    srBody.innerHTML = html;

    srBody.querySelectorAll('.sr-item').forEach(el => {
        el.addEventListener('click', () => {
            const idx = parseInt(el.dataset.ridx, 10);
            navigateToResult(srResults[idx]);
        });
    });
}

function navigateToResult(result) {
    const savedQuery = searchInput.value.trim() || result.text.substring(0, 20);
    closeSearch();
    activateTab(result.tabIdx, false);

    requestAnimationFrame(() => {
        clearHighlights();
        const panel = document.getElementById('panel-' + result.tabIdx);
        const qLower = savedQuery.toLowerCase();
        const qLen = savedQuery.length;

        const hits = [];
        const walker = document.createTreeWalker(panel, NodeFilter.SHOW_TEXT);
        while (walker.nextNode()) {
            const node = walker.currentNode;
            const idx = node.textContent.toLowerCase().indexOf(qLower);
            if (idx >= 0) {
                hits.push({ node: node, offset: idx });
            }
        }

        let firstMark = null;
        for (let i = hits.length - 1; i >= 0; i--) {
            const h = hits[i];
            const range = document.createRange();
            range.setStart(h.node, h.offset);
            range.setEnd(h.node, h.offset + qLen);
            const mark = document.createElement('span');
            mark.className = 'search-highlight';
            mark.dataset.searchHighlight = '1';
            try { range.surroundContents(mark); firstMark = mark; } catch(e) {}
        }

        if (firstMark) {
            firstMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        setTimeout(clearHighlights, 6000);
    });
}

function clearHighlights() {
    document.querySelectorAll('[data-search-highlight]').forEach(el => {
        const parent = el.parentNode;
        parent.replaceChild(document.createTextNode(el.textContent), el);
        parent.normalize();
    });
}

/* ───── Sidebar TOC + scroll spy ───── */

const sidebarNav = document.getElementById('sidebarNav');
const navList = document.getElementById('navList');
const sidebarToggle = document.getElementById('sidebarToggle');
let currentTocHeadings = [];

function buildToc(panelIdx) {
    navList.innerHTML = '';
    currentTocHeadings = [];
    const panel = document.getElementById('panel-' + panelIdx);
    if (!panel) return;
    const headings = panel.querySelectorAll('h1, h2, h3, h4');
    headings.forEach((h, i) => {
        if (!h.id) h.id = 'autoid-' + panelIdx + '-' + i;
        const level = h.tagName.substring(1);
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        a.className = 'nav-h' + level;
        a.title = h.textContent;
        a.dataset.headingId = h.id;
        a.addEventListener('click', function(e) {
            e.preventDefault();
            h.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        li.appendChild(a);
        navList.appendChild(li);
        currentTocHeadings.push({ el: h, link: a });
    });
    updateScrollSpy();
}

let spyRaf = null;
function updateScrollSpy() {
    if (spyRaf) return;
    spyRaf = requestAnimationFrame(() => {
        spyRaf = null;
        if (currentTocHeadings.length === 0) return;
        const scrollY = window.scrollY;
        const offset = 80;
        let activeEntry = currentTocHeadings[0];
        for (const entry of currentTocHeadings) {
            if (entry.el.offsetTop <= scrollY + offset) {
                activeEntry = entry;
            } else {
                break;
            }
        }
        currentTocHeadings.forEach(e => e.link.classList.remove('nav-active'));
        if (activeEntry) {
            activeEntry.link.classList.add('nav-active');
            const linkTop = activeEntry.link.offsetTop;
            const navH = sidebarNav.clientHeight;
            const navScroll = sidebarNav.scrollTop;
            if (linkTop < navScroll + 40 || linkTop > navScroll + navH - 40) {
                sidebarNav.scrollTo({ top: linkTop - navH / 3, behavior: 'smooth' });
            }
        }
    });
}

window.addEventListener('scroll', updateScrollSpy, { passive: true });

/* ───── iOS-style condensing navbar (hide on scroll down, show on scroll up) ───── */
function updateNavCondense() {
    const y = window.scrollY;
    const NAV_TOP = 8;       // always expanded near the very top
    const NAV_TRIGGER = 72;  // must scroll past this before condensing
    const DELTA = 5;         // ignore tiny jitters
    if (y <= NAV_TOP) {
        document.body.classList.remove('nav-condensed');
    } else if (y > navLastY + DELTA && y > NAV_TRIGGER) {
        document.body.classList.add('nav-condensed');   // scrolling down
    } else if (y < navLastY - DELTA) {
        document.body.classList.remove('nav-condensed'); // scrolling up
    }
    navLastY = y;
}
window.addEventListener('scroll', updateNavCondense, { passive: true });

const tocSidebar = document.getElementById('tocSidebar');
const tocToggle = document.getElementById('tocToggle');

function toggleSidebar() {
    const collapsed = sidebarNav.classList.toggle('collapsed');
    document.body.classList.toggle('sidebar-collapsed', collapsed);
    if (!collapsed && window.innerWidth <= 1024) {
        tocSidebar.classList.add('collapsed');
        document.body.classList.add('toc-collapsed');
    }
}

function toggleToc() {
    const collapsed = tocSidebar.classList.toggle('collapsed');
    document.body.classList.toggle('toc-collapsed', collapsed);
    if (!collapsed && window.innerWidth <= 1024) {
        sidebarNav.classList.add('collapsed');
        document.body.classList.add('sidebar-collapsed');
    }
}

sidebarToggle.addEventListener('click', toggleSidebar);
tocToggle.addEventListener('click', toggleToc);

document.addEventListener('click', (e) => {
    if (window.innerWidth <= 1024) {
        if (!sidebarNav.contains(e.target) && !tocSidebar.contains(e.target) &&
            !sidebarToggle.contains(e.target) && !tocToggle.contains(e.target)) {
            sidebarNav.classList.add('collapsed');
            document.body.classList.add('sidebar-collapsed');
            tocSidebar.classList.add('collapsed');
            document.body.classList.add('toc-collapsed');
        }
    }
});

document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'b' && !overlay.classList.contains('open')) {
        e.preventDefault();
        toggleSidebar();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'i' && !overlay.classList.contains('open')) {
        e.preventDefault();
        toggleToc();
    }
});

/* ───── Anchor + cross-document link interception ───── */

/* Find an element by id, preferring the given panel (heading ids can collide
   across documents because each file is converted independently). */
function findById(id, preferredPanel) {
    if (preferredPanel) {
        const scoped = preferredPanel.querySelector('[id="' + id.replace(/(["\\])/g, '\\$1') + '"]');
        if (scoped) return scoped;
    }
    return document.getElementById(id);
}

function scrollToTarget(target) {
    requestAnimationFrame(() => target.scrollIntoView({ behavior: 'smooth', block: 'start' }));
}

function gotoAnchor(idx, anchor) {
    activateTab(idx, !anchor);
    const panel = document.getElementById('panel-' + idx);
    if (anchor) {
        const target = findById(anchor, panel);
        if (target) { scrollToTarget(target); return; }
    }
}

document.addEventListener('click', function(e) {
    const link = e.target.closest('a[href]');
    if (!link) return;
    const href = link.getAttribute('href');
    if (!href) return;

    // In-page anchor: resolve within the panel that owns the link first.
    if (href.charAt(0) === '#') {
        const id = href.substring(1);
        if (!id) return;
        const ownerPanel = link.closest('.tab-content');
        const target = findById(id, ownerPanel);
        if (target) {
            e.preventDefault();
            const dest = target.closest('.tab-content');
            if (dest) {
                const m = dest.id.match(/^panel-(\d+)$/);
                if (m) activateTab(parseInt(m[1], 10), false);
            }
            scrollToTarget(target);
        }
        return;
    }

    // Cross-document link to another bundled doc (file or folder), optionally #anchor.
    const md = mdTarget(href, baseDirOf(link));
    if (md) {
        e.preventDefault();
        gotoAnchor(md.idx, md.anchor);
    }
});

/* ───── Startup ───── */
/* - Nagesh N Nazare - */

const hash = location.hash || '';
const tabMatch = hash.match(/^#tab-(\d+)$/);
if (tabMatch) {
    activateTab(Math.min(parseInt(tabMatch[1], 10), TAB_DATA.length - 1));
} else if (hash.length > 1) {
    const targetId = hash.substring(1);
    const target = document.getElementById(targetId);
    if (target) {
        const panels = document.querySelectorAll('.tab-content');
        for (let i = 0; i < panels.length; i++) {
            if (panels[i].contains(target)) {
                activateTab(i, false);
                requestAnimationFrame(() => {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
                break;
            }
        }
    } else {
        activateTab(0);
    }
} else {
    activateTab(0);
}
</script>
