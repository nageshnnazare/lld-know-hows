<h2 id="pattern-comparison">Pattern Comparison</h2>
<table>
<thead>
<tr>
<th>Pattern</th>
<th>Purpose</th>
<th>Key Benefit</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Adapter</strong></td>
<td>Interface conversion</td>
<td>Makes incompatible interfaces work together</td>
</tr>
<tr>
<td><strong>Decorator</strong></td>
<td>Add responsibilities</td>
<td>Dynamic feature addition without subclassing</td>
</tr>
<tr>
<td><strong>Facade</strong></td>
<td>Simplified interface</td>
<td>Hide subsystem complexity</td>
</tr>
<tr>
<td><strong>Composite</strong></td>
<td>Tree structures</td>
<td>Treat individual/composite objects uniformly</td>
</tr>
<tr>
<td><strong>Proxy</strong></td>
<td>Controlled access</td>
<td>Lazy loading, access control, remote access</td>
</tr>
<tr>
<td><strong>Bridge</strong></td>
<td>Decouple abstraction</td>
<td>Independent variation of abstraction &amp; implementation</td>
</tr>
<tr>
<td><strong>Flyweight</strong></td>
<td>Share objects</td>
<td>Reduce memory usage with many similar objects</td>
</tr>
</tbody>
</table>
<hr />
<h2 id="when-to-use-which-pattern">When to Use Which Pattern?</h2>
<h3 id="choose-adapter-when">Choose Adapter when:</h3>
<ul>
<li>You have existing class with wrong interface</li>
<li>You want to reuse incompatible code</li>
</ul>
<h3 id="choose-decorator-when">Choose Decorator when:</h3>
<ul>
<li>You need to add responsibilities dynamically</li>
<li>Subclassing would create too many classes</li>
</ul>
<h3 id="choose-facade-when">Choose Facade when:</h3>
<ul>
<li>You have complex subsystem to simplify</li>
<li>You want to layer your architecture</li>
</ul>
<h3 id="choose-composite-when">Choose Composite when:</h3>
<ul>
<li>You have tree/hierarchical structures</li>
<li>You want to treat parts and whole uniformly</li>
</ul>
<h3 id="choose-proxy-when">Choose Proxy when:</h3>
<ul>
<li>You need lazy initialization</li>
<li>You need access control</li>
<li>You need logging/caching</li>
</ul>
<h3 id="choose-bridge-when">Choose Bridge when:</h3>
<ul>
<li>You want to avoid permanent binding</li>
<li>Both abstraction and implementation need to vary</li>
</ul>
<h3 id="choose-flyweight-when">Choose Flyweight when:</h3>
<ul>
<li>You have many similar objects</li>
<li>Memory is a concern</li>
</ul>

<strong>Bridge</strong>: Drawing APIs, device drivers<br />
<strong>Flyweight</strong>: Text editor characters, game particles  </p>

<h2 id="1-strategy-pattern">1. Strategy Pattern</h2>
<p><strong>Intent</strong>: Define a family of algorithms, encapsulate each one, and make them interchangeable. Strategy lets the algorithm vary independently from clients that use it.</p>
<p><strong>When to Use</strong>:
- Multiple related classes differ only in behavior
- You need different variants of an algorithm
- Algorithm uses data that clients shouldn&rsquo;t know about
- Class has many conditional statements</p>
<h3 id="structure">Structure</h3>
<pre><code>┌─────────────┐
│   Context   │
├─────────────┤
│ - strategy  │───────┐
├─────────────┤       │
│ +execute()  │       ▼
└─────────────┘  ┌──────────────┐
                 │   Strategy   │ (interface)
                 ├──────────────┤
                 │+algorithm()  │
                 └──────△───────┘
                        │
          ┌─────────────┼─────────────┬─────────────┐
          │             │             │             │
   ┌──────▼───────┐  ┌──▼──────────┐  ┌──▼──────────┐
   │ConcreteStratA│  │ConcreteStratB│ │ConcreteStratC│
   ├──────────────┤  ├──────────────┤ ├──────────────┤
   │+ algorithm() │  │+ algorithm() │ │+ algorithm() │
   └──────────────┘  └──────────────┘ └──────────────┘
</code></pre>

class PaymentStrategy {

             &lt;&lt; cardNumber.substr(cardNumber.length() - 4) &lt;&lt; endl;

// Concrete Strategy B

    void pay(double amount) override {

             &lt;&lt; walletAddress.substr(0, 8) &lt;&lt; &quot;...&quot; &lt;&lt; endl;

<h2 id="2-observer-pattern">2. Observer Pattern</h2>
<p><strong>Intent</strong>: Define a one-to-many dependency between objects so that when one object changes state, all its dependents are notified and updated automatically.</p>
<p><strong>When to Use</strong>:
- Changes to one object require changing others
- Object should notify others without assumptions about who they are
- Event handling systems
- Publish-subscribe systems</p>
<h3 id="structure_1">Structure</h3>
<pre><code>┌──────────────┐         ┌──────────────┐
│   Subject    │◄────────│   Observer   │
├──────────────┤         │ (interface)  │
│- observers   │         ├──────────────┤
│+ attach()    │         │ + update()   │
│+ detach()    │         └──────△───────┘
│+ notify()    │                │
└──────△───────┘          ┌─────┴─────┐
       │                  │             │
┌──────▼──────┐    ┌──────▼──────┐ ┌─────▼──────┐
│ConcreteSubject│  │ConcreteObsA │ │ConcreteObsB│
├─────────────┤    ├─────────────┤ ├────────────┤
│- state      │    │ + update()  │ │ + update() │
│+ getState() │    └─────────────┘ └────────────┘
│+ setState() │
└─────────────┘
</code></pre>
<h3 id="c-implementation_1">C++ Implementation</h3>
<pre><code class="language-cpp">#include &lt;iostream&gt;
#include &lt;vector&gt;
#include &lt;string&gt;
#include &lt;algorithm&gt;

using namespace std;

// Observer interface
class Observer {
public:
    virtual ~Observer() = default;
    virtual void update(const string&amp; message) = 0;
};

// Subject
class NewsAgency {
private:
    vector&lt;Observer*&gt; observers;
    string latestNews;

public:
    void attach(Observer* observer) {
        observers.push_back(observer);
    }

    void detach(Observer* observer) {
        observers.erase(remove(observers.begin(), observers.end(), observer), observers.end());
    }

    void setNews(const string&amp; news) {
        latestNews = news;
        notify();
    }

    void notify() {
        for (Observer* observer : observers) {
            observer-&gt;update(latestNews);
        }
    }
};

// Concrete Observer A
class NewsChannel : public Observer {
private:
    string channelName;

public:
    NewsChannel(const string&amp; name) : channelName(name) {}

    void update(const string&amp; message) override {
        cout &lt;&lt; channelName &lt;&lt; &quot; received news: &quot; &lt;&lt; message &lt;&lt; endl;
    }
};

// Concrete Observer B
class MobileApp : public Observer {
private:
    string userId;

public:
    MobileApp(const string&amp; user) : userId(user) {}

    void update(const string&amp; message) override {
        cout &lt;&lt; &quot;Push notification to &quot; &lt;&lt; userId &lt;&lt; &quot;: &quot; &lt;&lt; message &lt;&lt; endl;
    }
};

// Concrete Observer C
class EmailSubscriber : public Observer {
private:
    string email;

public:
    EmailSubscriber(const string&amp; e) : email(e) {}

    void update(const string&amp; message) override {
        cout &lt;&lt; &quot;Email sent to &quot; &lt;&lt; email &lt;&lt; &quot;: &quot; &lt;&lt; message &lt;&lt; endl;
    }
};
</code></pre>
<p><strong>Usage Example</strong>:</p>
<pre><code class="language-cpp">NewsAgency agency;

// Unsubscribe one observer

<h2 id="3-command-pattern">3. Command Pattern</h2>
<p><strong>Intent</strong>: Encapsulate a request as an object, thereby letting you parameterize clients with different requests, queue or log requests, and support undoable operations.</p>
<p><strong>When to Use</strong>:
- Parameterize objects with operations
- Queue operations
- Support undo/redo
- Log changes for crash recovery
- Structure system around high-level operations</p>
<h3 id="structure_2">Structure</h3>
<pre><code>┌──────────────┐       ┌──────────────┐
│   Client     │──────&gt;│   Invoker    │
└──────────────┘       ├──────────────┤
                       │- command     │
                       │+ execute()   │
                       └──────┬───────┘
                              │
                              ▼
                       ┌──────────────┐
                       │   Command    │ (interface)
                       ├──────────────┤
                       │ + execute()  │
                       │ + undo()     │
                       └──────△───────┘
                              │
                       ┌──────┴───────┐
                ┌──────▼──────┐  ┌────▼──────┐
                │ConcreteCmd A│  │ConcreteCmd B│
                ├─────────────┤  ├───────────┤
                │- receiver   │  │- receiver │
                │+ execute()  │  │+ execute()│
                │+ undo()     │  │+ undo()   │
                └──────┬──────┘  └─────┬─────┘
                       │               │
                       ▼               ▼
                  ┌──────────────┐
                  │   Receiver   │
                  ├──────────────┤
                  │+ action()    │
                  └──────────────┘
</code></pre>
<h3 id="c-implementation_2">C++ Implementation</h3>
<pre><code class="language-cpp">#include &lt;iostream&gt;
#include &lt;memory&gt;
#include &lt;vector&gt;
#include &lt;string&gt;

using namespace std;

// Receiver
class Light {
private:
    bool isOn;
    int brightness;

public:
    Light() : isOn(false), brightness(0) {}

    void turnOn() {
        isOn = true;
        brightness = 100;
        cout &lt;&lt; &quot;Light is ON (brightness: &quot; &lt;&lt; brightness &lt;&lt; &quot;%)&quot; &lt;&lt; endl;
    }

    void turnOff() {
        isOn = false;
        brightness = 0;
        cout &lt;&lt; &quot;Light is OFF&quot; &lt;&lt; endl;
    }

    void dim(int level) {
        if (isOn) {
            brightness = level;
            cout &lt;&lt; &quot;Light dimmed to &quot; &lt;&lt; brightness &lt;&lt; &quot;%&quot; &lt;&lt; endl;
        }
    }
};

// Command interface
class Command {
public:
    virtual ~Command() = default;
    virtual void execute() = 0;
    virtual void undo() = 0;
};

// Concrete Command A
class LightOnCommand : public Command {
private:
    Light* light;

public:
    LightOnCommand(Light* l) : light(l) {}

    void execute() override {
        light-&gt;turnOn();
    }

    void undo() override {
        light-&gt;turnOff();
    }
};

// Concrete Command B
class LightOffCommand : public Command {
private:
    Light* light;

public:
    LightOffCommand(Light* l) : light(l) {}

    void execute() override {
        light-&gt;turnOff();
    }

    void undo() override {
        light-&gt;turnOn();
    }
};

// Concrete Command C
class LightDimCommand : public Command {
private:
    Light* light;
    int level;
    int previousLevel;

public:
    LightDimCommand(Light* l, int lvl) : light(l), level(lvl), previousLevel(100) {}

    void execute() override {
        light-&gt;dim(level);
    }

    void undo() override {
        light-&gt;dim(previousLevel);
    }
};

// Invoker
class RemoteControl {
private:
    vector&lt;unique_ptr&lt;Command&gt;&gt; history;

public:
    void executeCommand(unique_ptr&lt;Command&gt; command) {
        command-&gt;execute();
        history.push_back(move(command));
    }

    void undo() {
        if (!history.empty()) {
            history.back()-&gt;undo();
            history.pop_back();
        } else {
            cout &lt;&lt; &quot;Nothing to undo!&quot; &lt;&lt; endl;
        }
    }
};
</code></pre>
<p><strong>Usage Example</strong>:</p>
<pre><code class="language-cpp">Light livingRoomLight;
RemoteControl remote;

// Execute commands
remote.executeCommand(make_unique&lt;LightOnCommand&gt;(&amp;livingRoomLight));
remote.executeCommand(make_unique&lt;LightDimCommand&gt;(&amp;livingRoomLight, 50));
remote.executeCommand(make_unique&lt;LightOffCommand&gt;(&amp;livingRoomLight));

// Undo last command
remote.undo();  // Turns light back on
remote.undo();  // Restores to 100%
remote.undo();  // Turns light off
</code></pre>

<h2 id="4-state-pattern">4. State Pattern</h2>
<p><strong>Intent</strong>: Allow an object to alter its behavior when its internal state changes. The object will appear to change its class.</p>
<p><strong>When to Use</strong>:
- Object behavior depends on its state
- Operations have large conditional statements
- State transitions are explicit
- State-specific behavior needs to be defined in separate classes</p>
<h3 id="structure_3">Structure</h3>
<pre><code>┌──────────────┐         ┌──────────────┐
│   Context    │────────&gt;│    State     │ (interface)
├──────────────┤         ├──────────────┤
│- state       │         │ + handle()   │
│+ request()   │         └──────△───────┘
└──────────────┘                │
                        ┌───────┼───────┬───────┐
                 ┌──────▼────┐  ┌──▼───────┐  ┌──▼───────┐
                 │ConcreteState│  │ConcreteState│  │ConcreteState│
                 │     A     │  │     B     │  │     C     │
                 ├───────────┤  ├───────────┤  ├───────────┤
                 │+ handle() │  │+ handle() │  │+ handle() │
                 └───────────┘  └───────────┘  └───────────┘
</code></pre>
<h3 id="c-implementation_3">C++ Implementation</h3>
<pre><code class="language-cpp">#include &lt;iostream&gt;
#include &lt;memory&gt;

using namespace std;

// Forward declaration
class TCPConnection;

// State interface
class TCPState {
public:
    virtual ~TCPState() = default;
    virtual void open(TCPConnection* connection) = 0;
    virtual void close(TCPConnection* connection) = 0;
    virtual void acknowledge(TCPConnection* connection) = 0;
};

// Context
class TCPConnection {
private:
    unique_ptr&lt;TCPState&gt; state;

public:
    TCPConnection();

    void setState(unique_ptr&lt;TCPState&gt; newState) {
        state = move(newState);
    }

    void open() {
        state-&gt;open(this);
    }

    void close() {
        state-&gt;close(this);
    }

    void acknowledge() {
        state-&gt;acknowledge(this);
    }
};

// Concrete State A - Closed
class TCPClosed : public TCPState {
public:
    void open(TCPConnection* connection) override;

    void close(TCPConnection* connection) override {
        cout &lt;&lt; &quot;Connection is already closed&quot; &lt;&lt; endl;
    }

    void acknowledge(TCPConnection* connection) override {
        cout &lt;&lt; &quot;Cannot acknowledge, connection is closed&quot; &lt;&lt; endl;
    }
};

// Concrete State B - Listen
class TCPListen : public TCPState {
public:
    void open(TCPConnection* connection) override {
        cout &lt;&lt; &quot;Connection is already listening&quot; &lt;&lt; endl;
    }

    void close(TCPConnection* connection) override;

    void acknowledge(TCPConnection* connection) override;
};

// Concrete State C - Established
class TCPEstablished : public TCPState {
public:
    void open(TCPConnection* connection) override {
        cout &lt;&lt; &quot;Connection is already established&quot; &lt;&lt; endl;
    }

    void close(TCPConnection* connection) override;

    void acknowledge(TCPConnection* connection) override {
        cout &lt;&lt; &quot;Data acknowledged in established connection&quot; &lt;&lt; endl;
    }
};

// Implementations
void TCPClosed::open(TCPConnection* connection) {
    cout &lt;&lt; &quot;Opening connection...&quot; &lt;&lt; endl;
    connection-&gt;setState(make_unique&lt;TCPListen&gt;());
}

void TCPListen::close(TCPConnection* connection) {
    cout &lt;&lt; &quot;Closing connection...&quot; &lt;&lt; endl;
    connection-&gt;setState(make_unique&lt;TCPClosed&gt;());
}

void TCPListen::acknowledge(TCPConnection* connection) {
    cout &lt;&lt; &quot;Connection established!&quot; &lt;&lt; endl;
    connection-&gt;setState(make_unique&lt;TCPEstablished&gt;());
}

void TCPEstablished::close(TCPConnection* connection) {
    cout &lt;&lt; &quot;Closing established connection...&quot; &lt;&lt; endl;
    connection-&gt;setState(make_unique&lt;TCPClosed&gt;());
}

TCPConnection::TCPConnection() {
    state = make_unique&lt;TCPClosed&gt;();
}
</code></pre>
<p><strong>Usage Example</strong>:</p>
<pre><code class="language-cpp">TCPConnection connection;

connection.open();          // Opens, transitions to Listen
connection.acknowledge();   // Establishes connection
connection.acknowledge();   // Already established
connection.close();         // Closes connection
connection.close();         // Already closed
</code></pre>

<h2 id="5-template-method-pattern">5. Template Method Pattern</h2>
<p><strong>Intent</strong>: Define the skeleton of an algorithm in an operation, deferring some steps to subclasses. Template Method lets subclasses redefine certain steps of an algorithm without changing the algorithm&rsquo;s structure.</p>
<p><strong>When to Use</strong>:
- Implement invariant parts of algorithm once
- Common behavior should be factored and localized
- Control subclass extensions
- &ldquo;Hollywood Principle&rdquo; - Don&rsquo;t call us, we&rsquo;ll call you</p>
<h3 id="structure_4">Structure</h3>
<pre><code>┌──────────────────┐
│ AbstractClass    │
├──────────────────┤
│+templateMethod() │────┐
│+primitiveOp1()   │    │ Calls
│+primitiveOp2()   │◄───┘
└────────△─────────┘
         │
    ┌────┴────┐
    │         │
┌───▼────────┐ ┌──▼──────────┐
│ConcreteClass│ │ConcreteClass │
│     A      │ │     B        │
├────────────┤ ├──────────────┤
│+ primitiveOp1()│ │+ primitiveOp1()│
│+ primitiveOp2()│ │+ primitiveOp2()│
└────────────┘ └──────────────┘
</code></pre>
<h3 id="c-implementation_4">C++ Implementation</h3>
<pre><code class="language-cpp">#include &lt;iostream&gt;
#include &lt;string&gt;

using namespace std;

// Abstract Class
class DataProcessor {
public:
    // Template method
    void process() {
        readData();
        processData();
        writeData();
    }

    virtual ~DataProcessor() = default;

protected:
    virtual void readData() = 0;
    virtual void processData() = 0;
    virtual void writeData() = 0;
};

// Concrete Class A
class CSVProcessor : public DataProcessor {
protected:
    void readData() override {
        cout &lt;&lt; &quot;Reading data from CSV file&quot; &lt;&lt; endl;
    }

    void processData() override {
        cout &lt;&lt; &quot;Processing CSV data&quot; &lt;&lt; endl;
    }

    void writeData() override {
        cout &lt;&lt; &quot;Writing data to CSV file&quot; &lt;&lt; endl;
    }
};

// Concrete Class B
class JSONProcessor : public DataProcessor {
protected:
    void readData() override {
        cout &lt;&lt; &quot;Reading data from JSON file&quot; &lt;&lt; endl;
    }

    void processData() override {
        cout &lt;&lt; &quot;Processing JSON data&quot; &lt;&lt; endl;
    }

    void writeData() override {
        cout &lt;&lt; &quot;Writing data to JSON file&quot; &lt;&lt; endl;
    }
};

// Concrete Class C with hooks
class XMLProcessor : public DataProcessor {
protected:
    void readData() override {
        cout &lt;&lt; &quot;Reading data from XML file&quot; &lt;&lt; endl;
    }

    void processData() override {
        cout &lt;&lt; &quot;Processing XML data&quot; &lt;&lt; endl;
        if (shouldValidate()) {
            validateSchema();
        }
    }

    void writeData() override {
        cout &lt;&lt; &quot;Writing data to XML file&quot; &lt;&lt; endl;
    }

    // Hook method
    virtual bool shouldValidate() {
        return true;
    }

    void validateSchema() {
        cout &lt;&lt; &quot;Validating XML schema&quot; &lt;&lt; endl;
    }
};
</code></pre>
<p><strong>Usage Example</strong>:</p>
<pre><code class="language-cpp">CSVProcessor csvProcessor;
cout &lt;&lt; &quot;=== Processing CSV ===&quot; &lt;&lt; endl;
csvProcessor.process();

cout &lt;&lt; &quot;\\n=== Processing JSON ===&quot; &lt;&lt; endl;
JSONProcessor jsonProcessor;
jsonProcessor.process();

cout &lt;&lt; &quot;\\n=== Processing XML ===&quot; &lt;&lt; endl;
XMLProcessor xmlProcessor;
xmlProcessor.process();
</code></pre>

<h2 id="6-iterator-pattern">6. Iterator Pattern</h2>
<p><strong>Intent</strong>: Provide a way to access the elements of an aggregate object sequentially without exposing its underlying representation.</p>
<p><strong>When to Use</strong>:
- Access contents without exposing internal structure
- Support multiple traversals
- Provide uniform interface for different structures</p>
<h3 id="structure_5">Structure</h3>
<pre><code>┌──────────────┐         ┌──────────────┐
│  Aggregate   │────────&gt;│   Iterator   │
│ (interface)  │         │ (interface)  │
├──────────────┤         ├──────────────┤
│+createIter() │         │ + next()     │
└──────△───────┘         │ + hasNext()  │
       │                 │ + current()  │
       │                 └──────△───────┘
┌──────▼────────┐                 │
│ConcreteAggreg │          ┌──────▼──────┐
├───────────────┤          │ConcreteIter │
│+ createIter() │─creates─&gt;├─────────────┤
└───────────────┘          │+ next()     │
                           │+ hasNext()  │
                           │+ current()  │
                           └─────────────┘
</code></pre>
<h3 id="c-implementation_5">C++ Implementation</h3>
<pre><code class="language-cpp">#include &lt;iostream&gt;
#include &lt;vector&gt;
#include &lt;string&gt;
#include &lt;memory&gt;

using namespace std;

// Forward declaration
template&lt;typename T&gt;
class ConcreteAggregate;

// Iterator interface
template&lt;typename T&gt;
class Iterator {
public:
    virtual ~Iterator() = default;
    virtual bool hasNext() = 0;
    virtual T next() = 0;
    virtual T current() = 0;
};

// Aggregate interface
template&lt;typename T&gt;
class Aggregate {
public:
    virtual ~Aggregate() = default;
    virtual unique_ptr&lt;Iterator&lt;T&gt;&gt; createIterator() = 0;
};

// Concrete Iterator
template&lt;typename T&gt;
class ConcreteIterator : public Iterator&lt;T&gt; {
private:
    const ConcreteAggregate&lt;T&gt;* aggregate;
    size_t index;

public:
    ConcreteIterator(const ConcreteAggregate&lt;T&gt;* agg) : aggregate(agg), index(0) {}

    bool hasNext() override {
        return index &lt; aggregate-&gt;size();
    }

    T next() override {
        return aggregate-&gt;at(index++);
    }

    T current() override {
        return aggregate-&gt;at(index);
    }
};

// Concrete Aggregate
template&lt;typename T&gt;
class ConcreteAggregate : public Aggregate&lt;T&gt; {
private:
    vector&lt;T&gt; items;

public:
    void add(const T&amp; item) {
        items.push_back(item);
    }

    size_t size() const {
        return items.size();
    }

    T at(size_t index) const {
        return items[index];
    }

    unique_ptr&lt;Iterator&lt;T&gt;&gt; createIterator() override {
        return make_unique&lt;ConcreteIterator&lt;T&gt;&gt;(this);
    }
};
</code></pre>
<p><strong>Usage Example</strong>:</p>
<pre><code class="language-cpp">ConcreteAggregate&lt;string&gt; library;
library.add(&quot;Book 1&quot;);
library.add(&quot;Book 2&quot;);
library.add(&quot;Book 3&quot;);

auto iterator = library.createIterator();

cout &lt;&lt; &quot;Iterating through library:&quot; &lt;&lt; endl;
while (iterator-&gt;hasNext()) {
    cout &lt;&lt; &quot;- &quot; &lt;&lt; iterator-&gt;next() &lt;&lt; endl;
}
</code></pre>

<h2 id="7-chain-of-responsibility-pattern">7. Chain of Responsibility Pattern</h2>
<p><strong>Intent</strong>: Avoid coupling the sender of a request to its receiver by giving more than one object a chance to handle the request. Chain the receiving objects and pass the request along the chain until an object handles it.</p>
<p><strong>When to Use</strong>:
- More than one object may handle request
- Handler isn&rsquo;t known a priori
- Set of handlers should be specified dynamically
- Logging systems, event handling</p>
<h3 id="structure_6">Structure</h3>
<pre><code>┌──────────────┐       ┌───────────────────────┐
│   Client     │──────&gt;│   Handler (abstract)  │
└──────────────┘       ├───────────────────────┤
                       │- successor: Handler*  │
                       │+ handleRequest()      │
                       │+ setNext(Handler*)    │
                       └──────────△────────────┘
                                  │
                    ┌─────────────┼─────────────────┬
                    │             │                 │            
          ┌─────────▼────────┐  ┌─▼────────────┐  ┌─▼────────────┐
          │ ConcreteHandlerA │  │ConcreteHandlerB │ ConcreteHandlerC│
          ├──────────────────┤  ├──────────────┤  ├──────────────┤
          │+ handleRequest() │  │+ handleRequest()│+ handleRequest()│
          └──────────────────┘  └──────────────┘  └──────────────┘

Chain at runtime:
  Client ──&gt; HandlerA ──&gt; HandlerB ──&gt; HandlerC ──&gt; null
           (if can't handle, pass to next)
</code></pre>
<h3 id="c-implementation_6">C++ Implementation</h3>
<pre><code class="language-cpp">#include &lt;iostream&gt;
#include &lt;memory&gt;
#include &lt;string&gt;

using namespace std;

// Request
class SupportTicket {
private:
    string issue;
    int priority;  // 1=Low, 2=Medium, 3=High

public:
    SupportTicket(const string&amp; i, int p) : issue(i), priority(p) {}

    string getIssue() const { return issue; }
    int getPriority() const { return priority; }
};

// Handler interface
class SupportHandler {
protected:
    unique_ptr&lt;SupportHandler&gt; nextHandler;

public:
    virtual ~SupportHandler() = default;

    void setNext(unique_ptr&lt;SupportHandler&gt; handler) {
        nextHandler = move(handler);
    }

    virtual void handleTicket(const SupportTicket&amp; ticket) {
        if (nextHandler) {
            nextHandler-&gt;handleTicket(ticket);
        } else {
            cout &lt;&lt; &quot;Ticket escalated to management&quot; &lt;&lt; endl;
        }
    }
};

// Concrete Handler A
class Level1Support : public SupportHandler {
public:
    void handleTicket(const SupportTicket&amp; ticket) override {
        if (ticket.getPriority() == 1) {
            cout &lt;&lt; &quot;Level 1 Support handling: &quot; &lt;&lt; ticket.getIssue() &lt;&lt; endl;
        } else {
            cout &lt;&lt; &quot;Level 1 cannot handle, escalating...&quot; &lt;&lt; endl;
            SupportHandler::handleTicket(ticket);
        }
    }
};

// Concrete Handler B
class Level2Support : public SupportHandler {
public:
    void handleTicket(const SupportTicket&amp; ticket) override {
        if (ticket.getPriority() == 2) {
            cout &lt;&lt; &quot;Level 2 Support handling: &quot; &lt;&lt; ticket.getIssue() &lt;&lt; endl;
        } else {
            cout &lt;&lt; &quot;Level 2 cannot handle, escalating...&quot; &lt;&lt; endl;
            SupportHandler::handleTicket(ticket);
        }
    }
};

// Concrete Handler C
class Level3Support : public SupportHandler {
public:
    void handleTicket(const SupportTicket&amp; ticket) override {
        if (ticket.getPriority() == 3) {
            cout &lt;&lt; &quot;Level 3 Support handling: &quot; &lt;&lt; ticket.getIssue() &lt;&lt; endl;
        } else {
            cout &lt;&lt; &quot;Level 3 cannot handle, escalating...&quot; &lt;&lt; endl;
            SupportHandler::handleTicket(ticket);
        }
    }
};
</code></pre>
<p><strong>Usage Example</strong>:</p>
<pre><code class="language-cpp">// Build chain
auto level1 = make_unique&lt;Level1Support&gt;();
auto level2 = make_unique&lt;Level2Support&gt;();
auto level3 = make_unique&lt;Level3Support&gt;();

level1-&gt;setNext(move(level2));
level1-&gt;getNext()-&gt;setNext(move(level3));

// Submit tickets
SupportTicket ticket1(&quot;Password reset&quot;, 1);
SupportTicket ticket2(&quot;Database error&quot;, 2);
SupportTicket ticket3(&quot;Server crash&quot;, 3);

level1-&gt;handleTicket(ticket1);
cout &lt;&lt; endl;
level1-&gt;handleTicket(ticket2);
cout &lt;&lt; endl;
level1-&gt;handleTicket(ticket3);
</code></pre>

<h2 id="when-to-use-which-pattern">When to Use Which Pattern?</h2>
<h3 id="choose-strategy-when">Choose Strategy when:</h3>
<ul>
<li>You have multiple algorithms for a task</li>
<li>You want to switch algorithms at runtime</li>
</ul>
<h3 id="choose-observer-when">Choose Observer when:</h3>
<ul>
<li>One object change affects many others</li>
<li>You need publish-subscribe capability</li>
</ul>
<h3 id="choose-command-when">Choose Command when:</h3>
<ul>
<li>You need to parameterize objects with operations</li>
<li>You need undo/redo functionality</li>
</ul>
<h3 id="choose-state-when">Choose State when:</h3>
<ul>
<li>Object behavior depends on state</li>
<li>You have large conditional statements</li>
</ul>
<h3 id="choose-template-method-when">Choose Template Method when:</h3>
<ul>
<li>You have invariant algorithm structure</li>
<li>Subclasses should implement specific steps</li>
</ul>
<h3 id="choose-iterator-when">Choose Iterator when:</h3>
<ul>
<li>You need to traverse collection</li>
<li>You want to hide internal structure</li>
</ul>
<h3 id="choose-chain-of-responsibility-when">Choose Chain of Responsibility when:</h3>
<ul>
<li>Multiple objects can handle request</li>
<li>Handler isn&rsquo;t known in advance</li>
</ul>

<h2 id="-interview-tips-by-problem-type">💡 Interview Tips by Problem Type</h2>
<h3 id="state-management-problems">State Management Problems</h3>
<p><strong>Problems</strong>: ATM, Elevator, Traffic Signal, Vending Machine</p>
<p><strong>Approach</strong>:
1. Identify all possible states
2. Define transitions between states
3. Handle edge cases (invalid transitions)
4. Use State pattern for clean code</p>
<p><strong>Key Questions to Ask</strong>:
- What are all possible states?
- What triggers state transitions?
- Can states be reverted?
- Are there any invalid transitions?</p>
<h3 id="bookingreservation-problems">Booking/Reservation Problems</h3>
<p><strong>Problems</strong>: Parking, Hotel, Movie, Car Rental, Restaurant</p>
<p><strong>Approach</strong>:
1. Identify resources to be booked
2. Define availability check mechanism
3. Handle concurrent bookings (locking)
4. Implement cancellation/modification
5. Payment integration</p>
<p><strong>Key Questions to Ask</strong>:
- How to handle concurrent bookings?
- Overbooking allowed?
- Cancellation policy?
- Payment flow?</p>
<h3 id="matchingassignment-problems">Matching/Assignment Problems</h3>
<p><strong>Problems</strong>: Ride Sharing, Food Delivery, Elevator Assignment</p>
<p><strong>Approach</strong>:
1. Define matching criteria (distance, rating, etc.)
2. Implement matching algorithm (greedy, optimal)
3. Handle rejections/timeouts
4. Real-time updates</p>
<p><strong>Key Questions to Ask</strong>:
- Matching criteria priority?
- Real-time or batch processing?
- What if no match found?
- How to handle cancellations?</p>
<h3 id="real-time-systems">Real-time Systems</h3>
<p><strong>Problems</strong>: Stock Trading, Notification, Social Feed</p>
<p><strong>Approach</strong>:
1. Event-driven architecture
2. Observer pattern for updates
3. Queue for processing
4. Consistency vs Availability tradeoffs</p>
<p><strong>Key Questions to Ask</strong>:
- Latency requirements?
- Consistency guarantees?
- Scale (users, events)?
- Failure handling?</p>

    ParkingSpotStatus status;

        : spotId(id), spotType(type), parkedVehicle(nullptr),

// ============== Parking Ticket ==============

class ParkingTicket {
private:
    string ticketId;
    Vehicle* vehicle;
    ParkingSpot* spot;
    time_t entryTime;
    time_t exitTime;

    static int ticketCounter;

    string generateTicketId() {
        return &quot;TKT&quot; + to_string(++ticketCounter);
    }

public:
    ParkingTicket(Vehicle* v, ParkingSpot* s)
        : vehicle(v), spot(s), exitTime(0) {
        ticketId = generateTicketId();
        entryTime = time(nullptr);
    }

    string getTicketId() const { return ticketId; }
    Vehicle* getVehicle() const { return vehicle; }
    ParkingSpot* getSpot() const { return spot; }
    time_t getEntryTime() const { return entryTime; }

    void setExitTime(time_t t) { exitTime = t; }

    double calculateFee() const {
        if (exitTime == 0) return 0.0;

        double hours = difftime(exitTime, entryTime) / 3600.0;

        // Pricing strategy based on vehicle type
        double hourlyRate;
        switch (vehicle-&gt;getType()) {
            case VehicleType::MOTORCYCLE:
                hourlyRate = 5.0;
                break;
            case VehicleType::CAR:
                hourlyRate = 10.0;
                break;
            case VehicleType::TRUCK:
                hourlyRate = 20.0;
                break;
        }

        // Minimum 1 hour charge
        if (hours &lt; 1.0) hours = 1.0;

        return hours * hourlyRate;
    }

    void display() const {
        cout &lt;&lt; &quot;\\n========== PARKING TICKET ==========&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;Ticket ID: &quot; &lt;&lt; ticketId &lt;&lt; endl;
        cout &lt;&lt; &quot;License Plate: &quot; &lt;&lt; vehicle-&gt;getLicensePlate() &lt;&lt; endl;
        cout &lt;&lt; &quot;Vehicle Type: &quot; &lt;&lt; vehicle-&gt;getTypeName() &lt;&lt; endl;
        cout &lt;&lt; &quot;Spot: &quot; &lt;&lt; spot-&gt;getSpotId() &lt;&lt; &quot; (Floor &quot; &lt;&lt; spot-&gt;getFloor() &lt;&lt; &quot;)&quot; &lt;&lt; endl;

        char timeStr[26];
        ctime_r(&amp;entryTime, timeStr);
        cout &lt;&lt; &quot;Entry Time: &quot; &lt;&lt; timeStr;
        cout &lt;&lt; &quot;====================================&quot; &lt;&lt; endl;
    }
};

// ============== Parking Floor ==============

class ParkingFloor {
private:
    int floorId;
    vector&lt;unique_ptr&lt;ParkingSpot&gt;&gt; spots;

public:
    ParkingFloor(int id) : floorId(id) {}

    void addSpot(unique_ptr&lt;ParkingSpot&gt; spot) {
        spots.push_back(move(spot));
    }

    ParkingSpot* findAvailableSpot(VehicleType vType) {
        for (auto&amp; spot : spots) {
            if (spot-&gt;isAvailable() &amp;&amp; spot-&gt;canFitVehicle(vType)) {
                return spot.get();
            }
        }
        return nullptr;
    }

    int getAvailableSpotsCount(SpotType sType) const {
        int count = 0;
        for (const auto&amp; spot : spots) {
            if (spot-&gt;isAvailable() &amp;&amp; spot-&gt;getSpotType() == sType) {
                count++;
            }
        }
        return count;
    }

    int getFloorId() const { return floorId; }
};

// ============== Parking Lot (Singleton) ==============

class ParkingLot {
private:
    static ParkingLot* instance;
    static mutex mtx;

    string name;
    vector&lt;unique_ptr&lt;ParkingFloor&gt;&gt; floors;
    unordered_map&lt;string, unique_ptr&lt;ParkingTicket&gt;&gt; activeTickets;

    ParkingLot(const string&amp; n) : name(n) {}

public:
    static ParkingLot* getInstance(const string&amp; name = &quot;Main Parking Lot&quot;) {
        lock_guard&lt;mutex&gt; lock(mtx);
        if (instance == nullptr) {
            instance = new ParkingLot(name);
        }
        return instance;
    }

    // Delete copy constructor and assignment
    ParkingLot(const ParkingLot&amp;) = delete;
    ParkingLot&amp; operator=(const ParkingLot&amp;) = delete;

    void addFloor(unique_ptr&lt;ParkingFloor&gt; floor) {
        floors.push_back(move(floor));
    }

    ParkingTicket* parkVehicle(Vehicle* vehicle) {
        lock_guard&lt;mutex&gt; lock(mtx);

        // Check if vehicle already parked
        if (activeTickets.find(vehicle-&gt;getLicensePlate()) != activeTickets.end()) {
            cout &lt;&lt; &quot;Vehicle already parked!&quot; &lt;&lt; endl;
            return nullptr;
        }

        // Find available spot across all floors
        for (auto&amp; floor : floors) {
            ParkingSpot* spot = floor-&gt;findAvailableSpot(vehicle-&gt;getType());
            if (spot != nullptr) {
                if (spot-&gt;assignVehicle(vehicle)) {
                    auto ticket = make_unique&lt;ParkingTicket&gt;(vehicle, spot);
                    ParkingTicket* ticketPtr = ticket.get();
                    activeTickets[vehicle-&gt;getLicensePlate()] = move(ticket);

                    cout &lt;&lt; &quot;\\n✓ Vehicle parked successfully!&quot; &lt;&lt; endl;
                    ticketPtr-&gt;display();
                    return ticketPtr;
                }
            }
        }

        cout &lt;&lt; &quot;\\n✗ No available spot for &quot; &lt;&lt; vehicle-&gt;getTypeName() &lt;&lt; endl;
        return nullptr;
    }

    double unparkVehicle(const string&amp; licensePlate) {
        lock_guard&lt;mutex&gt; lock(mtx);

        auto it = activeTickets.find(licensePlate);
        if (it == activeTickets.end()) {
            cout &lt;&lt; &quot;Ticket not found!&quot; &lt;&lt; endl;
            return 0.0;
        }

        ParkingTicket* ticket = it-&gt;second.get();
        ticket-&gt;setExitTime(time(nullptr));

        ParkingSpot* spot = ticket-&gt;getSpot();
        spot-&gt;removeVehicle();

        double fee = ticket-&gt;calculateFee();

        cout &lt;&lt; &quot;\\n========== EXIT RECEIPT ==========&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;Ticket ID: &quot; &lt;&lt; ticket-&gt;getTicketId() &lt;&lt; endl;
        cout &lt;&lt; &quot;License Plate: &quot; &lt;&lt; licensePlate &lt;&lt; endl;
        cout &lt;&lt; &quot;Parking Fee: $&quot; &lt;&lt; fixed &lt;&lt; setprecision(2) &lt;&lt; fee &lt;&lt; endl;
        cout &lt;&lt; &quot;==================================\\n&quot; &lt;&lt; endl;

        activeTickets.erase(it);
        return fee;
    }

    void displayAvailability() const {
        cout &lt;&lt; &quot;\\n========== PARKING AVAILABILITY ==========&quot; &lt;&lt; endl;
        for (const auto&amp; floor : floors) {
            cout &lt;&lt; &quot;Floor &quot; &lt;&lt; floor-&gt;getFloorId() &lt;&lt; &quot;:&quot; &lt;&lt; endl;
            cout &lt;&lt; &quot;  Motorcycle spots: &quot; 
                 &lt;&lt; floor-&gt;getAvailableSpotsCount(SpotType::MOTORCYCLE) &lt;&lt; endl;
            cout &lt;&lt; &quot;  Compact spots: &quot; 
                 &lt;&lt; floor-&gt;getAvailableSpotsCount(SpotType::COMPACT) &lt;&lt; endl;
            cout &lt;&lt; &quot;  Large spots: &quot; 
                 &lt;&lt; floor-&gt;getAvailableSpotsCount(SpotType::LARGE) &lt;&lt; endl;
        }
        cout &lt;&lt; &quot;==========================================\\n&quot; &lt;&lt; endl;
    }

    static void cleanup() {
        delete instance;
        instance = nullptr;
    }
};

class Account {
private:

public:
    Account(const string&amp; accNum, const string&amp; name, double initialBalance)

// ============== Cash Denomination ==============

class CashInventory {
private:
    unordered_map&lt;int, int&gt; denominations; // denomination -&gt; count

public:
    CashInventory() {
        // Initialize with some cash
        denominations[100] = 10;
        denominations[50] = 20;
        denominations[20] = 50;
        denominations[10] = 100;
        denominations[5] = 200;
    }

    bool hasSufficientCash(double amount) const {
        double available = 0;
        for (const auto&amp; [denom, count] : denominations) {
            available += denom * count;
        }
        return available &gt;= amount;
    }

    bool dispenseCash(double amount) {
        if (!hasSufficientCash(amount)) {
            cout &lt;&lt; &quot;ATM has insufficient cash!&quot; &lt;&lt; endl;
            return false;
        }

        unordered_map&lt;int, int&gt; toDispense;
        double remaining = amount;

        // Greedy approach: Start with largest denomination
        vector&lt;int&gt; denoms = {100, 50, 20, 10, 5};

        for (int denom : denoms) {
            if (remaining &gt;= denom &amp;&amp; denominations[denom] &gt; 0) {
                int count = min((int)(remaining / denom), denominations[denom]);
                toDispense[denom] = count;
                remaining -= count * denom;
            }
        }

        if (remaining &gt; 0) {
            cout &lt;&lt; &quot;Cannot dispense exact amount!&quot; &lt;&lt; endl;
            return false;
        }

        // Update inventory
        for (const auto&amp; [denom, count] : toDispense) {
            denominations[denom] -= count;
        }

        cout &lt;&lt; &quot;\\nCash Dispensed:&quot; &lt;&lt; endl;
        for (const auto&amp; [denom, count] : toDispense) {
            cout &lt;&lt; &quot;$&quot; &lt;&lt; denom &lt;&lt; &quot; x &quot; &lt;&lt; count &lt;&lt; &quot; = $&quot; &lt;&lt; (denom * count) &lt;&lt; endl;
        }

        return true;
    }

    void addCash(int denomination, int count) {
        denominations[denomination] += count;
    }

    void displayInventory() const {
        cout &lt;&lt; &quot;\\nCash Inventory:&quot; &lt;&lt; endl;
        double total = 0;
        for (const auto&amp; [denom, count] : denominations) {
            cout &lt;&lt; &quot;$&quot; &lt;&lt; denom &lt;&lt; &quot; x &quot; &lt;&lt; count &lt;&lt; &quot; = $&quot; &lt;&lt; (denom * count) &lt;&lt; endl;
            total += denom * count;
        }
        cout &lt;&lt; &quot;Total: $&quot; &lt;&lt; total &lt;&lt; endl;
    }
};

// ============== Transaction Interface ==============

class Transaction {
public:
    virtual ~Transaction() = default;
    virtual bool execute(Account* account, double amount) = 0;
    virtual string getType() const = 0;
};

class WithdrawTransaction : public Transaction {
private:
    CashInventory* cashInventory;

public:
    WithdrawTransaction(CashInventory* inventory) : cashInventory(inventory) {}

    bool execute(Account* account, double amount) override {
        if (account-&gt;debit(amount)) {
            return cashInventory-&gt;dispenseCash(amount);
        }
        return false;
    }

    string getType() const override { return &quot;WITHDRAW&quot;; }
};

class DepositTransaction : public Transaction {
private:
    CashInventory* cashInventory;

public:
    DepositTransaction(CashInventory* inventory) : cashInventory(inventory) {}

    bool execute(Account* account, double amount) override {
        account-&gt;credit(amount);
        // Assume we add the deposited cash to inventory
        // In reality, you'd ask for denomination breakdown
        cashInventory-&gt;addCash(20, amount / 20); // Simplified
        cout &lt;&lt; &quot;Deposited $&quot; &lt;&lt; amount &lt;&lt; &quot; successfully!&quot; &lt;&lt; endl;
        return true;
    }

    string getType() const override { return &quot;DEPOSIT&quot;; }
};

class BalanceInquiryTransaction : public Transaction {
public:
    bool execute(Account* account, double amount) override {
        cout &lt;&lt; &quot;\\nCurrent Balance: $&quot; &lt;&lt; fixed &lt;&lt; setprecision(2) 
             &lt;&lt; account-&gt;getBalance() &lt;&lt; endl;
        return true;
    }

    string getType() const override { return &quot;BALANCE_INQUIRY&quot;; }
};

// ============== ATM States ==============

class ATMMachine; // Forward declaration

class ATMState {
public:
    virtual ~ATMState() = default;
    virtual void insertCard(ATMMachine* atm, Card* card) = 0;
    virtual void enterPIN(ATMMachine* atm, const string&amp; pin) = 0;
    virtual void selectTransaction(ATMMachine* atm, Transaction* transaction, double amount) = 0;
    virtual void ejectCard(ATMMachine* atm) = 0;
    virtual string getStateName() const = 0;
};

class IdleState : public ATMState {
public:
    void insertCard(ATMMachine* atm, Card* card) override;

    void enterPIN(ATMMachine* atm, const string&amp; pin) override {
        cout &lt;&lt; &quot;Please insert card first!&quot; &lt;&lt; endl;
    }

    void selectTransaction(ATMMachine* atm, Transaction* transaction, double amount) override {
        cout &lt;&lt; &quot;Please insert card first!&quot; &lt;&lt; endl;
    }

    void ejectCard(ATMMachine* atm) override {
        cout &lt;&lt; &quot;No card inserted!&quot; &lt;&lt; endl;
    }

    string getStateName() const override { return &quot;IDLE&quot;; }
};

class CardInsertedState : public ATMState {
public:
    void insertCard(ATMMachine* atm, Card* card) override {
        cout &lt;&lt; &quot;Card already inserted!&quot; &lt;&lt; endl;
    }

    void enterPIN(ATMMachine* atm, const string&amp; pin) override;

    void selectTransaction(ATMMachine* atm, Transaction* transaction, double amount) override {
        cout &lt;&lt; &quot;Please enter PIN first!&quot; &lt;&lt; endl;
    }

    void ejectCard(ATMMachine* atm) override;

    string getStateName() const override { return &quot;CARD_INSERTED&quot;; }
};

class PINVerifiedState : public ATMState {
public:
    void insertCard(ATMMachine* atm, Card* card) override {
        cout &lt;&lt; &quot;Card already inserted!&quot; &lt;&lt; endl;
    }

    void enterPIN(ATMMachine* atm, const string&amp; pin) override {
        cout &lt;&lt; &quot;PIN already verified!&quot; &lt;&lt; endl;
    }

    void selectTransaction(ATMMachine* atm, Transaction* transaction, double amount) override;

    void ejectCard(ATMMachine* atm) override;

    string getStateName() const override { return &quot;PIN_VERIFIED&quot;; }
};

// ============== ATM Machine ==============

class ATMMachine {
private:
    ATMState* currentState;
    Card* currentCard;
    CashInventory cashInventory;

    unique_ptr&lt;IdleState&gt; idleState;
    unique_ptr&lt;CardInsertedState&gt; cardInsertedState;
    unique_ptr&lt;PINVerifiedState&gt; pinVerifiedState;

public:
    ATMMachine() : currentCard(nullptr) {
        idleState = make_unique&lt;IdleState&gt;();
        cardInsertedState = make_unique&lt;CardInsertedState&gt;();
        pinVerifiedState = make_unique&lt;PINVerifiedState&gt;();

        currentState = idleState.get();
    }

    void setState(ATMState* state) {
        cout &lt;&lt; &quot;\\n[ATM State: &quot; &lt;&lt; currentState-&gt;getStateName() 
             &lt;&lt; &quot; -&gt; &quot; &lt;&lt; state-&gt;getStateName() &lt;&lt; &quot;]&quot; &lt;&lt; endl;
        currentState = state;
    }

    ATMState* getIdleState() { return idleState.get(); }
    ATMState* getCardInsertedState() { return cardInsertedState.get(); }
    ATMState* getPINVerifiedState() { return pinVerifiedState.get(); }

    void setCurrentCard(Card* card) { currentCard = card; }
    Card* getCurrentCard() const { return currentCard; }
    CashInventory&amp; getCashInventory() { return cashInventory; }

    void insertCard(Card* card) {
        currentState-&gt;insertCard(this, card);
    }

    void enterPIN(const string&amp; pin) {
        currentState-&gt;enterPIN(this, pin);
    }

    void selectTransaction(Transaction* transaction, double amount) {
        currentState-&gt;selectTransaction(this, transaction, amount);
    }

    void ejectCard() {
        currentState-&gt;ejectCard(this);
    }

    void displayStatus() {
        cout &lt;&lt; &quot;\\n========== ATM STATUS ==========&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;State: &quot; &lt;&lt; currentState-&gt;getStateName() &lt;&lt; endl;
        if (currentCard) {
            cout &lt;&lt; &quot;Card: &quot; &lt;&lt; currentCard-&gt;getCardNumber() &lt;&lt; endl;
        }
        cashInventory.displayInventory();
        cout &lt;&lt; &quot;===============================\\n&quot; &lt;&lt; endl;
    }
};

// ============== State Method Implementations ==============

void IdleState::insertCard(ATMMachine* atm, Card* card) {
    cout &lt;&lt; &quot;\\nCard inserted: &quot; &lt;&lt; card-&gt;getCardNumber() &lt;&lt; endl;
    atm-&gt;setCurrentCard(card);
    atm-&gt;setState(atm-&gt;getCardInsertedState());
}

void CardInsertedState::enterPIN(ATMMachine* atm, const string&amp; pin) {
    Card* card = atm-&gt;getCurrentCard();
    if (card-&gt;validatePIN(pin)) {
        cout &lt;&lt; &quot;PIN verified successfully!&quot; &lt;&lt; endl;
        atm-&gt;setState(atm-&gt;getPINVerifiedState());
    } else {
        cout &lt;&lt; &quot;Invalid PIN! Card ejected.&quot; &lt;&lt; endl;
        atm-&gt;setCurrentCard(nullptr);
        atm-&gt;setState(atm-&gt;getIdleState());
    }
}

void CardInsertedState::ejectCard(ATMMachine* atm) {
    cout &lt;&lt; &quot;Card ejected!&quot; &lt;&lt; endl;
    atm-&gt;setCurrentCard(nullptr);
    atm-&gt;setState(atm-&gt;getIdleState());
}

void PINVerifiedState::selectTransaction(ATMMachine* atm, Transaction* transaction, double amount) {
    cout &lt;&lt; &quot;\\nProcessing &quot; &lt;&lt; transaction-&gt;getType() &lt;&lt; &quot;...&quot; &lt;&lt; endl;

    Card* card = atm-&gt;getCurrentCard();
    Account* account = card-&gt;getAccount();

    if (transaction-&gt;execute(account, amount)) {
        cout &lt;&lt; &quot;Transaction successful!&quot; &lt;&lt; endl;
    } else {
        cout &lt;&lt; &quot;Transaction failed!&quot; &lt;&lt; endl;
    }

    // After transaction, return to PIN verified state for more transactions
    // or user can eject card
}

void PINVerifiedState::ejectCard(ATMMachine* atm) {
    Card* card = atm-&gt;getCurrentCard();
    card-&gt;getAccount()-&gt;printStatement();
    cout &lt;&lt; &quot;\\nCard ejected! Thank you!&quot; &lt;&lt; endl;
    atm-&gt;setCurrentCard(nullptr);
    atm-&gt;setState(atm-&gt;getIdleState());
}

// ============== Fine Strategy ==============

class FineStrategy {
public:
    virtual ~FineStrategy() = default;
    virtual double calculateFine(int daysLate) const = 0;
};

class StandardFineStrategy : public FineStrategy {
public:
    double calculateFine(int daysLate) const override {
        return daysLate * 1.0; // $1 per day
    }
};

class PremiumFineStrategy : public FineStrategy {
public:
    double calculateFine(int daysLate) const override {
        return daysLate * 0.5; // $0.5 per day for premium members
    }
};

// ============== Lending ==============

class Lending {
private:
    string lendingId;
    BookItem* bookItem;
    Member* member;
    time_t issueDate;
    time_t dueDate;
    time_t returnDate;
    unique_ptr&lt;FineStrategy&gt; fineStrategy;

    static int counter;

public:
    Lending(BookItem* item, Member* mem, int dueDays = 14)
        : bookItem(item), member(mem), returnDate(0) {

        lendingId = &quot;LEND&quot; + to_string(++counter);
        issueDate = time(nullptr);
        dueDate = issueDate + (dueDays * 24 * 3600);

        // Set fine strategy based on membership
        if (mem-&gt;getMembershipType() == MembershipType::PREMIUM) {
            fineStrategy = make_unique&lt;PremiumFineStrategy&gt;();
        } else {
            fineStrategy = make_unique&lt;StandardFineStrategy&gt;();
        }
    }

    string getLendingId() const { return lendingId; }
    BookItem* getBookItem() const { return bookItem; }
    Member* getMember() const { return member; }
    time_t getIssueDate() const { return issueDate; }
    time_t getDueDate() const { return dueDate; }

    void setReturnDate() {
        returnDate = time(nullptr);
    }

    bool isReturned() const {
        return returnDate != 0;
    }

    double calculateFine() const {
        if (returnDate == 0) return 0.0;

        if (returnDate &gt; dueDate) {
            int daysLate = (returnDate - dueDate) / (24 * 3600);
            return fineStrategy-&gt;calculateFine(daysLate);
        }
        return 0.0;
    }

    void display() const {
        cout &lt;&lt; &quot;\\n--- Lending: &quot; &lt;&lt; lendingId &lt;&lt; &quot; ---&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;Member: &quot; &lt;&lt; member-&gt;getName() &lt;&lt; endl;
        cout &lt;&lt; &quot;Book: &quot; &lt;&lt; bookItem-&gt;getBook()-&gt;getTitle() &lt;&lt; endl;

        char issueStr[26], dueStr[26];
        ctime_r(&amp;issueDate, issueStr);
        ctime_r(&amp;dueDate, dueStr);

        cout &lt;&lt; &quot;Issued: &quot; &lt;&lt; issueStr;
        cout &lt;&lt; &quot;Due: &quot; &lt;&lt; dueStr;

        if (returnDate != 0) {
            char returnStr[26];
            ctime_r(&amp;returnDate, returnStr);
            cout &lt;&lt; &quot;Returned: &quot; &lt;&lt; returnStr;
            cout &lt;&lt; &quot;Fine: $&quot; &lt;&lt; calculateFine() &lt;&lt; endl;
        } else {
            cout &lt;&lt; &quot;Status: Not returned&quot; &lt;&lt; endl;
        }
    }
};

class Library {
private:
    static Library* instance;

    string name;
    unordered_map&lt;string, unique_ptr&lt;Book&gt;&gt; books;          // ISBN -&gt; Book
    unordered_map&lt;string, unique_ptr&lt;BookItem&gt;&gt; bookItems;  // Barcode -&gt; BookItem
    unordered_map&lt;string, unique_ptr&lt;Member&gt;&gt; members;      // MemberID -&gt; Member
    unordered_map&lt;string, unique_ptr&lt;Lending&gt;&gt; lendings;    // LendingID -&gt; Lending
    unordered_map&lt;string, vector&lt;string&gt;&gt; activeLendings;   // MemberID -&gt; LendingIDs

    int bookItemCounter;

    Library(const string&amp; n) : name(n), bookItemCounter(0) {}

public:
    static Library* getInstance(const string&amp; name = &quot;City Library&quot;) {
        if (instance == nullptr) {
            instance = new Library(name);
        }
        return instance;
    }

    // Add book to library
    void addBook(const string&amp; isbn, const string&amp; title, const string&amp; author,
                 const string&amp; subject, int copies = 1) {

        auto it = books.find(isbn);
        if (it != books.end()) {
            // Book exists, add more copies
            it-&gt;second-&gt;addCopy();
            for (int i = 0; i &lt; copies; i++) {
                string barcode = isbn + &quot;-&quot; + to_string(++bookItemCounter);
                bookItems[barcode] = make_unique&lt;BookItem&gt;(barcode, it-&gt;second.get());
            }
            cout &lt;&lt; &quot;Added &quot; &lt;&lt; copies &lt;&lt; &quot; more copies of: &quot; &lt;&lt; title &lt;&lt; endl;
        } else {
            // New book
            auto book = make_unique&lt;Book&gt;(isbn, title, author, subject, copies);
            Book* bookPtr = book.get();
            books[isbn] = move(book);

            for (int i = 0; i &lt; copies; i++) {
                string barcode = isbn + &quot;-&quot; + to_string(++bookItemCounter);
                bookItems[barcode] = make_unique&lt;BookItem&gt;(barcode, bookPtr);
            }
            cout &lt;&lt; &quot;Added new book: &quot; &lt;&lt; title &lt;&lt; &quot; with &quot; &lt;&lt; copies &lt;&lt; &quot; copies&quot; &lt;&lt; endl;
        }
    }

    // Register member
    void registerMember(const string&amp; id, const string&amp; name, const string&amp; email,
                       MembershipType type = MembershipType::STANDARD) {
        if (members.find(id) != members.end()) {
            cout &lt;&lt; &quot;Member already registered!&quot; &lt;&lt; endl;
            return;
        }

        members[id] = make_unique&lt;Member&gt;(id, name, email, type);
        cout &lt;&lt; &quot;Member registered: &quot; &lt;&lt; name &lt;&lt; endl;
    }

    // Search books
    vector&lt;Book*&gt; searchByTitle(const string&amp; title) const {
        vector&lt;Book*&gt; results;
        for (const auto&amp; [isbn, book] : books) {
            if (book-&gt;getTitle().find(title) != string::npos) {
                results.push_back(book.get());
            }
        }
        return results;
    }

    vector&lt;Book*&gt; searchByAuthor(const string&amp; author) const {
        vector&lt;Book*&gt; results;
        for (const auto&amp; [isbn, book] : books) {
            if (book-&gt;getAuthor().find(author) != string::npos) {
                results.push_back(book.get());
            }
        }
        return results;
    }

    // Issue book
    bool issueBook(const string&amp; memberId, const string&amp; isbn) {
        // Check member exists
        auto memberIt = members.find(memberId);
        if (memberIt == members.end()) {
            cout &lt;&lt; &quot;Member not found!&quot; &lt;&lt; endl;
            return false;
        }

        Member* member = memberIt-&gt;second.get();

        // Check if member can issue more books
        if (!member-&gt;canIssueBook()) {
            cout &lt;&lt; &quot;Member has reached maximum book limit!&quot; &lt;&lt; endl;
            return false;
        }

        // Find available book item
        BookItem* availableItem = nullptr;
        for (auto&amp; [barcode, item] : bookItems) {
            if (item-&gt;getBook()-&gt;getISBN() == isbn &amp;&amp; item-&gt;isAvailable()) {
                availableItem = item.get();
                break;
            }
        }

        if (availableItem == nullptr) {
            cout &lt;&lt; &quot;No available copy of this book!&quot; &lt;&lt; endl;
            return false;
        }

        // Create lending record
        auto lending = make_unique&lt;Lending&gt;(availableItem, member);
        string lendingId = lending-&gt;getLendingId();

        // Update states
        availableItem-&gt;setStatus(BookStatus::ISSUED);
        member-&gt;issueBook(availableItem-&gt;getBarcode());
        activeLendings[memberId].push_back(lendingId);

        cout &lt;&lt; &quot;\\nBook issued successfully!&quot; &lt;&lt; endl;
        lending-&gt;display();

        lendings[lendingId] = move(lending);

        return true;
    }

    // Return book
    bool returnBook(const string&amp; memberId, const string&amp; barcode) {
        auto memberIt = members.find(memberId);
        if (memberIt == members.end()) {
            cout &lt;&lt; &quot;Member not found!&quot; &lt;&lt; endl;
            return false;
        }

        Member* member = memberIt-&gt;second.get();

        // Find the lending record
        Lending* lendingRecord = nullptr;
        string lendingId;

        for (const auto&amp; lid : activeLendings[memberId]) {
            if (lendings[lid]-&gt;getBookItem()-&gt;getBarcode() == barcode) {
                lendingRecord = lendings[lid].get();
                lendingId = lid;
                break;
            }
        }

        if (lendingRecord == nullptr) {
            cout &lt;&lt; &quot;No lending record found!&quot; &lt;&lt; endl;
            return false;
        }

        // Process return
        lendingRecord-&gt;setReturnDate();
        lendingRecord-&gt;getBookItem()-&gt;setStatus(BookStatus::AVAILABLE);
        member-&gt;returnBook(barcode);

        // Remove from active lendings
        auto&amp; lendings = activeLendings[memberId];
        lendings.erase(remove(lendings.begin(), lendings.end(), lendingId), lendings.end());

        cout &lt;&lt; &quot;\\nBook returned successfully!&quot; &lt;&lt; endl;
        lendingRecord-&gt;display();

        double fine = lendingRecord-&gt;calculateFine();
        if (fine &gt; 0) {
            cout &lt;&lt; &quot;⚠️  Late return fine: $&quot; &lt;&lt; fine &lt;&lt; endl;
        }

        return true;
    }

    // Display available books
    void displayAvailableBooks() const {
        cout &lt;&lt; &quot;\\n========== AVAILABLE BOOKS ==========&quot; &lt;&lt; endl;

        unordered_map&lt;string, int&gt; availableCount;

        for (const auto&amp; [barcode, item] : bookItems) {
            if (item-&gt;isAvailable()) {
                string isbn = item-&gt;getBook()-&gt;getISBN();
                availableCount[isbn]++;
            }
        }

        for (const auto&amp; [isbn, count] : availableCount) {
            books.at(isbn)-&gt;display();
            cout &lt;&lt; &quot;Available copies: &quot; &lt;&lt; count &lt;&lt; endl &lt;&lt; endl;
        }
        cout &lt;&lt; &quot;=====================================&quot; &lt;&lt; endl;
    }

    // Display member info
    void displayMemberInfo(const string&amp; memberId) const {
        auto it = members.find(memberId);
        if (it == members.end()) {
            cout &lt;&lt; &quot;Member not found!&quot; &lt;&lt; endl;
            return;
        }

        cout &lt;&lt; &quot;\\n========== MEMBER INFO ==========&quot; &lt;&lt; endl;
        it-&gt;second-&gt;display();

        // Show active lendings
        auto lendIt = activeLendings.find(memberId);
        if (lendIt != activeLendings.end() &amp;&amp; !lendIt-&gt;second.empty()) {
            cout &lt;&lt; &quot;\\nActive Lendings:&quot; &lt;&lt; endl;
            for (const auto&amp; lendingId : lendIt-&gt;second) {
                lendings.at(lendingId)-&gt;display();
            }
        }
        cout &lt;&lt; &quot;=================================&quot; &lt;&lt; endl;
    }

    static void cleanup() {
        delete instance;
        instance = nullptr;
    }
};

<h3 id="1-book-vs-bookitem">1. <strong>Book vs BookItem</strong></h3>

<h3 id="2-fine-strategy-pattern">2. <strong>Fine Strategy Pattern</strong></h3>
<ul>

<li>Easy to add new strategies</li>
<li>Encapsulates fine logic</li>
</ul>
<h3 id="3-lending-record">3. <strong>Lending Record</strong></h3>
<ul>
<li>Tracks complete lending lifecycle</li>
<li>Calculates fines automatically</li>
<li>Maintains history</li>

<pre><code class="language-cpp">#include &lt;iostream&gt;
#include &lt;string&gt;

using namespace std;

// Forward declarations
class VendingMachineState;
class VendingMachine;

// ============== Product ==============

class Product {
private:
    string id;
    string name;
    double price;
    int quantity;

public:
    Product(const string&amp; i, const string&amp; n, double p, int q)
        : id(i), name(n), price(p), quantity(q) {}

    string getId() const { return id; }
    string getName() const { return name; }
    double getPrice() const { return price; }
    int getQuantity() const { return quantity; }

    bool isAvailable() const { return quantity &gt; 0; }

    void decrementQuantity() {
        if (quantity &gt; 0) quantity--;
    }

    void incrementQuantity(int count = 1) {
        quantity += count;
    }

    void display() const {
        cout &lt;&lt; &quot;[&quot; &lt;&lt; id &lt;&lt; &quot;] &quot; &lt;&lt; name &lt;&lt; &quot; - $&quot; &lt;&lt; price 
             &lt;&lt; &quot; (&quot; &lt;&lt; quantity &lt;&lt; &quot; available)&quot; &lt;&lt; endl;
    }
};

// ============== Inventory ==============

class Inventory {
private:
    map&lt;string, unique_ptr&lt;Product&gt;&gt; products;

public:
    void addProduct(unique_ptr&lt;Product&gt; product) {
        string id = product-&gt;getId();
        products[id] = move(product);
    }

    Product* getProduct(const string&amp; id) {
        auto it = products.find(id);
        return (it != products.end()) ? it-&gt;second.get() : nullptr;
    }

    void updateQuantity(const string&amp; id, int quantity) {
        Product* product = getProduct(id);
        if (product) {
            product-&gt;incrementQuantity(quantity);
        }
    }

    void displayAll() const {
        cout &lt;&lt; &quot;\\n========== PRODUCTS ==========&quot; &lt;&lt; endl;
        for (const auto&amp; [id, product] : products) {
            product-&gt;display();
        }
        cout &lt;&lt; &quot;==============================\\n&quot; &lt;&lt; endl;
    }
};

// ============== Money/Coin ==============

enum class Coin {
    PENNY = 1,
    NICKEL = 5,
    DIME = 10,
    QUARTER = 25
};

enum class Note {
    ONE = 100,
    FIVE = 500,
    TEN = 1000,
    TWENTY = 2000
};

// ============== Vending Machine States ==============

class VendingMachineState {
public:
    virtual ~VendingMachineState() = default;
    virtual void insertMoney(VendingMachine* machine, double amount) = 0;
    virtual void selectProduct(VendingMachine* machine, const string&amp; productId) = 0;
    virtual void dispenseProduct(VendingMachine* machine) = 0;
    virtual void cancelTransaction(VendingMachine* machine) = 0;
    virtual string getStateName() const = 0;
};

// Forward declare states
class IdleState;
class AcceptingMoneyState;
class DispensingState;

// ============== Vending Machine ==============

class VendingMachine {
private:
    static VendingMachine* instance;

    VendingMachineState* currentState;
    unique_ptr&lt;IdleState&gt; idleState;
    unique_ptr&lt;AcceptingMoneyState&gt; acceptingMoneyState;
    unique_ptr&lt;DispensingState&gt; dispensingState;

    Inventory inventory;
    double currentBalance;
    Product* selectedProduct;

    VendingMachine() : currentBalance(0), selectedProduct(nullptr) {
        initializeStates();
        initializeInventory();
    }

    void initializeStates();

    void initializeInventory() {
        inventory.addProduct(make_unique&lt;Product&gt;(&quot;A1&quot;, &quot;Coke&quot;, 1.50, 10));
        inventory.addProduct(make_unique&lt;Product&gt;(&quot;A2&quot;, &quot;Pepsi&quot;, 1.50, 10));
        inventory.addProduct(make_unique&lt;Product&gt;(&quot;B1&quot;, &quot;Water&quot;, 1.00, 15));
        inventory.addProduct(make_unique&lt;Product&gt;(&quot;B2&quot;, &quot;Juice&quot;, 2.00, 8));
        inventory.addProduct(make_unique&lt;Product&gt;(&quot;C1&quot;, &quot;Chips&quot;, 1.25, 12));
        inventory.addProduct(make_unique&lt;Product&gt;(&quot;C2&quot;, &quot;Chocolate&quot;, 1.75, 10));
    }

public:
    static VendingMachine* getInstance() {
        if (instance == nullptr) {
            instance = new VendingMachine();
        }
        return instance;
    }

    VendingMachineState* getIdleState() { return idleState.get(); }
    VendingMachineState* getAcceptingMoneyState() { return acceptingMoneyState.get(); }
    VendingMachineState* getDispensingState() { return dispensingState.get(); }

    void setState(VendingMachineState* state) {
        cout &lt;&lt; &quot;\\n[State Change: &quot; &lt;&lt; currentState-&gt;getStateName() 
             &lt;&lt; &quot; -&gt; &quot; &lt;&lt; state-&gt;getStateName() &lt;&lt; &quot;]&quot; &lt;&lt; endl;
        currentState = state;
    }

    double getCurrentBalance() const { return currentBalance; }
    void addBalance(double amount) { currentBalance += amount; }
    void resetBalance() { currentBalance = 0; }

    Product* getSelectedProduct() const { return selectedProduct; }
    void setSelectedProduct(Product* product) { selectedProduct = product; }

    Inventory&amp; getInventory() { return inventory; }

    // Public interface
    void insertMoney(double amount) {
        currentState-&gt;insertMoney(this, amount);
    }

    void selectProduct(const string&amp; productId) {
        currentState-&gt;selectProduct(this, productId);
    }

    void dispenseProduct() {
        currentState-&gt;dispenseProduct(this);
    }

    void cancelTransaction() {
        currentState-&gt;cancelTransaction(this);
    }

    void displayProducts() {
        inventory.displayAll();
    }

    void displayStatus() {
        cout &lt;&lt; &quot;\\n========== VENDING MACHINE STATUS ==========&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;State: &quot; &lt;&lt; currentState-&gt;getStateName() &lt;&lt; endl;
        cout &lt;&lt; &quot;Current Balance: $&quot; &lt;&lt; currentBalance &lt;&lt; endl;
        if (selectedProduct) {
            cout &lt;&lt; &quot;Selected Product: &quot; &lt;&lt; selectedProduct-&gt;getName() &lt;&lt; endl;
        }
        cout &lt;&lt; &quot;===========================================\\n&quot; &lt;&lt; endl;
    }

    static void cleanup() {
        delete instance;
        instance = nullptr;
    }
};

VendingMachine* VendingMachine::instance = nullptr;

// ============== Concrete States ==============

class IdleState : public VendingMachineState {
public:
    void insertMoney(VendingMachine* machine, double amount) override {
        cout &lt;&lt; &quot;Money inserted: $&quot; &lt;&lt; amount &lt;&lt; endl;
        machine-&gt;addBalance(amount);
        machine-&gt;setState(machine-&gt;getAcceptingMoneyState());
    }

    void selectProduct(VendingMachine* machine, const string&amp; productId) override {
        cout &lt;&lt; &quot;Please insert money first!&quot; &lt;&lt; endl;
    }

    void dispenseProduct(VendingMachine* machine) override {
        cout &lt;&lt; &quot;Please insert money and select product first!&quot; &lt;&lt; endl;
    }

    void cancelTransaction(VendingMachine* machine) override {
        cout &lt;&lt; &quot;No transaction to cancel!&quot; &lt;&lt; endl;
    }

    string getStateName() const override { return &quot;IDLE&quot;; }
};

class AcceptingMoneyState : public VendingMachineState {
public:
    void insertMoney(VendingMachine* machine, double amount) override {
        cout &lt;&lt; &quot;Money inserted: $&quot; &lt;&lt; amount &lt;&lt; endl;
        machine-&gt;addBalance(amount);
        cout &lt;&lt; &quot;Total balance: $&quot; &lt;&lt; machine-&gt;getCurrentBalance() &lt;&lt; endl;
    }

    void selectProduct(VendingMachine* machine, const string&amp; productId) override {
        Product* product = machine-&gt;getInventory().getProduct(productId);

        if (product == nullptr) {
            cout &lt;&lt; &quot;Invalid product code!&quot; &lt;&lt; endl;
            return;
        }

        if (!product-&gt;isAvailable()) {
            cout &lt;&lt; &quot;Product out of stock!&quot; &lt;&lt; endl;
            return;
        }

        if (machine-&gt;getCurrentBalance() &lt; product-&gt;getPrice()) {
            cout &lt;&lt; &quot;Insufficient balance! Need $&quot; &lt;&lt; product-&gt;getPrice() 
                 &lt;&lt; &quot;, have $&quot; &lt;&lt; machine-&gt;getCurrentBalance() &lt;&lt; endl;
            return;
        }

        machine-&gt;setSelectedProduct(product);
        cout &lt;&lt; &quot;Product selected: &quot; &lt;&lt; product-&gt;getName() &lt;&lt; endl;
        machine-&gt;setState(machine-&gt;getDispensingState());
        machine-&gt;dispenseProduct(); // Auto-dispense
    }

    void dispenseProduct(VendingMachine* machine) override {
        cout &lt;&lt; &quot;Please select a product first!&quot; &lt;&lt; endl;
    }

    void cancelTransaction(VendingMachine* machine) override {
        double refund = machine-&gt;getCurrentBalance();
        cout &lt;&lt; &quot;Transaction cancelled. Refunding: $&quot; &lt;&lt; refund &lt;&lt; endl;
        machine-&gt;resetBalance();
        machine-&gt;setState(machine-&gt;getIdleState());
    }

    string getStateName() const override { return &quot;ACCEPTING_MONEY&quot;; }
};

class DispensingState : public VendingMachineState {
public:
    void insertMoney(VendingMachine* machine, double amount) override {
        cout &lt;&lt; &quot;Please wait, dispensing product...&quot; &lt;&lt; endl;
    }

    void selectProduct(VendingMachine* machine, const string&amp; productId) override {
        cout &lt;&lt; &quot;Please wait, dispensing product...&quot; &lt;&lt; endl;
    }

    void dispenseProduct(VendingMachine* machine) override {
        Product* product = machine-&gt;getSelectedProduct();

        cout &lt;&lt; &quot;\\n========== DISPENSING ==========&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;Dispensing: &quot; &lt;&lt; product-&gt;getName() &lt;&lt; endl;

        // Deduct price
        double price = product-&gt;getPrice();
        double change = machine-&gt;getCurrentBalance() - price;

        // Dispense product
        product-&gt;decrementQuantity();

        // Return change
        if (change &gt; 0) {
            cout &lt;&lt; &quot;Returning change: $&quot; &lt;&lt; change &lt;&lt; endl;
        }

        cout &lt;&lt; &quot;Thank you! Enjoy your &quot; &lt;&lt; product-&gt;getName() &lt;&lt; endl;
        cout &lt;&lt; &quot;================================\\n&quot; &lt;&lt; endl;

        // Reset machine
        machine-&gt;resetBalance();
        machine-&gt;setSelectedProduct(nullptr);
        machine-&gt;setState(machine-&gt;getIdleState());
    }

    void cancelTransaction(VendingMachine* machine) override {
        cout &lt;&lt; &quot;Cannot cancel during dispensing!&quot; &lt;&lt; endl;
    }

    string getStateName() const override { return &quot;DISPENSING&quot;; }
};

// Initialize states
void VendingMachine::initializeStates() {
    idleState = make_unique&lt;IdleState&gt;();
    acceptingMoneyState = make_unique&lt;AcceptingMoneyState&gt;();
    dispensingState = make_unique&lt;DispensingState&gt;();

    currentState = idleState.get();
}
