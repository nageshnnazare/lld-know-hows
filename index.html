// ============== Delivery Matching ==============

class DeliveryMatcher {
public:
    static DeliveryPartner* findBestPartner(
        const vector&lt;DeliveryPartner*&gt;&amp; partners,
        const Location&amp; restaurantLoc) {

        DeliveryPartner* best = nullptr;
        double minDistance = 1e9;

        for (DeliveryPartner* partner : partners) {
            if (partner-&gt;getStatus() == PartnerStatus::AVAILABLE) {
                double distance = partner-&gt;getLocation().distanceTo(restaurantLoc);

                if (distance &lt; minDistance) {
                    minDistance = distance;
                    best = partner;
                }
            }
        }

        return best;
    }
};

// ============== Food Delivery System ==============

class FoodDeliverySystem {
private:
    map&lt;string, unique_ptr&lt;Restaurant&gt;&gt; restaurants;
    map&lt;string, unique_ptr&lt;Customer&gt;&gt; customers;
    map&lt;string, unique_ptr&lt;DeliveryPartner&gt;&gt; deliveryPartners;
    map&lt;string, unique_ptr&lt;Order&gt;&gt; orders;

public:
    Restaurant* addRestaurant(const string&amp; id, const string&amp; name, const Location&amp; loc) {
        auto restaurant = make_unique&lt;Restaurant&gt;(id, name, loc);
        Restaurant* ptr = restaurant.get();
        restaurants[id] = move(restaurant);
        cout &lt;&lt; &quot;✓ Restaurant added: &quot; &lt;&lt; name &lt;&lt; endl;
        return ptr;
    }

    Customer* registerCustomer(const string&amp; id, const string&amp; name,
                              const string&amp; phone, const Location&amp; loc) {
        auto customer = make_unique&lt;Customer&gt;(id, name, phone, loc);
        Customer* ptr = customer.get();
        customers[id] = move(customer);
        cout &lt;&lt; &quot;✓ Customer registered: &quot; &lt;&lt; name &lt;&lt; endl;
        return ptr;
    }

    DeliveryPartner* registerPartner(const string&amp; id, const string&amp; name,
                                    const string&amp; phone, const Location&amp; loc) {
        auto partner = make_unique&lt;DeliveryPartner&gt;(id, name, phone, loc);
        DeliveryPartner* ptr = partner.get();
        deliveryPartners[id] = move(partner);
        cout &lt;&lt; &quot;✓ Delivery partner registered: &quot; &lt;&lt; name &lt;&lt; endl;
        return ptr;
    }

    Order* placeOrder(Customer* customer, Restaurant* restaurant,
                     const vector&lt;pair&lt;string, int&gt;&gt;&amp; items) {

        if (!restaurant-&gt;open()) {
            cout &lt;&lt; &quot;Restaurant is closed!&quot; &lt;&lt; endl;
            return nullptr;
        }

        auto order = make_unique&lt;Order&gt;(customer, restaurant);

        // Add items
        bool allAvailable = true;
        for (const auto&amp; [itemId, quantity] : items) {
            MenuItem* item = restaurant-&gt;getMenuItem(itemId);
            if (item &amp;&amp; item-&gt;available()) {
                order-&gt;addItem(item, quantity);
            } else {
                allAvailable = false;
                cout &lt;&lt; &quot;Item &quot; &lt;&lt; itemId &lt;&lt; &quot; not available&quot; &lt;&lt; endl;
            }
        }

        if (!allAvailable) {
            cout &lt;&lt; &quot;Some items unavailable. Order cancelled.&quot; &lt;&lt; endl;
            return nullptr;
        }

        order-&gt;calculateTotal();

        // Find delivery partner
        vector&lt;DeliveryPartner*&gt; availablePartners;
        for (const auto&amp; [id, partner] : deliveryPartners) {
            availablePartners.push_back(partner.get());
        }

        DeliveryPartner* partner = DeliveryMatcher::findBestPartner(
            availablePartners, restaurant-&gt;getLocation());

        if (!partner) {
            cout &lt;&lt; &quot;No delivery partners available!&quot; &lt;&lt; endl;
            return nullptr;
        }

        order-&gt;setDeliveryPartner(partner);
        order-&gt;updateStatus(OrderStatus::ACCEPTED);

        Order* orderPtr = order.get();
        string orderId = order-&gt;getId();
        orders[orderId] = move(order);
        customer-&gt;addOrderToHistory(orderId);

        cout &lt;&lt; &quot;✓ Order placed successfully!&quot; &lt;&lt; endl;
        return orderPtr;
    }

    void updateOrderStatus(const string&amp; orderId, OrderStatus status) {
        auto it = orders.find(orderId);
        if (it != orders.end()) {
            it-&gt;second-&gt;updateStatus(status);
            cout &lt;&lt; &quot;✓ Order &quot; &lt;&lt; orderId &lt;&lt; &quot; updated to status &quot; &lt;&lt; (int)status &lt;&lt; endl;
        }
    }

    vector&lt;Restaurant*&gt; findNearbyRestaurants(const Location&amp; customerLoc, double maxDistance) {
        vector&lt;Restaurant*&gt; nearby;

        for (const auto&amp; [id, restaurant] : restaurants) {
            double distance = restaurant-&gt;getLocation().distanceTo(customerLoc);
            if (distance &lt;= maxDistance &amp;&amp; restaurant-&gt;open()) {
                nearby.push_back(restaurant.get());
            }
        }

        // Sort by rating
        sort(nearby.begin(), nearby.end(), [](Restaurant* a, Restaurant* b) {
            return a-&gt;getRating() &gt; b-&gt;getRating();
        });

        return nearby;
    }

    void displayAvailablePartners() const {
        cout &lt;&lt; &quot;\\n========== Available Delivery Partners ==========&quot; &lt;&lt; endl;
        for (const auto&amp; [id, partner] : deliveryPartners) {

enum class OrderType { MARKET, LIMIT };

enum class OrderStatus { PENDING, PARTIALLY_FILLED, FILLED, CANCELLED };

// ============== Stock ==============

class Stock {
private:
    string symbol;
    string companyName;
    double currentPrice;
    double openPrice;
    double highPrice;
    double lowPrice;
    long long volume;

public:
    Stock(const string&amp; sym, const string&amp; name, double price)
        : symbol(sym), companyName(name), currentPrice(price),
          openPrice(price), highPrice(price), lowPrice(price), volume(0) {}

    string getSymbol() const { return symbol; }
    string getCompanyName() const { return companyName; }
    double getCurrentPrice() const { return currentPrice; }
    long long getVolume() const { return volume; }

    void updatePrice(double price, long long qty) {
        currentPrice = price;
        volume += qty;

        if (price &gt; highPrice) highPrice = price;
        if (price &lt; lowPrice) lowPrice = price;
    }

    void display() const {
        cout &lt;&lt; symbol &lt;&lt; &quot; - &quot; &lt;&lt; companyName &lt;&lt; endl;
        cout &lt;&lt; &quot;Price: $&quot; &lt;&lt; fixed &lt;&lt; setprecision(2) &lt;&lt; currentPrice
             &lt;&lt; &quot; | Volume: &quot; &lt;&lt; volume &lt;&lt; endl;
        cout &lt;&lt; &quot;High: $&quot; &lt;&lt; highPrice &lt;&lt; &quot; | Low: $&quot; &lt;&lt; lowPrice &lt;&lt; endl;
    }
};

// ============== Order ==============

class Order {
private:
    string orderId;
    string traderId;
    string symbol;
    OrderType type;
    OrderSide side;
    int quantity;
    int filledQuantity;
    double price; // For limit orders
    OrderStatus status;
    time_t timestamp;
    static int orderCounter;

public:
    Order(const string&amp; tId, const string&amp; sym, OrderType t, OrderSide s,
          int qty, double p = 0)
        : traderId(tId), symbol(sym), type(t), side(s), quantity(qty),
          filledQuantity(0), price(p), status(OrderStatus::PENDING),
          timestamp(time(nullptr)) {
        orderId = &quot;ORD&quot; + to_string(++orderCounter);
    }

    string getId() const { return orderId; }
    string getTraderId() const { return traderId; }
    string getSymbol() const { return symbol; }
    OrderType getType() const { return type; }
    OrderSide getSide() const { return side; }
    int getQuantity() const { return quantity; }
    int getFilledQuantity() const { return filledQuantity; }
    int getRemainingQuantity() const { return quantity - filledQuantity; }
    double getPrice() const { return price; }
    OrderStatus getStatus() const { return status; }
    time_t getTimestamp() const { return timestamp; }

    void fill(int qty) {
        filledQuantity += qty;

        if (filledQuantity &gt;= quantity) {
            status = OrderStatus::FILLED;
        } else if (filledQuantity &gt; 0) {
            status = OrderStatus::PARTIALLY_FILLED;
        }
    }

    void cancel() {
        status = OrderStatus::CANCELLED;
    }

             &lt;&lt; (side == OrderSide::BUY ? &quot;BUY&quot; : &quot;SELL&quot;) &lt;&lt; &quot; | &quot;

// ============== Portfolio ==============

class Portfolio {
private:
    map&lt;string, int&gt; holdings; // symbol -&gt; quantity
    double cashBalance;

public:
    Portfolio(double initialCash) : cashBalance(initialCash) {}

    double getCashBalance() const { return cashBalance; }

    int getHolding(const string&amp; symbol) const {
        auto it = holdings.find(symbol);
        return (it != holdings.end()) ? it-&gt;second : 0;
    }

    bool canBuy(int quantity, double price) const {
        return cashBalance &gt;= (quantity * price);
    }

    bool canSell(const string&amp; symbol, int quantity) const {
        return getHolding(symbol) &gt;= quantity;
    }

    void buy(const string&amp; symbol, int quantity, double price) {
        cashBalance -= quantity * price;
        holdings[symbol] += quantity;
    }

    void sell(const string&amp; symbol, int quantity, double price) {
        cashBalance += quantity * price;
        holdings[symbol] -= quantity;

        if (holdings[symbol] == 0) {
            holdings.erase(symbol);
        }
    }

    double getTotalValue(const map&lt;string, Stock*&gt;&amp; stocks) const {
        double total = cashBalance;

        for (const auto&amp; [symbol, quantity] : holdings) {
            auto it = stocks.find(symbol);
            if (it != stocks.end()) {
                total += quantity * it-&gt;second-&gt;getCurrentPrice();
            }
        }

        return total;
    }

    void display(const map&lt;string, Stock*&gt;&amp; stocks) const {
        cout &lt;&lt; &quot;\\n========== PORTFOLIO ==========&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;Cash Balance: $&quot; &lt;&lt; fixed &lt;&lt; setprecision(2) &lt;&lt; cashBalance &lt;&lt; endl;
        cout &lt;&lt; &quot;Holdings:&quot; &lt;&lt; endl;

        if (holdings.empty()) {
            cout &lt;&lt; &quot;  (none)&quot; &lt;&lt; endl;
        } else {
            for (const auto&amp; [symbol, quantity] : holdings) {
                auto it = stocks.find(symbol);
                double currentPrice = (it != stocks.end()) ? it-&gt;second-&gt;getCurrentPrice() : 0;
                double value = quantity * currentPrice;
                cout &lt;&lt; &quot;  &quot; &lt;&lt; symbol &lt;&lt; &quot;: &quot; &lt;&lt; quantity &lt;&lt; &quot; shares @ $&quot;
                     &lt;&lt; currentPrice &lt;&lt; &quot; = $&quot; &lt;&lt; value &lt;&lt; endl;
            }
        }

        cout &lt;&lt; &quot;Total Value: $&quot; &lt;&lt; getTotalValue(stocks) &lt;&lt; endl;
        cout &lt;&lt; &quot;===============================\\n&quot; &lt;&lt; endl;
    }
};

// ============== Order Book ==============

struct BidComparator {
    bool operator()(Order* a, Order* b) const {
        // Higher price first, then earlier timestamp
        if (a-&gt;getPrice() != b-&gt;getPrice()) {
            return a-&gt;getPrice() &lt; b-&gt;getPrice();
        }
        return a-&gt;getTimestamp() &gt; b-&gt;getTimestamp();
    }
};

struct AskComparator {
    bool operator()(Order* a, Order* b) const {
        // Lower price first, then earlier timestamp
        if (a-&gt;getPrice() != b-&gt;getPrice()) {
            return a-&gt;getPrice() &gt; b-&gt;getPrice();
        }
        return a-&gt;getTimestamp() &gt; b-&gt;getTimestamp();
    }
};

class OrderBook {
private:
    string symbol;
    priority_queue&lt;Order*, vector&lt;Order*&gt;, BidComparator&gt; bids;
    priority_queue&lt;Order*, vector&lt;Order*&gt;, AskComparator&gt; asks;

public:
    OrderBook(const string&amp; sym) : symbol(sym) {}

    void addBid(Order* order) {
        bids.push(order);
    }

    void addAsk(Order* order) {
        asks.push(order);
    }

    Order* getTopBid() {
        while (!bids.empty() &amp;&amp; bids.top()-&gt;getStatus() != OrderStatus::PENDING &amp;&amp;
               bids.top()-&gt;getStatus() != OrderStatus::PARTIALLY_FILLED) {
            bids.pop();
        }
        return bids.empty() ? nullptr : bids.top();
    }

    Order* getTopAsk() {
        while (!asks.empty() &amp;&amp; asks.top()-&gt;getStatus() != OrderStatus::PENDING &amp;&amp;
               asks.top()-&gt;getStatus() != OrderStatus::PARTIALLY_FILLED) {
            asks.pop();
        }
        return asks.empty() ? nullptr : asks.top();
    }

    void display() const {
        cout &lt;&lt; &quot;\\n========== ORDER BOOK: &quot; &lt;&lt; symbol &lt;&lt; &quot; ==========&quot; &lt;&lt; endl;

        // Note: Can't display priority_queue directly without copying
        cout &lt;&lt; &quot;Bids: &quot; &lt;&lt; bids.size() &lt;&lt; &quot; orders&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;Asks: &quot; &lt;&lt; asks.size() &lt;&lt; &quot; orders&quot; &lt;&lt; endl;

        cout &lt;&lt; &quot;=============================================\\n&quot; &lt;&lt; endl;
    }
};

// ============== Matching Engine ==============

class MatchingEngine {
public:
    vector&lt;Trade&gt; matchOrders(OrderBook&amp; orderBook, Stock* stock) {
        vector&lt;Trade&gt; trades;

        while (true) {
            Order* bid = orderBook.getTopBid();
            Order* ask = orderBook.getTopAsk();

            if (!bid || !ask) break;

            // Check if prices match
            if (bid-&gt;getPrice() &lt; ask-&gt;getPrice()) break;

            // Execute trade
            int tradeQty = min(bid-&gt;getRemainingQuantity(), ask-&gt;getRemainingQuantity());
            double tradePrice = ask-&gt;getPrice(); // Price discovery: ask price

            bid-&gt;fill(tradeQty);
            ask-&gt;fill(tradeQty);

            trades.emplace_back(bid-&gt;getId(), ask-&gt;getId(),
                               stock-&gt;getSymbol(), tradeQty, tradePrice);

            stock-&gt;updatePrice(tradePrice, tradeQty);
        }

        return trades;
    }
};

// ============== Trading System ==============

class TradingSystem {
private:
    map&lt;string, unique_ptr&lt;Stock&gt;&gt; stocks;
    map&lt;string, unique_ptr&lt;Trader&gt;&gt; traders;
    map&lt;string, unique_ptr&lt;OrderBook&gt;&gt; orderBooks;
    map&lt;string, unique_ptr&lt;Order&gt;&gt; orders;
    MatchingEngine matchingEngine;
    vector&lt;Trade&gt; tradeHistory;

public:
    Stock* addStock(const string&amp; symbol, const string&amp; name, double price) {
        auto stock = make_unique&lt;Stock&gt;(symbol, name, price);
        Stock* ptr = stock.get();
        stocks[symbol] = move(stock);

        orderBooks[symbol] = make_unique&lt;OrderBook&gt;(symbol);

        cout &lt;&lt; &quot;✓ Stock added: &quot; &lt;&lt; symbol &lt;&lt; endl;
        return ptr;
    }

    Trader* registerTrader(const string&amp; id, const string&amp; name, double initialCash) {
        auto trader = make_unique&lt;Trader&gt;(id, name, initialCash);
        Trader* ptr = trader.get();
        traders[id] = move(trader);

        cout &lt;&lt; &quot;✓ Trader registered: &quot; &lt;&lt; name &lt;&lt; endl;
        return ptr;
    }

    Order* placeOrder(Trader* trader, const string&amp; symbol, OrderType type,
                     OrderSide side, int quantity, double limitPrice = 0) {

        Stock* stock = getStock(symbol);
        if (!stock) {
            cout &lt;&lt; &quot;Stock not found!&quot; &lt;&lt; endl;
            return nullptr;
        }

        // Validate trader has sufficient funds/shares
        Portfolio&amp; portfolio = trader-&gt;getPortfolio();

        if (side == OrderSide::BUY) {
            double price = (type == OrderType::MARKET) ? stock-&gt;getCurrentPrice() : limitPrice;
            if (!portfolio.canBuy(quantity, price)) {
                cout &lt;&lt; &quot;Insufficient funds!&quot; &lt;&lt; endl;
                return nullptr;
            }
        } else {
            if (!portfolio.canSell(symbol, quantity)) {
                cout &lt;&lt; &quot;Insufficient shares!&quot; &lt;&lt; endl;
                return nullptr;
            }
        }

        // Create order
        double orderPrice = (type == OrderType::MARKET) ? stock-&gt;getCurrentPrice() : limitPrice;
        auto order = make_unique&lt;Order&gt;(trader-&gt;getId(), symbol, type, side, quantity, orderPrice);
        Order* orderPtr = order.get();
        string orderId = order-&gt;getId();

        orders[orderId] = move(order);

        // Add to order book
        OrderBook* orderBook = orderBooks[symbol].get();
        if (side == OrderSide::BUY) {
            orderBook-&gt;addBid(orderPtr);
        } else {
            orderBook-&gt;addAsk(orderPtr);
        }

        cout &lt;&lt; &quot;✓ Order placed: &quot; &lt;&lt; orderId &lt;&lt; endl;
        orderPtr-&gt;display();

        // Try to match orders
        vector&lt;Trade&gt; trades = matchingEngine.matchOrders(*orderBook, stock);

        // Execute trades
        for (const Trade&amp; trade : trades) {
            executeTrade(trade);
            tradeHistory.push_back(trade);
        }

        return orderPtr;
    }

    void executeTrade(const Trade&amp; trade) {
        trade.display();

        // Update trader portfolios
        Order* buyOrder = getOrder(trade.buyOrderId);
        Order* sellOrder = getOrder(trade.sellOrderId);

        if (buyOrder &amp;&amp; sellOrder) {
            Trader* buyer = getTrader(buyOrder-&gt;getTraderId());
            Trader* seller = getTrader(sellOrder-&gt;getTraderId());

            if (buyer &amp;&amp; seller) {
                buyer-&gt;getPortfolio().buy(trade.getSymbol(), trade.getQuantity(), trade.getPrice());
                seller-&gt;getPortfolio().sell(trade.getSymbol(), trade.getQuantity(), trade.getPrice());
            }
        }
    }

    Stock* getStock(const string&amp; symbol) {
        auto it = stocks.find(symbol);
        return (it != stocks.end()) ? it-&gt;second.get() : nullptr;
    }

    Trader* getTrader(const string&amp; traderId) {
        auto it = traders.find(traderId);
        return (it != traders.end()) ? it-&gt;second.get() : nullptr;
    }

    Order* getOrder(const string&amp; orderId) {
        auto it = orders.find(orderId);
        return (it != orders.end()) ? it-&gt;second.get() : nullptr;
    }

    void displayMarket() const {
        cout &lt;&lt; &quot;\\n========== MARKET OVERVIEW ==========&quot; &lt;&lt; endl;
        for (const auto&amp; [symbol, stock] : stocks) {
            stock-&gt;display();
            cout &lt;&lt; &quot;---&quot; &lt;&lt; endl;
        }
        cout &lt;&lt; &quot;=====================================\\n&quot; &lt;&lt; endl;
    }
};

int main() {
    TradingSystem system;

    cout &lt;&lt; &quot;========== Stock Trading System Demo ==========\\n&quot; &lt;&lt; endl;

    // Add stocks
    cout &lt;&lt; &quot;=== Adding Stocks ===&quot; &lt;&lt; endl;
    Stock* aapl = system.addStock(&quot;AAPL&quot;, &quot;Apple Inc.&quot;, 150.00);
    Stock* googl = system.addStock(&quot;GOOGL&quot;, &quot;Alphabet Inc.&quot;, 2800.00);
    Stock* msft = system.addStock(&quot;MSFT&quot;, &quot;Microsoft Corp.&quot;, 300.00);

    cout &lt;&lt; endl;

// ============== Money ==============

class Money {
private:
    double amount;
    Currency currency;

public:
    Money(double amt = 0, Currency cur = Currency::USD)
        : amount(amt), currency(cur) {}

    double getAmount() const { return amount; }
    Currency getCurrency() const { return currency; }

    string toString() const {
        string symbol;
        switch (currency) {
            case Currency::USD: symbol = &quot;$&quot;; break;
            case Currency::EUR: symbol = &quot;€&quot;; break;
            case Currency::GBP: symbol = &quot;£&quot;; break;
            case Currency::INR: symbol = &quot;₹&quot;; break;
        }

        stringstream ss;
        ss &lt;&lt; symbol &lt;&lt; fixed &lt;&lt; setprecision(2) &lt;&lt; amount;
        return ss.str();
    }

    Money convert(Currency targetCurrency) const {
        // Simplified conversion rates
        static map&lt;pair&lt;Currency, Currency&gt;, double&gt; rates = {
            {{Currency::USD, Currency::INR}, 83.0},
            {{Currency::USD, Currency::EUR}, 0.92},
            {{Currency::USD, Currency::GBP}, 0.79},
            {{Currency::INR, Currency::USD}, 0.012},
            // ... more rates
        };

        if (currency == targetCurrency) return *this;

        auto it = rates.find({currency, targetCurrency});
        if (it != rates.end()) {
            return Money(amount * it-&gt;second, targetCurrency);
        }

        return *this;
    }
};

// ============== Transaction ==============

class Transaction {
private:

    string merchantId;
    string customerId;

        : merchantId(mId), customerId(cId), amount(amt),
          paymentDetails(move(details)), status(TransactionStatus::PENDING),
          timestamp(time(nullptr)), description(desc), fraudScore(0) {

        // Generate transaction ID
        transactionId = &quot;TXN&quot; + to_string(++transactionCounter);
    }

    string getId() const { return transactionId; }
    string getMerchantId() const { return merchantId; }
    string getCustomerId() const { return customerId; }
    Money getAmount() const { return amount; }
    TransactionStatus getStatus() const { return status; }
    double getFraudScore() const { return fraudScore; }
    time_t getTimestamp() const { return timestamp; }

    void setStatus(TransactionStatus s) { status = s; }
    void setFraudScore(double score) { fraudScore = score; }

    PaymentDetails* getPaymentDetails() const { return paymentDetails.get(); }

    bool isSuccess() const { return status == TransactionStatus::SUCCESS; }

    void display() const {
        cout &lt;&lt; &quot;\\n========== TRANSACTION ==========&quot; &lt;&lt; endl;

        cout &lt;&lt; &quot;Status: &quot; &lt;&lt; (int)status &lt;&lt; endl;
        cout &lt;&lt; &quot;Description: &quot; &lt;&lt; description &lt;&lt; endl;

        strftime(timeStr, sizeof(timeStr), &quot;%Y-%m-%d %H:%M:%S&quot;, timeinfo);
        cout &lt;&lt; &quot;Time: &quot; &lt;&lt; timeStr &lt;&lt; endl;

        if (fraudScore &gt; 0) {
            cout &lt;&lt; &quot;Fraud Score: &quot; &lt;&lt; fraudScore &lt;&lt; &quot;/100&quot; &lt;&lt; endl;
        }
        cout &lt;&lt; &quot;================================\\n&quot; &lt;&lt; endl;
    }
};

int Transaction::transactionCounter = 0;

// ============== Fraud Detector ==============

class FraudDetector {
private:
    map&lt;string, vector&lt;time_t&gt;&gt; customerTransactions;
    map&lt;string, double&gt; customerRiskScores;

public:
    double calculateFraudScore(Transaction* transaction) {
        double score = 0;

        // Check amount (high amounts are riskier)
        double amount = transaction-&gt;getAmount().getAmount();
        if (amount &gt; 1000) score += 20;
        if (amount &gt; 5000) score += 30;

        // Check transaction frequency
        string customerId = transaction-&gt;getCustomerId();
        time_t now = time(nullptr);

        auto&amp; transactions = customerTransactions[customerId];

        // Count transactions in last hour
        int recentCount = 0;
        for (time_t t : transactions) {
            if (now - t &lt; 3600) { // 1 hour
                recentCount++;
            }
        }

        if (recentCount &gt; 3) score += 25;
        if (recentCount &gt; 5) score += 40;

        transactions.push_back(now);

        // Check customer risk score
        if (customerRiskScores.find(customerId) != customerRiskScores.end()) {
            score += customerRiskScores[customerId];
        }

        return min(score, 100.0);
    }

    bool shouldBlock(double fraudScore) {
        return fraudScore &gt;= 75;
    }

    bool requiresVerification(double fraudScore) {
        return fraudScore &gt;= 50 &amp;&amp; fraudScore &lt; 75;
    }
};

// ============== Payment Processor ==============

class PaymentProcessor {
public:
    virtual ~PaymentProcessor() = default;

    virtual bool processPayment(Transaction* transaction) {
        // Simulate payment processing
        random_device rd;
        mt19937 gen(rd());
        uniform_int_distribution&lt;&gt; dis(1, 100);

        int success = dis(gen);

        // 95% success rate
        return success &lt;= 95;
    }

    virtual bool refund(Transaction* transaction) {
        if (transaction-&gt;isSuccess()) {
            transaction-&gt;setStatus(TransactionStatus::REFUNDED);
            return true;
        }
        return false;
    }
};

class CardProcessor : public PaymentProcessor {
public:
    bool processPayment(Transaction* transaction) override {
        CardDetails* card = dynamic_cast&lt;CardDetails*&gt;(transaction-&gt;getPaymentDetails());

        if (!card || !card-&gt;validate()) {
            return false;
        }

        cout &lt;&lt; &quot;Processing card payment...&quot; &lt;&lt; endl;
        return PaymentProcessor::processPayment(transaction);
    }
};

class UPIProcessor : public PaymentProcessor {
public:
    bool processPayment(Transaction* transaction) override {
        UPIDetails* upi = dynamic_cast&lt;UPIDetails*&gt;(transaction-&gt;getPaymentDetails());

        if (!upi || !upi-&gt;validate()) {
            return false;
        }

        cout &lt;&lt; &quot;Processing UPI payment...&quot; &lt;&lt; endl;
        return PaymentProcessor::processPayment(transaction);
    }
};

class Merchant {
private:
    string merchantId;
    string name;
    string apiKey;
    double balance;
    vector&lt;string&gt; transactionHistory;

public:
    Merchant(const string&amp; id, const string&amp; n)
        : merchantId(id), name(n), balance(0) {

        apiKey = &quot;sk_live_&quot; + id;
    }

    string getId() const { return merchantId; }

    string getApiKey() const { return apiKey; }

// ============== Payment Gateway ==============

class PaymentGateway {
private:
    map&lt;string, unique_ptr&lt;Merchant&gt;&gt; merchants;
    map&lt;string, unique_ptr&lt;Transaction&gt;&gt; transactions;
    map&lt;PaymentMethod, unique_ptr&lt;PaymentProcessor&gt;&gt; processors;
    FraudDetector fraudDetector;

public:
    PaymentGateway() {
        // Initialize processors
        processors[PaymentMethod::CREDIT_CARD] = make_unique&lt;CardProcessor&gt;();
        processors[PaymentMethod::DEBIT_CARD] = make_unique&lt;CardProcessor&gt;();
        processors[PaymentMethod::UPI] = make_unique&lt;UPIProcessor&gt;();
    }

    Merchant* registerMerchant(const string&amp; id, const string&amp; name) {
        auto merchant = make_unique&lt;Merchant&gt;(id, name);
        Merchant* ptr = merchant.get();
        merchants[id] = move(merchant);

        cout &lt;&lt; &quot;✓ Merchant registered: &quot; &lt;&lt; name &lt;&lt; endl;
        cout &lt;&lt; &quot;  API Key: &quot; &lt;&lt; ptr-&gt;getApiKey() &lt;&lt; endl;

        return ptr;
    }

    Transaction* processPayment(const string&amp; merchantId, const string&amp; customerId,
                               const Money&amp; amount, unique_ptr&lt;PaymentDetails&gt; details,
                               const string&amp; description) {

        Merchant* merchant = getMerchant(merchantId);
        if (!merchant) {
            cout &lt;&lt; &quot;Invalid merchant!&quot; &lt;&lt; endl;
            return nullptr;
        }

        // Create transaction
        auto transaction = make_unique&lt;Transaction&gt;(merchantId, customerId, amount,
                                                    move(details), description);
        Transaction* txnPtr = transaction.get();

        cout &lt;&lt; &quot;\\n=== Processing Payment ===&quot; &lt;&lt; endl;
        txnPtr-&gt;display();

        // Fraud detection
        double fraudScore = fraudDetector.calculateFraudScore(txnPtr);
        txnPtr-&gt;setFraudScore(fraudScore);

        if (fraudDetector.shouldBlock(fraudScore)) {
            cout &lt;&lt; &quot;❌ Transaction blocked due to high fraud score!&quot; &lt;&lt; endl;
            txnPtr-&gt;setStatus(TransactionStatus::FAILED);
            string txnId = txnPtr-&gt;getId();
            transactions[txnId] = move(transaction);
            return txnPtr;
        }

        if (fraudDetector.requiresVerification(fraudScore)) {
            cout &lt;&lt; &quot;⚠ Transaction requires additional verification&quot; &lt;&lt; endl;
            // In real system, trigger 2FA or manual review
        }

        // Process payment
        PaymentMethod method = txnPtr-&gt;getPaymentDetails()-&gt;getMethod();
        PaymentProcessor* processor = processors[method].get();

        if (processor-&gt;processPayment(txnPtr)) {
            txnPtr-&gt;setStatus(TransactionStatus::SUCCESS);

            // Credit merchant account (minus fees)
            double fee = amount.getAmount() * 0.029 + 0.30; // 2.9% + $0.30
            double netAmount = amount.getAmount() - fee;

            merchant-&gt;creditAmount(netAmount);
            merchant-&gt;addTransaction(txnPtr-&gt;getId());

            cout &lt;&lt; &quot;✓ Payment successful!&quot; &lt;&lt; endl;
            cout &lt;&lt; &quot;  Net amount to merchant: $&quot; &lt;&lt; fixed &lt;&lt; setprecision(2) &lt;&lt; netAmount &lt;&lt; endl;
        } else {
            txnPtr-&gt;setStatus(TransactionStatus::FAILED);
            cout &lt;&lt; &quot;❌ Payment failed!&quot; &lt;&lt; endl;
        }

        string txnId = txnPtr-&gt;getId();
        transactions[txnId] = move(transaction);

        return txnPtr;
    }

    bool refundPayment(const string&amp; transactionId) {
        Transaction* transaction = getTransaction(transactionId);

        if (!transaction) {
            cout &lt;&lt; &quot;Transaction not found!&quot; &lt;&lt; endl;
            return false;
        }

        if (transaction-&gt;getStatus() != TransactionStatus::SUCCESS) {
            cout &lt;&lt; &quot;Cannot refund non-successful transaction!&quot; &lt;&lt; endl;
            return false;
        }

        Merchant* merchant = getMerchant(transaction-&gt;getMerchantId());

        PaymentMethod method = transaction-&gt;getPaymentDetails()-&gt;getMethod();
        PaymentProcessor* processor = processors[method].get();

        if (processor-&gt;refund(transaction)) {
            // Debit merchant account
            double amount = transaction-&gt;getAmount().getAmount();
            merchant-&gt;debitAmount(amount);

            cout &lt;&lt; &quot;✓ Refund processed successfully!&quot; &lt;&lt; endl;
            return true;
        }

        cout &lt;&lt; &quot;❌ Refund failed!&quot; &lt;&lt; endl;
        return false;
    }

    Merchant* getMerchant(const string&amp; merchantId) {
        auto it = merchants.find(merchantId);
        return (it != merchants.end()) ? it-&gt;second.get() : nullptr;
    }

    Transaction* getTransaction(const string&amp; transactionId) {
        auto it = transactions.find(transactionId);
        return (it != transactions.end()) ? it-&gt;second.get() : nullptr;
    }

    void displayTransactionReport() const {
        cout &lt;&lt; &quot;\\n========== TRANSACTION REPORT ==========&quot; &lt;&lt; endl;

        int success = 0, failed = 0, refunded = 0;
        double totalVolume = 0;

        for (const auto&amp; [id, txn] : transactions) {
            switch (txn-&gt;getStatus()) {
                case TransactionStatus::SUCCESS:
                    success++;
                    totalVolume += txn-&gt;getAmount().getAmount();
                    break;
                case TransactionStatus::FAILED:
                    failed++;
                    break;
                case TransactionStatus::REFUNDED:
                    refunded++;
                    break;
                default:
                    break;
            }
        }

        cout &lt;&lt; &quot;Total Transactions: &quot; &lt;&lt; transactions.size() &lt;&lt; endl;
        cout &lt;&lt; &quot;Success: &quot; &lt;&lt; success &lt;&lt; &quot; | Failed: &quot; &lt;&lt; failed
             &lt;&lt; &quot; | Refunded: &quot; &lt;&lt; refunded &lt;&lt; endl;
        cout &lt;&lt; &quot;Total Volume: $&quot; &lt;&lt; fixed &lt;&lt; setprecision(2) &lt;&lt; totalVolume &lt;&lt; endl;
        cout &lt;&lt; &quot;========================================\\n&quot; &lt;&lt; endl;
    }
};

// ============== Enums ==============

enum class NotificationType { EMAIL, SMS, PUSH, IN_APP };
enum class Priority { LOW, MEDIUM, HIGH, URGENT };
enum class NotificationStatus { PENDING, SENT, FAILED, RETRYING };

// ============== User Preferences ==============

class NotificationPreferences {
private:
    set&lt;NotificationType&gt; enabledChannels;
    map&lt;NotificationType, pair&lt;int, int&gt;&gt; quietHours; // start hour, end hour
    bool doNotDisturb;

public:
    NotificationPreferences() : doNotDisturb(false) {
        // Enable all channels by default
        enabledChannels = {NotificationType::EMAIL, NotificationType::SMS,
                          NotificationType::PUSH, NotificationType::IN_APP};
    }

    bool isChannelEnabled(NotificationType type) const {
        return enabledChannels.find(type) != enabledChannels.end();
    }

    void enableChannel(NotificationType type) {
        enabledChannels.insert(type);
    }

    void disableChannel(NotificationType type) {
        enabledChannels.erase(type);
    }

    void setDoNotDisturb(bool status) {
        doNotDisturb = status;
    }

    bool isInQuietHours(NotificationType type) const {
        if (quietHours.find(type) == quietHours.end()) return false;

        time_t now = time(nullptr);
        struct tm* timeinfo = localtime(&amp;now);
        int currentHour = timeinfo-&gt;tm_hour;

        auto [start, end] = quietHours.at(type);
        return currentHour &gt;= start &amp;&amp; currentHour &lt; end;
    }

    void setQuietHours(NotificationType type, int startHour, int endHour) {
        quietHours[type] = {startHour, endHour};
    }

    bool canReceive(NotificationType type, Priority priority) const {
        if (doNotDisturb &amp;&amp; priority != Priority::URGENT) {
            return false;
        }

        if (!isChannelEnabled(type)) {
            return false;
        }

        if (isInQuietHours(type) &amp;&amp; priority != Priority::URGENT) {
            return false;
        }

        return true;
    }
};

// ============== Notification Template ==============

class NotificationTemplate {
private:
    string templateId;
    string name;
    NotificationType type;
    string subject;
    string body;

public:
    NotificationTemplate(const string&amp; id, const string&amp; n, NotificationType t,
                        const string&amp; subj, const string&amp; b)
        : templateId(id), name(n), type(t), subject(subj), body(b) {}

    string getId() const { return templateId; }
    NotificationType getType() const { return type; }

    string render(const map&lt;string, string&gt;&amp; variables) const {
        string result = body;

        for (const auto&amp; [key, value] : variables) {
            string placeholder = &quot;{{&quot; + key + &quot;}}&quot;;
            size_t pos = 0;

            while ((pos = result.find(placeholder, pos)) != string::npos) {
                result.replace(pos, placeholder.length(), value);
                pos += value.length();
            }
        }

        return result;
    }

    string getSubject() const { return subject; }
};

// ============== Notification ==============

class Notification {
private:
    string notificationId;
    string userId;
    NotificationType type;
    Priority priority;
    string subject;
    string message;
    NotificationStatus status;
    time_t timestamp;
    time_t scheduledTime;
    int retryCount;
    static int notificationCounter;

public:
    Notification(const string&amp; uid, NotificationType t, Priority p,
                const string&amp; subj, const string&amp; msg, time_t scheduled = 0)
        : userId(uid), type(t), priority(p), subject(subj), message(msg),
          status(NotificationStatus::PENDING), timestamp(time(nullptr)),
          scheduledTime(scheduled == 0 ? time(nullptr) : scheduled),
          retryCount(0) {
        notificationId = &quot;NOTIF&quot; + to_string(++notificationCounter);
    }

    string getId() const { return notificationId; }
    string getUserId() const { return userId; }
    NotificationType getType() const { return type; }
    Priority getPriority() const { return priority; }
    string getSubject() const { return subject; }
    string getMessage() const { return message; }
    NotificationStatus getStatus() const { return status; }
    time_t getScheduledTime() const { return scheduledTime; }
    int getRetryCount() const { return retryCount; }

    void setStatus(NotificationStatus s) { status = s; }
    void incrementRetry() { retryCount++; }

    bool isReady() const {
        return time(nullptr) &gt;= scheduledTime;
    }

    int getPriorityValue() const {
        switch (priority) {
            case Priority::URGENT: return 4;
            case Priority::HIGH: return 3;
            case Priority::MEDIUM: return 2;
            case Priority::LOW: return 1;
        }
        return 0;
    }

    void display() const {
        cout &lt;&lt; &quot;\\n========== NOTIFICATION ==========&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;ID: &quot; &lt;&lt; notificationId &lt;&lt; endl;

        cout &lt;&lt; &quot;Message: &quot; &lt;&lt; message &lt;&lt; endl;
        cout &lt;&lt; &quot;Status: &quot; &lt;&lt; (int)status &lt;&lt; endl;
        cout &lt;&lt; &quot;==================================\\n&quot; &lt;&lt; endl;
    }
};

// ============== Rate Limiter ==============

class RateLimiter {
private:
    map&lt;pair&lt;string, NotificationType&gt;, queue&lt;time_t&gt;&gt; userTimestamps;
    int maxPerMinute;
    mutex rateMutex;

public:
    RateLimiter(int maxRate = 10) : maxPerMinute(maxRate) {}

    bool canSend(const string&amp; userId, NotificationType type) {
        lock_guard&lt;mutex&gt; lock(rateMutex);

        time_t now = time(nullptr);
        auto key = make_pair(userId, type);
        auto&amp; timestamps = userTimestamps[key];

        // Remove timestamps older than 1 minute
        while (!timestamps.empty() &amp;&amp; now - timestamps.front() &gt; 60) {
            timestamps.pop();
        }

        if (timestamps.size() &gt;= maxPerMinute) {
            return false;
        }

        timestamps.push(now);
        return true;
    }
};

// ============== Notification Queue ==============

struct NotificationComparator {
    bool operator()(Notification* a, Notification* b) const {
        // Higher priority first
        if (a-&gt;getPriorityValue() != b-&gt;getPriorityValue()) {
            return a-&gt;getPriorityValue() &lt; b-&gt;getPriorityValue();
        }
        // Earlier scheduled time first
        return a-&gt;getScheduledTime() &gt; b-&gt;getScheduledTime();
    }
};

// ============== Notification System ==============

class NotificationSystem {
private:
    map&lt;string, unique_ptr&lt;User&gt;&gt; users;
    map&lt;string, unique_ptr&lt;NotificationTemplate&gt;&gt; templates;
    map&lt;NotificationType, unique_ptr&lt;NotificationChannel&gt;&gt; channels;
    priority_queue&lt;Notification*, vector&lt;Notification*&gt;, NotificationComparator&gt; notificationQueue;
    vector&lt;unique_ptr&lt;Notification&gt;&gt; allNotifications;
    RateLimiter rateLimiter;
    mutex queueMutex;
    bool running;

public:
    NotificationSystem() : running(false) {
        // Initialize channels
        channels[NotificationType::EMAIL] = make_unique&lt;EmailChannel&gt;();
        channels[NotificationType::SMS] = make_unique&lt;SMSChannel&gt;();
        channels[NotificationType::PUSH] = make_unique&lt;PushChannel&gt;();
        channels[NotificationType::IN_APP] = make_unique&lt;InAppChannel&gt;();
    }

    User* registerUser(const string&amp; id, const string&amp; name,
                      const string&amp; email, const string&amp; phone) {
        auto user = make_unique&lt;User&gt;(id, name, email, phone);
        User* ptr = user.get();
        users[id] = move(user);

        cout &lt;&lt; &quot;✓ User registered: &quot; &lt;&lt; name &lt;&lt; endl;
        return ptr;
    }

    NotificationTemplate* createTemplate(const string&amp; id, const string&amp; name,
                                        NotificationType type, const string&amp; subject,
                                        const string&amp; body) {
        auto templ = make_unique&lt;NotificationTemplate&gt;(id, name, type, subject, body);
        NotificationTemplate* ptr = templ.get();
        templates[id] = move(templ);

        cout &lt;&lt; &quot;✓ Template created: &quot; &lt;&lt; name &lt;&lt; endl;
        return ptr;
    }

    Notification* sendNotification(const string&amp; userId, NotificationType type,
                                  Priority priority, const string&amp; subject,
                                  const string&amp; message, time_t scheduledTime = 0) {
        User* user = getUser(userId);
        if (!user) {
            cout &lt;&lt; &quot;User not found!&quot; &lt;&lt; endl;
            return nullptr;
        }

        // Check user preferences
        if (!user-&gt;getPreferences().canReceive(type, priority)) {
            cout &lt;&lt; &quot;User has disabled this notification type or in quiet hours&quot; &lt;&lt; endl;
            return nullptr;
        }

        // Create notification
        auto notification = make_unique&lt;Notification&gt;(userId, type, priority,
                                                      subject, message, scheduledTime);
        Notification* ptr = notification.get();

        // Add to queue
        {
            lock_guard&lt;mutex&gt; lock(queueMutex);
            notificationQueue.push(ptr);
            allNotifications.push_back(move(notification));
        }

        cout &lt;&lt; &quot;✓ Notification queued: &quot; &lt;&lt; ptr-&gt;getId() &lt;&lt; endl;
        return ptr;
    }

    Notification* sendFromTemplate(const string&amp; userId, const string&amp; templateId,
                                  const map&lt;string, string&gt;&amp; variables,
                                  Priority priority = Priority::MEDIUM) {

        NotificationTemplate* templ = getTemplate(templateId);
        if (!templ) {
            cout &lt;&lt; &quot;Template not found!&quot; &lt;&lt; endl;
            return nullptr;
        }

        string message = templ-&gt;render(variables);
        return sendNotification(userId, templ-&gt;getType(), priority,
                               templ-&gt;getSubject(), message);
    }

    void processQueue() {
        cout &lt;&lt; &quot;\\n=== Processing Notification Queue ===&quot; &lt;&lt; endl;

        vector&lt;Notification*&gt; retryQueue;

        while (true) {
            Notification* notification = nullptr;

            {
                lock_guard&lt;mutex&gt; lock(queueMutex);
                if (notificationQueue.empty()) break;

                notification = notificationQueue.top();
                notificationQueue.pop();
            }

            if (!notification-&gt;isReady()) {
                retryQueue.push_back(notification);
                continue;
            }

            User* user = getUser(notification-&gt;getUserId());
            if (!user) continue;

            NotificationType type = notification-&gt;getType();

            // Check rate limit
            if (!rateLimiter.canSend(user-&gt;getUserId(), type)) {
                cout &lt;&lt; &quot;⚠ Rate limit exceeded for user &quot; &lt;&lt; user-&gt;getUserId() &lt;&lt; endl;
                retryQueue.push_back(notification);
                continue;
            }

            // Send notification
            NotificationChannel* channel = channels[type].get();

            cout &lt;&lt; &quot;\\n--- Sending Notification ---&quot; &lt;&lt; endl;
            notification-&gt;display();

            if (channel-&gt;send(user, notification)) {
                notification-&gt;setStatus(NotificationStatus::SENT);
                cout &lt;&lt; &quot;✓ Sent successfully via &quot; &lt;&lt; channel-&gt;getChannelName() &lt;&lt; endl;
            } else {
                notification-&gt;incrementRetry();

                if (notification-&gt;getRetryCount() &lt; 3) {
                    notification-&gt;setStatus(NotificationStatus::RETRYING);
                    retryQueue.push_back(notification);
                    cout &lt;&lt; &quot;⚠ Failed, will retry (attempt &quot; &lt;&lt; notification-&gt;getRetryCount() &lt;&lt; &quot;)&quot; &lt;&lt; endl;
                } else {
                    notification-&gt;setStatus(NotificationStatus::FAILED);
                    cout &lt;&lt; &quot;❌ Failed after 3 attempts&quot; &lt;&lt; endl;
                }
            }
        }

        // Re-add retry notifications
        {
            lock_guard&lt;mutex&gt; lock(queueMutex);
            for (Notification* notif : retryQueue) {
                notificationQueue.push(notif);
            }
        }
    }

    User* getUser(const string&amp; userId) {
        auto it = users.find(userId);
        return (it != users.end()) ? it-&gt;second.get() : nullptr;
    }

    NotificationTemplate* getTemplate(const string&amp; templateId) {
        auto it = templates.find(templateId);
        return (it != templates.end()) ? it-&gt;second.get() : nullptr;
    }

    void displayStatistics() const {
        cout &lt;&lt; &quot;\\n========== NOTIFICATION STATISTICS ==========&quot; &lt;&lt; endl;

        int sent = 0, failed = 0, pending = 0;

        for (const auto&amp; notif : allNotifications) {
            switch (notif-&gt;getStatus()) {
                case NotificationStatus::SENT:
                    sent++;
                    break;
                case NotificationStatus::FAILED:
                    failed++;
                    break;
                case NotificationStatus::PENDING:
                case NotificationStatus::RETRYING:
                    pending++;
                    break;
            }
        }

        cout &lt;&lt; &quot;Total: &quot; &lt;&lt; allNotifications.size() &lt;&lt; endl;
        cout &lt;&lt; &quot;Sent: &quot; &lt;&lt; sent &lt;&lt; &quot; | Failed: &quot; &lt;&lt; failed &lt;&lt; &quot; | Pending: &quot; &lt;&lt; pending &lt;&lt; endl;
        cout &lt;&lt; &quot;Success Rate: &quot; &lt;&lt; (allNotifications.empty() ? 0 : (sent * 100.0 / allNotifications.size()))
             &lt;&lt; &quot;%&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;============================================\\n&quot; &lt;&lt; endl;
    }
};

<h3 id="1-channel-abstraction">1. <strong>Channel Abstraction</strong></h3>
<ul>
<li>Base <code>NotificationChannel</code> interface</li>
<li>Independent channel implementations</li>
<li>Easy to add new channels</li>
</ul>
<h3 id="2-priority-queue">2. <strong>Priority Queue</strong></h3>
<ul>
<li>Priority-based processing</li>
<li>Scheduled notifications</li>
<li>URGENT messages bypass restrictions</li>
</ul>
<h3 id="3-rate-limiting">3. <strong>Rate Limiting</strong></h3>
<ul>
<li>Per-user, per-channel limits</li>
<li>Sliding window algorithm</li>
<li>Prevents spam</li>
</ul>

<p><strong>Q1: How to implement exponential backoff?</strong></p>
<pre><code class="language-cpp">int getBackoffDelay(int retryCount) {
    return min(60, (int)pow(2, retryCount)); // Max 60 seconds
}

// ============== Time Slot ==============

class TimeSlot {
private:
    time_t startTime;
    time_t endTime;

public:
    TimeSlot(time_t start, time_t end) : startTime(start), endTime(end) {}

    time_t getStartTime() const { return startTime; }
    time_t getEndTime() const { return endTime; }

    bool overlaps(const TimeSlot&amp; other) const {
        return !(endTime &lt;= other.startTime || startTime &gt;= other.endTime);
    }

    bool contains(time_t t) const {
        return t &gt;= startTime &amp;&amp; t &lt; endTime;
    }

    int getDurationMinutes() const {
        return (endTime - startTime) / 60;
    }

    string toString() const {
        char startStr[20], endStr[20];
        struct tm* startInfo = localtime(&amp;startTime);
        struct tm* endInfo = localtime(&amp;endTime);

        strftime(startStr, sizeof(startStr), &quot;%Y-%m-%d %H:%M&quot;, startInfo);
        strftime(endStr, sizeof(endStr), &quot;%H:%M&quot;, endInfo);

        return string(startStr) + &quot; - &quot; + endStr;
    }

    bool operator&lt;(const TimeSlot&amp; other) const {
        return startTime &lt; other.startTime;
    }
};

// ============== Room ==============

class Room {
private:
    string roomId;
    string name;
    int capacity;
    string location;
    vector&lt;string&gt; facilities;
    map&lt;time_t, TimeSlot&gt; bookings; // startTime -&gt; TimeSlot

public:
    Room(const string&amp; id, const string&amp; n, int cap, const string&amp; loc)
        : roomId(id), name(n), capacity(cap), location(loc) {}

    string getId() const { return roomId; }
    string getName() const { return name; }
    int getCapacity() const { return capacity; }
    string getLocation() const { return location; }

    void addFacility(const string&amp; facility) {
        facilities.push_back(facility);
    }

    bool isAvailable(const TimeSlot&amp; slot) const {
        for (const auto&amp; [start, booking] : bookings) {
            if (booking.overlaps(slot)) {
                return false;
            }
        }
        return true;
    }

    bool book(const TimeSlot&amp; slot) {
        if (!isAvailable(slot)) {
            return false;
        }

        bookings[slot.getStartTime()] = slot;
        return true;
    }

    void cancelBooking(time_t startTime) {
        bookings.erase(startTime);
    }

    void displayInfo() const {
        cout &lt;&lt; name &lt;&lt; &quot; (Capacity: &quot; &lt;&lt; capacity &lt;&lt; &quot;)&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;Location: &quot; &lt;&lt; location &lt;&lt; endl;
        if (!facilities.empty()) {
            cout &lt;&lt; &quot;Facilities: &quot;;
            for (size_t i = 0; i &lt; facilities.size(); i++) {
                cout &lt;&lt; facilities[i];
                if (i &lt; facilities.size() - 1) cout &lt;&lt; &quot;, &quot;;
            }
            cout &lt;&lt; endl;
        }
    }
};

class User {
private:
    string userId;
    string name;
    string email;
    string timezone; // Simplified as string
    map&lt;time_t, string&gt; calendar; // startTime -&gt; meetingId

public:
    User(const string&amp; id, const string&amp; n, const string&amp; e, const string&amp; tz = &quot;UTC&quot;)
        : userId(id), name(n), email(e), timezone(tz) {}

    string getUserId() const { return userId; }
    string getName() const { return name; }
    string getEmail() const { return email; }
    string getTimezone() const { return timezone; }

    bool isAvailable(const TimeSlot&amp; slot) const {
        for (const auto&amp; [start, meetingId] : calendar) {
            // Simplified: check if start time falls in slot
            // In real system, need to check full meeting duration
            if (slot.contains(start)) {
                return false;
            }
        }
        return true;
    }

    void addToCalendar(const string&amp; meetingId, time_t startTime) {
        calendar[startTime] = meetingId;
    }

    void removeFromCalendar(time_t startTime) {
        calendar.erase(startTime);
    }

    vector&lt;TimeSlot&gt; getAvailableSlots(time_t dayStart, time_t dayEnd,
                                       int durationMinutes) const {
        vector&lt;TimeSlot&gt; available;

        // Generate all possible slots for the day (every 30 minutes)
        time_t current = dayStart;
        while (current + durationMinutes * 60 &lt;= dayEnd) {
            TimeSlot slot(current, current + durationMinutes * 60);

            if (isAvailable(slot)) {
                available.push_back(slot);
            }

            current += 30 * 60; // Move by 30 minutes
        }

        return available;
    }
};

// ============== Meeting ==============

enum class MeetingStatus { SCHEDULED, CANCELLED, COMPLETED };
enum class RecurrenceType { NONE, DAILY, WEEKLY, MONTHLY };

class Meeting {
private:
    string meetingId;
    string title;
    string description;
    User* organizer;
    vector&lt;User*&gt; attendees;
    TimeSlot timeSlot;
    Room* room;
    MeetingStatus status;
    RecurrenceType recurrence;
    time_t recurrenceEndDate;
    static int meetingCounter;

public:
    Meeting(const string&amp; t, const string&amp; desc, User* org, const TimeSlot&amp; slot,
           RecurrenceType rec = RecurrenceType::NONE)
        : title(t), description(desc), organizer(org), timeSlot(slot),
          room(nullptr), status(MeetingStatus::SCHEDULED), recurrence(rec),
          recurrenceEndDate(0) {

        meetingId = &quot;MTG&quot; + to_string(++meetingCounter);
    }

    string getId() const { return meetingId; }
    string getTitle() const { return title; }
    User* getOrganizer() const { return organizer; }
    const vector&lt;User*&gt;&amp; getAttendees() const { return attendees; }
    TimeSlot getTimeSlot() const { return timeSlot; }
    Room* getRoom() const { return room; }
    MeetingStatus getStatus() const { return status; }

    void addAttendee(User* user) {
        attendees.push_back(user);
    }

    void removeAttendee(User* user) {
        attendees.erase(remove(attendees.begin(), attendees.end(), user), attendees.end());
    }

    void setRoom(Room* r) {
        room = r;
    }

    void cancel() {
        status = MeetingStatus::CANCELLED;

        // Free up room
        if (room) {
            room-&gt;cancelBooking(timeSlot.getStartTime());
        }

        // Remove from attendees' calendars
        for (User* attendee : attendees) {
            attendee-&gt;removeFromCalendar(timeSlot.getStartTime());
        }

        organizer-&gt;removeFromCalendar(timeSlot.getStartTime());
    }

    void updateTime(const TimeSlot&amp; newSlot) {
        // Remove old booking
        if (room) {
            room-&gt;cancelBooking(timeSlot.getStartTime());
        }

        // Update time
        time_t oldStart = timeSlot.getStartTime();
        timeSlot = newSlot;

        // Update in attendees' calendars
        for (User* attendee : attendees) {
            attendee-&gt;removeFromCalendar(oldStart);
            attendee-&gt;addToCalendar(meetingId, newSlot.getStartTime());
        }

        organizer-&gt;removeFromCalendar(oldStart);
        organizer-&gt;addToCalendar(meetingId, newSlot.getStartTime());

        // Rebook room
        if (room) {
            room-&gt;book(newSlot);
        }
    }

    void display() const {
        cout &lt;&lt; &quot;\\n========== MEETING ==========&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;ID: &quot; &lt;&lt; meetingId &lt;&lt; endl;
        cout &lt;&lt; &quot;Title: &quot; &lt;&lt; title &lt;&lt; endl;
        cout &lt;&lt; &quot;Organizer: &quot; &lt;&lt; organizer-&gt;getName() &lt;&lt; endl;
        cout &lt;&lt; &quot;Time: &quot; &lt;&lt; timeSlot.toString() &lt;&lt; endl;
        cout &lt;&lt; &quot;Duration: &quot; &lt;&lt; timeSlot.getDurationMinutes() &lt;&lt; &quot; minutes&quot; &lt;&lt; endl;

        if (room) {
            cout &lt;&lt; &quot;Room: &quot; &lt;&lt; room-&gt;getName() &lt;&lt; endl;
        }

        cout &lt;&lt; &quot;Attendees (&quot; &lt;&lt; attendees.size() &lt;&lt; &quot;):&quot; &lt;&lt; endl;
        for (User* attendee : attendees) {
            cout &lt;&lt; &quot;  - &quot; &lt;&lt; attendee-&gt;getName() &lt;&lt; &quot; &lt;&quot; &lt;&lt; attendee-&gt;getEmail() &lt;&lt; &quot;&gt;&quot; &lt;&lt; endl;
        }

        cout &lt;&lt; &quot;Status: &quot; &lt;&lt; (int)status &lt;&lt; endl;
        cout &lt;&lt; &quot;============================\\n&quot; &lt;&lt; endl;
    }
};

int Meeting::meetingCounter = 0;

// ============== Meeting Scheduler ==============

class MeetingScheduler {
private:
    map&lt;string, unique_ptr&lt;User&gt;&gt; users;
    map&lt;string, unique_ptr&lt;Meeting&gt;&gt; meetings;
    map&lt;string, unique_ptr&lt;Room&gt;&gt; rooms;

    bool checkConflicts(User* user, const TimeSlot&amp; slot) {
        return user-&gt;isAvailable(slot);
    }

public:
    User* registerUser(const string&amp; id, const string&amp; name,
                      const string&amp; email, const string&amp; timezone = &quot;UTC&quot;) {
        auto user = make_unique&lt;User&gt;(id, name, email, timezone);
        User* ptr = user.get();
        users[id] = move(user);

        cout &lt;&lt; &quot;✓ User registered: &quot; &lt;&lt; name &lt;&lt; endl;
        return ptr;
    }

    Room* addRoom(const string&amp; id, const string&amp; name, int capacity,
                 const string&amp; location) {
        auto room = make_unique&lt;Room&gt;(id, name, capacity, location);
        Room* ptr = room.get();
        rooms[id] = move(room);

        cout &lt;&lt; &quot;✓ Room added: &quot; &lt;&lt; name &lt;&lt; endl;
        return ptr;
    }

    Meeting* scheduleMeeting(User* organizer, const string&amp; title,
                            const string&amp; description, const TimeSlot&amp; slot,
                            const vector&lt;User*&gt;&amp; attendees,
                            const string&amp; roomId = &quot;&quot;) {

        // Check organizer availability
        if (!checkConflicts(organizer, slot)) {
            cout &lt;&lt; &quot;Organizer has a conflict at this time!&quot; &lt;&lt; endl;
            return nullptr;
        }

        // Check all attendees availability
        for (User* attendee : attendees) {
            if (!checkConflicts(attendee, slot)) {
                cout &lt;&lt; &quot;Attendee &quot; &lt;&lt; attendee-&gt;getName() &lt;&lt; &quot; has a conflict!&quot; &lt;&lt; endl;
                return nullptr;
            }
        }

        // Book room if requested
        Room* room = nullptr;
        if (!roomId.empty()) {
            room = getRoom(roomId);
            if (!room) {
                cout &lt;&lt; &quot;Room not found!&quot; &lt;&lt; endl;
                return nullptr;
            }

            if (!room-&gt;isAvailable(slot)) {
                cout &lt;&lt; &quot;Room is not available at this time!&quot; &lt;&lt; endl;
                return nullptr;
            }

            if (room-&gt;getCapacity() &lt; attendees.size() + 1) {
                cout &lt;&lt; &quot;Room capacity insufficient!&quot; &lt;&lt; endl;
                return nullptr;
            }

            room-&gt;book(slot);
        }

        // Create meeting
        auto meeting = make_unique&lt;Meeting&gt;(title, description, organizer, slot);
        Meeting* meetingPtr = meeting.get();

        if (room) {
            meetingPtr-&gt;setRoom(room);
        }

        // Add attendees
        for (User* attendee : attendees) {
            meetingPtr-&gt;addAttendee(attendee);
            attendee-&gt;addToCalendar(meetingPtr-&gt;getId(), slot.getStartTime());
        }

        // Add to organizer's calendar
        organizer-&gt;addToCalendar(meetingPtr-&gt;getId(), slot.getStartTime());

        string meetingId = meetingPtr-&gt;getId();
        meetings[meetingId] = move(meeting);

        cout &lt;&lt; &quot;✓ Meeting scheduled: &quot; &lt;&lt; title &lt;&lt; &quot; (&quot; &lt;&lt; meetingId &lt;&lt; &quot;)&quot; &lt;&lt; endl;
        sendInvites(meetingPtr);

        return meetingPtr;
    }

    vector&lt;TimeSlot&gt; findCommonAvailableSlots(const vector&lt;User*&gt;&amp; users,
                                              time_t dayStart, time_t dayEnd,
                                              int durationMinutes) {

        if (users.empty()) return {};

        // Get available slots for first user
        vector&lt;TimeSlot&gt; common = users[0]-&gt;getAvailableSlots(dayStart, dayEnd, durationMinutes);

        // Intersect with other users' available slots
        for (size_t i = 1; i &lt; users.size(); i++) {
            vector&lt;TimeSlot&gt; userSlots = users[i]-&gt;getAvailableSlots(dayStart, dayEnd, durationMinutes);

            vector&lt;TimeSlot&gt; intersection;
            set_intersection(common.begin(), common.end(),
                           userSlots.begin(), userSlots.end(),
                           back_inserter(intersection));

            common = intersection;
        }

        return common;
    }

    vector&lt;Room*&gt; findAvailableRooms(const TimeSlot&amp; slot, int minCapacity) {
        vector&lt;Room*&gt; available;

        for (const auto&amp; [id, room] : rooms) {
            if (room-&gt;getCapacity() &gt;= minCapacity &amp;&amp; room-&gt;isAvailable(slot)) {
                available.push_back(room.get());
            }
        }

        return available;
    }

    bool cancelMeeting(const string&amp; meetingId) {
        Meeting* meeting = getMeeting(meetingId);

        if (!meeting) {
            cout &lt;&lt; &quot;Meeting not found!&quot; &lt;&lt; endl;
            return false;
        }

        meeting-&gt;cancel();
        cout &lt;&lt; &quot;✓ Meeting cancelled: &quot; &lt;&lt; meetingId &lt;&lt; endl;

        return true;
    }

    bool rescheduleMeeting(const string&amp; meetingId, const TimeSlot&amp; newSlot) {
        Meeting* meeting = getMeeting(meetingId);

        if (!meeting) {
            cout &lt;&lt; &quot;Meeting not found!&quot; &lt;&lt; endl;
            return false;
        }

        // Check availability of all attendees
        User* organizer = meeting-&gt;getOrganizer();
        if (!organizer-&gt;isAvailable(newSlot)) {
            cout &lt;&lt; &quot;Organizer not available at new time!&quot; &lt;&lt; endl;
            return false;
        }

        for (User* attendee : meeting-&gt;getAttendees()) {
            if (!attendee-&gt;isAvailable(newSlot)) {
                cout &lt;&lt; &quot;Attendee &quot; &lt;&lt; attendee-&gt;getName() &lt;&lt; &quot; not available!&quot; &lt;&lt; endl;
                return false;
            }
        }

        // Check room availability
        if (meeting-&gt;getRoom() &amp;&amp; !meeting-&gt;getRoom()-&gt;isAvailable(newSlot)) {
            cout &lt;&lt; &quot;Room not available at new time!&quot; &lt;&lt; endl;
            return false;
        }

        meeting-&gt;updateTime(newSlot);
        cout &lt;&lt; &quot;✓ Meeting rescheduled to &quot; &lt;&lt; newSlot.toString() &lt;&lt; endl;

        return true;
    }

    void sendInvites(Meeting* meeting) {
        cout &lt;&lt; &quot;\\n=== Sending Meeting Invites ===&quot; &lt;&lt; endl;

        for (User* attendee : meeting-&gt;getAttendees()) {
            cout &lt;&lt; &quot;📧 Invite sent to &quot; &lt;&lt; attendee-&gt;getName()
                 &lt;&lt; &quot; &lt;&quot; &lt;&lt; attendee-&gt;getEmail() &lt;&lt; &quot;&gt;&quot; &lt;&lt; endl;
        }

        cout &lt;&lt; endl;
    }

    User* getUser(const string&amp; userId) {
        auto it = users.find(userId);
        return (it != users.end()) ? it-&gt;second.get() : nullptr;
    }

    Meeting* getMeeting(const string&amp; meetingId) {
        auto it = meetings.find(meetingId);
        return (it != meetings.end()) ? it-&gt;second.get() : nullptr;
    }

    Room* getRoom(const string&amp; roomId) {
        auto it = rooms.find(roomId);
        return (it != rooms.end()) ? it-&gt;second.get() : nullptr;
    }

    void displayAllRooms() const {
        cout &lt;&lt; &quot;\\n========== AVAILABLE ROOMS ==========&quot; &lt;&lt; endl;
        for (const auto&amp; [id, room] : rooms) {
            cout &lt;&lt; &quot;[&quot; &lt;&lt; id &lt;&lt; &quot;] &quot;;
            room-&gt;displayInfo();
            cout &lt;&lt; &quot;---&quot; &lt;&lt; endl;
        }
        cout &lt;&lt; &quot;=====================================\\n&quot; &lt;&lt; endl;
    }
};

time_t createTime(int year, int month, int day, int hour, int minute) {
    struct tm timeinfo = {};
    timeinfo.tm_year = year - 1900;
    timeinfo.tm_mon = month - 1;
    timeinfo.tm_mday = day;
    timeinfo.tm_hour = hour;
    timeinfo.tm_min = minute;
    return mktime(&amp;timeinfo);
}

class RateLimitRule {

    }

// ============== Token Bucket Algorithm ==============

class TokenBucket {
private:
    int capacity;
    int tokensPerSecond;
    double tokens;
    time_t lastRefill;
    mutex bucketMutex;

public:
    TokenBucket(int cap, int rate)
        : capacity(cap), tokensPerSecond(rate), tokens(cap), lastRefill(time(nullptr)) {}

    bool allowRequest(int tokensNeeded = 1) {
        lock_guard&lt;mutex&gt; lock(bucketMutex);

        refill();

        if (tokens &gt;= tokensNeeded) {
            tokens -= tokensNeeded;
            return true;
        }

        return false;
    }

    void refill() {
        time_t now = time(nullptr);
        double elapsed = difftime(now, lastRefill);

        if (elapsed &gt; 0) {
            tokens = min((double)capacity, tokens + elapsed * tokensPerSecond);
            lastRefill = now;
        }
    }

    int getAvailableTokens() {
        lock_guard&lt;mutex&gt; lock(bucketMutex);
        refill();
        return (int)tokens;
    }
};

// ============== Sliding Window Counter ==============

class SlidingWindowCounter {
private:
    int limit;
    int windowSeconds;
    queue&lt;time_t&gt; timestamps;
    mutex windowMutex;

public:
    SlidingWindowCounter(int lim, int window)
        : limit(lim), windowSeconds(window) {}

    bool allowRequest() {
        lock_guard&lt;mutex&gt; lock(windowMutex);

        time_t now = time(nullptr);

        // Remove timestamps outside window
        while (!timestamps.empty() &amp;&amp; now - timestamps.front() &gt;= windowSeconds) {
            timestamps.pop();
        }

        if (timestamps.size() &lt; limit) {
            timestamps.push(now);
            return true;
        }

        return false;
    }

    int getCurrentCount() {
        lock_guard&lt;mutex&gt; lock(windowMutex);

        time_t now = time(nullptr);

        // Remove timestamps outside window
        while (!timestamps.empty() &amp;&amp; now - timestamps.front() &gt;= windowSeconds) {
            timestamps.pop();
        }

        return timestamps.size();
    }

    int getRemainingQuota() {
        return limit - getCurrentCount();
    }
};

// ============== Fixed Window Counter ==============

class FixedWindowCounter {
private:
    int limit;
    int windowSeconds;
    time_t windowStart;
    int count;
    mutex windowMutex;

public:
    FixedWindowCounter(int lim, int window)
        : limit(lim), windowSeconds(window), windowStart(time(nullptr)), count(0) {}

    bool allowRequest() {
        lock_guard&lt;mutex&gt; lock(windowMutex);

        time_t now = time(nullptr);

        // Check if window has expired
        if (now - windowStart &gt;= windowSeconds) {
            windowStart = now;
            count = 0;
        }

        if (count &lt; limit) {
            count++;
            return true;
        }

        return false;
    }

    int getCurrentCount() {
        lock_guard&lt;mutex&gt; lock(windowMutex);

        time_t now = time(nullptr);

        if (now - windowStart &gt;= windowSeconds) {
            return 0;
        }

        return count;
    }
};

// ============== Leaky Bucket Algorithm ==============

class LeakyBucket {
private:
    int capacity;
    double leakRate; // requests per second
    queue&lt;time_t&gt; bucket;
    time_t lastLeak;
    mutex bucketMutex;

public:
    LeakyBucket(int cap, double rate)
        : capacity(cap), leakRate(rate), lastLeak(time(nullptr)) {}

    bool allowRequest() {
        lock_guard&lt;mutex&gt; lock(bucketMutex);

        leak();

        if (bucket.size() &lt; capacity) {
            bucket.push(time(nullptr));
            return true;
        }

        return false;
    }

    void leak() {
        time_t now = time(nullptr);
        double elapsed = difftime(now, lastLeak);

        int toLeak = (int)(elapsed * leakRate);

        for (int i = 0; i &lt; toLeak &amp;&amp; !bucket.empty(); i++) {
            bucket.pop();
        }

        if (toLeak &gt; 0) {
            lastLeak = now;
        }
    }

    int getQueueSize() {
        lock_guard&lt;mutex&gt; lock(bucketMutex);
        leak();
        return bucket.size();
    }
};

// ============== Rate Limiter Storage ==============

class RateLimiterStorage {
private:
    map&lt;string, unique_ptr&lt;TokenBucket&gt;&gt; tokenBuckets;
    map&lt;string, unique_ptr&lt;SlidingWindowCounter&gt;&gt; slidingWindows;
    map&lt;string, unique_ptr&lt;FixedWindowCounter&gt;&gt; fixedWindows;
    map&lt;string, unique_ptr&lt;LeakyBucket&gt;&gt; leakyBuckets;
    mutex storageMutex;

public:
    TokenBucket* getOrCreateTokenBucket(const string&amp; key, int capacity, int rate) {
        lock_guard&lt;mutex&gt; lock(storageMutex);

        if (tokenBuckets.find(key) == tokenBuckets.end()) {
            tokenBuckets[key] = make_unique&lt;TokenBucket&gt;(capacity, rate);
        }

        return tokenBuckets[key].get();
    }

    SlidingWindowCounter* getOrCreateSlidingWindow(const string&amp; key, int limit, int window) {
        lock_guard&lt;mutex&gt; lock(storageMutex);

        if (slidingWindows.find(key) == slidingWindows.end()) {
            slidingWindows[key] = make_unique&lt;SlidingWindowCounter&gt;(limit, window);
        }

        return slidingWindows[key].get();
    }

    FixedWindowCounter* getOrCreateFixedWindow(const string&amp; key, int limit, int window) {
        lock_guard&lt;mutex&gt; lock(storageMutex);

        if (fixedWindows.find(key) == fixedWindows.end()) {
            fixedWindows[key] = make_unique&lt;FixedWindowCounter&gt;(limit, window);
        }

        return fixedWindows[key].get();
    }

    LeakyBucket* getOrCreateLeakyBucket(const string&amp; key, int capacity, double rate) {
        lock_guard&lt;mutex&gt; lock(storageMutex);

        if (leakyBuckets.find(key) == leakyBuckets.end()) {
            leakyBuckets[key] = make_unique&lt;LeakyBucket&gt;(capacity, rate);
        }

        return leakyBuckets[key].get();
    }
};

// ============== Rate Limiter ==============

class RateLimiter {
private:
    map&lt;string, unique_ptr&lt;RateLimitRule&gt;&gt; rules;
    RateLimiterStorage storage;
    map&lt;string, int&gt; requestCounts; // For statistics
    mutex limiterMutex;

    string getStorageKey(const string&amp; clientId, const string&amp; ruleId) {
        return clientId + &quot;:&quot; + ruleId;
    }

public:
    RateLimitRule* addRule(const string&amp; id, const string&amp; name, int limit,
                          int windowSeconds, RateLimitAlgorithm algorithm) {
        auto rule = make_unique&lt;RateLimitRule&gt;(id, name, limit, windowSeconds, algorithm);
        RateLimitRule* ptr = rule.get();
        rules[id] = move(rule);

        cout &lt;&lt; &quot;✓ Rate limit rule added: &quot; &lt;&lt; name &lt;&lt; endl;
        return ptr;
    }

    bool allowRequest(const Request&amp; request) {
        string clientId = request.getClientId();
        string resource = request.getResource();

        // Find applicable rules
        for (const auto&amp; [ruleId, rule] : rules) {
            if (!rule-&gt;appliesToClient(clientId)) {
                continue;
            }

            string key = getStorageKey(clientId, ruleId);
            bool allowed = false;

            switch (rule-&gt;getAlgorithm()) {
                case RateLimitAlgorithm::TOKEN_BUCKET: {
                    int rate = rule-&gt;getLimit() / rule-&gt;getWindowSeconds();
                    TokenBucket* bucket = storage.getOrCreateTokenBucket(
                        key, rule-&gt;getLimit(), max(1, rate));
                    allowed = bucket-&gt;allowRequest();
                    break;
                }

                case RateLimitAlgorithm::SLIDING_WINDOW: {
                    SlidingWindowCounter* window = storage.getOrCreateSlidingWindow(
                        key, rule-&gt;getLimit(), rule-&gt;getWindowSeconds());
                    allowed = window-&gt;allowRequest();
                    break;
                }

                case RateLimitAlgorithm::FIXED_WINDOW: {
                    FixedWindowCounter* window = storage.getOrCreateFixedWindow(
                        key, rule-&gt;getLimit(), rule-&gt;getWindowSeconds());
                    allowed = window-&gt;allowRequest();
                    break;
                }

                case RateLimitAlgorithm::LEAKY_BUCKET: {
                    double rate = (double)rule-&gt;getLimit() / rule-&gt;getWindowSeconds();
                    LeakyBucket* bucket = storage.getOrCreateLeakyBucket(
                        key, rule-&gt;getLimit(), rate);
                    allowed = bucket-&gt;allowRequest();
                    break;
                }
            }

            if (!allowed) {
                cout &lt;&lt; &quot;❌ Request blocked by rule: &quot; &lt;&lt; rule-&gt;getName() &lt;&lt; endl;
                return false;
            }
        }

        // Request allowed
        {
            lock_guard&lt;mutex&gt; lock(limiterMutex);
            requestCounts[clientId]++;
        }

        return true;
    }

    map&lt;string, int&gt; getUsageStats(const string&amp; clientId) {
        map&lt;string, int&gt; stats;

        for (const auto&amp; [ruleId, rule] : rules) {
            if (!rule-&gt;appliesToClient(clientId)) {
                continue;
            }

            string key = getStorageKey(clientId, ruleId);

            switch (rule-&gt;getAlgorithm()) {
                case RateLimitAlgorithm::TOKEN_BUCKET: {
                    int rate = rule-&gt;getLimit() / rule-&gt;getWindowSeconds();
                    TokenBucket* bucket = storage.getOrCreateTokenBucket(
                        key, rule-&gt;getLimit(), max(1, rate));
                    stats[rule-&gt;getName()] = bucket-&gt;getAvailableTokens();
                    break;
                }

                case RateLimitAlgorithm::SLIDING_WINDOW: {
                    SlidingWindowCounter* window = storage.getOrCreateSlidingWindow(
                        key, rule-&gt;getLimit(), rule-&gt;getWindowSeconds());
                    stats[rule-&gt;getName()] = window-&gt;getRemainingQuota();
                    break;
                }

                case RateLimitAlgorithm::FIXED_WINDOW: {
                    FixedWindowCounter* window = storage.getOrCreateFixedWindow(
                        key, rule-&gt;getLimit(), rule-&gt;getWindowSeconds());
                    stats[rule-&gt;getName()] = rule-&gt;getLimit() - window-&gt;getCurrentCount();
                    break;
                }

                case RateLimitAlgorithm::LEAKY_BUCKET: {
                    double rate = (double)rule-&gt;getLimit() / rule-&gt;getWindowSeconds();
                    LeakyBucket* bucket = storage.getOrCreateLeakyBucket(
                        key, rule-&gt;getLimit(), rate);
                    stats[rule-&gt;getName()] = rule-&gt;getLimit() - bucket-&gt;getQueueSize();
                    break;
                }
            }
        }

        return stats;
    }

    void displayRules() const {
        cout &lt;&lt; &quot;\\n========== RATE LIMIT RULES ==========&quot; &lt;&lt; endl;
        for (const auto&amp; [id, rule] : rules) {
            rule-&gt;display();
            cout &lt;&lt; &quot;---&quot; &lt;&lt; endl;
        }
        cout &lt;&lt; &quot;======================================\\n&quot; &lt;&lt; endl;
    }

    void displayStats() const {
        cout &lt;&lt; &quot;\\n========== STATISTICS ==========&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;Total request counts by client:&quot; &lt;&lt; endl;

        for (const auto&amp; [clientId, count] : requestCounts) {
            cout &lt;&lt; &quot;  &quot; &lt;&lt; clientId &lt;&lt; &quot;: &quot; &lt;&lt; count &lt;&lt; &quot; requests&quot; &lt;&lt; endl;
        }

        cout &lt;&lt; &quot;================================\\n&quot; &lt;&lt; endl;
    }
};
