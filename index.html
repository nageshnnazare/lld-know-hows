<h2 id="complete-c-implementation">Complete C++ Implementation</h2>
<pre><code class="language-cpp">#include &lt;iostream&gt;
#include &lt;vector&gt;
#include &lt;string&gt;
#include &lt;memory&gt;
#include &lt;limits&gt;

using namespace std;

// ============== Enums ==============

enum class GameStatus {
    IN_PROGRESS,
    PLAYER_X_WINS,
    PLAYER_O_WINS,
    DRAW
};

enum class CellState {
    EMPTY,
    X,
    O
};

// ============== Cell ==============

class Cell {
private:
    CellState state;

public:
    Cell() : state(CellState::EMPTY) {}

    bool isEmpty() const { return state == CellState::EMPTY; }

    void setState(CellState s) { state = s; }
    CellState getState() const { return state; }

    char getSymbol() const {
        switch(state) {
            case CellState::X: return 'X';
            case CellState::O: return 'O';
            default: return ' ';
        }
    }
};

// ============== Board ==============

class Board {
private:
    vector&lt;vector&lt;Cell&gt;&gt; cells;
    int size;
    int movesCount;

public:
    Board(int s = 3) : size(s), movesCount(0) {
        cells.resize(size, vector&lt;Cell&gt;(size));
    }

    int getSize() const { return size; }

    bool isCellEmpty(int row, int col) const {
        if (row &lt; 0 || row &gt;= size || col &lt; 0 || col &gt;= size) {
            return false;
        }
        return cells[row][col].isEmpty();
    }

    bool makeMove(int row, int col, CellState player) {
        if (!isCellEmpty(row, col)) {
            return false;
        }

        cells[row][col].setState(player);
        movesCount++;
        return true;
    }

    bool isFull() const {
        return movesCount == size * size;
    }

    // Check if there's a winner
    CellState checkWinner() const {
        // Check rows
        for (int i = 0; i &lt; size; i++) {
            if (!cells[i][0].isEmpty()) {
                bool rowWin = true;
                CellState firstCell = cells[i][0].getState();

                for (int j = 1; j &lt; size; j++) {
                    if (cells[i][j].getState() != firstCell) {
                        rowWin = false;
                        break;
                    }
                }

                if (rowWin) return firstCell;
            }
        }

        // Check columns
        for (int j = 0; j &lt; size; j++) {
            if (!cells[0][j].isEmpty()) {
                bool colWin = true;
                CellState firstCell = cells[0][j].getState();

                for (int i = 1; i &lt; size; i++) {
                    if (cells[i][j].getState() != firstCell) {
                        colWin = false;
                        break;
                    }
                }

                if (colWin) return firstCell;
            }
        }

        // Check main diagonal (top-left to bottom-right)
        if (!cells[0][0].isEmpty()) {
            bool diagWin = true;
            CellState firstCell = cells[0][0].getState();

            for (int i = 1; i &lt; size; i++) {
                if (cells[i][i].getState() != firstCell) {
                    diagWin = false;
                    break;
                }
            }

            if (diagWin) return firstCell;
        }

        // Check anti-diagonal (top-right to bottom-left)
        if (!cells[0][size-1].isEmpty()) {
            bool antiDiagWin = true;
            CellState firstCell = cells[0][size-1].getState();

            for (int i = 1; i &lt; size; i++) {
                if (cells[i][size-1-i].getState() != firstCell) {
                    antiDiagWin = false;
                    break;
                }
            }

            if (antiDiagWin) return firstCell;
        }

        return CellState::EMPTY;
    }

    void display() const {
        cout &lt;&lt; &quot;\\n&quot;;
        for (int i = 0; i &lt; size; i++) {
            // Print row
            for (int j = 0; j &lt; size; j++) {
                cout &lt;&lt; &quot; &quot; &lt;&lt; cells[i][j].getSymbol() &lt;&lt; &quot; &quot;;
                if (j &lt; size - 1) cout &lt;&lt; &quot;|&quot;;
            }
            cout &lt;&lt; &quot;\\n&quot;;

            // Print separator
            if (i &lt; size - 1) {
                for (int j = 0; j &lt; size; j++) {
                    cout &lt;&lt; &quot;---&quot;;
                    if (j &lt; size - 1) cout &lt;&lt; &quot;+&quot;;
                }
                cout &lt;&lt; &quot;\\n&quot;;
            }
        }
        cout &lt;&lt; &quot;\\n&quot;;
    }

    void reset() {
        for (int i = 0; i &lt; size; i++) {
            for (int j = 0; j &lt; size; j++) {
                cells[i][j].setState(CellState::EMPTY);
            }
        }
        movesCount = 0;
    }
};

// ============== Player ==============

class Player {
protected:
    string name;
    CellState symbol;

public:
    Player(const string&amp; n, CellState s) : name(n), symbol(s) {}
    virtual ~Player() = default;

    string getName() const { return name; }
    CellState getSymbol() const { return symbol; }

    virtual pair&lt;int, int&gt; getMove(const Board&amp; board) = 0;
};

// Human Player
class HumanPlayer : public Player {
public:
    HumanPlayer(const string&amp; name, CellState symbol) 
        : Player(name, symbol) {}

    pair&lt;int, int&gt; getMove(const Board&amp; board) override {
        int row, col;

        while (true) {
            cout &lt;&lt; name &lt;&lt; &quot;'s turn (&quot; &lt;&lt; (symbol == CellState::X ? &quot;X&quot; : &quot;O&quot;) &lt;&lt; &quot;)&quot; &lt;&lt; endl;
            cout &lt;&lt; &quot;Enter row (0-&quot; &lt;&lt; board.getSize()-1 &lt;&lt; &quot;): &quot;;
            cin &gt;&gt; row;

            if (cin.fail()) {
                cin.clear();
                cin.ignore(numeric_limits&lt;streamsize&gt;::max(), '\\n');
                cout &lt;&lt; &quot;Invalid input! Please enter a number.&quot; &lt;&lt; endl;
                continue;
            }

            cout &lt;&lt; &quot;Enter column (0-&quot; &lt;&lt; board.getSize()-1 &lt;&lt; &quot;): &quot;;
            cin &gt;&gt; col;

            if (cin.fail()) {
                cin.clear();
                cin.ignore(numeric_limits&lt;streamsize&gt;::max(), '\\n');
                cout &lt;&lt; &quot;Invalid input! Please enter a number.&quot; &lt;&lt; endl;
                continue;
            }

            if (row &gt;= 0 &amp;&amp; row &lt; board.getSize() &amp;&amp; 
                col &gt;= 0 &amp;&amp; col &lt; board.getSize() &amp;&amp;
                board.isCellEmpty(row, col)) {
                return {row, col};
            }

            cout &lt;&lt; &quot;Invalid move! Try again.&quot; &lt;&lt; endl;
        }
    }
};

// Simple AI Player (Random valid move)
class AIPlayer : public Player {
public:
    AIPlayer(const string&amp; name, CellState symbol) 
        : Player(name, symbol) {}

    pair&lt;int, int&gt; getMove(const Board&amp; board) override {
        cout &lt;&lt; name &lt;&lt; &quot; (AI) is thinking...&quot; &lt;&lt; endl;

        // Find all empty cells
        vector&lt;pair&lt;int, int&gt;&gt; emptyCells;
        for (int i = 0; i &lt; board.getSize(); i++) {
            for (int j = 0; j &lt; board.getSize(); j++) {
                if (board.isCellEmpty(i, j)) {
                    emptyCells.push_back({i, j});
                }
            }
        }

        if (!emptyCells.empty()) {
            int randomIndex = rand() % emptyCells.size();
            return emptyCells[randomIndex];
        }

        return {-1, -1}; // Should never reach here if board has empty cells
    }
};

// ============== Game ==============

class TicTacToeGame {
private:
    unique_ptr&lt;Board&gt; board;
    unique_ptr&lt;Player&gt; player1;
    unique_ptr&lt;Player&gt; player2;
    Player* currentPlayer;
    GameStatus status;

public:
    TicTacToeGame(unique_ptr&lt;Player&gt; p1, unique_ptr&lt;Player&gt; p2, int boardSize = 3) 
        : player1(move(p1)), player2(move(p2)), status(GameStatus::IN_PROGRESS) {

        board = make_unique&lt;Board&gt;(boardSize);
        currentPlayer = player1.get();
    }

    void start() {
        cout &lt;&lt; &quot;\\n========== TIC TAC TOE ==========&quot; &lt;&lt; endl;
        cout &lt;&lt; player1-&gt;getName() &lt;&lt; &quot; (X) vs &quot; &lt;&lt; player2-&gt;getName() &lt;&lt; &quot; (O)&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;=================================\\n&quot; &lt;&lt; endl;

        board-&gt;display();

        while (status == GameStatus::IN_PROGRESS) {
            playTurn();
        }

        displayResult();
    }

    void playTurn() {
        auto [row, col] = currentPlayer-&gt;getMove(*board);

        if (board-&gt;makeMove(row, col, currentPlayer-&gt;getSymbol())) {
            cout &lt;&lt; currentPlayer-&gt;getName() &lt;&lt; &quot; placed &quot; 
                 &lt;&lt; (currentPlayer-&gt;getSymbol() == CellState::X ? &quot;X&quot; : &quot;O&quot;)
                 &lt;&lt; &quot; at (&quot; &lt;&lt; row &lt;&lt; &quot;, &quot; &lt;&lt; col &lt;&lt; &quot;)&quot; &lt;&lt; endl;

            board-&gt;display();

            // Check for winner
            CellState winner = board-&gt;checkWinner();
            if (winner == CellState::X) {
                status = GameStatus::PLAYER_X_WINS;
            } else if (winner == CellState::O) {
                status = GameStatus::PLAYER_O_WINS;
            } else if (board-&gt;isFull()) {
                status = GameStatus::DRAW;
            } else {
                // Switch player
                switchPlayer();
            }
        } else {
            cout &lt;&lt; &quot;Invalid move! Try again.&quot; &lt;&lt; endl;
        }
    }

    void switchPlayer() {
        currentPlayer = (currentPlayer == player1.get()) ? player2.get() : player1.get();
    }

    void displayResult() {
        cout &lt;&lt; &quot;\\n========== GAME OVER ==========&quot; &lt;&lt; endl;

        switch(status) {
            case GameStatus::PLAYER_X_WINS:
                cout &lt;&lt; &quot;🎉 &quot; &lt;&lt; player1-&gt;getName() &lt;&lt; &quot; (X) WINS!&quot; &lt;&lt; endl;
                break;
            case GameStatus::PLAYER_O_WINS:
                cout &lt;&lt; &quot;🎉 &quot; &lt;&lt; player2-&gt;getName() &lt;&lt; &quot; (O) WINS!&quot; &lt;&lt; endl;
                break;
            case GameStatus::DRAW:
                cout &lt;&lt; &quot;🤝 It's a DRAW!&quot; &lt;&lt; endl;
                break;
            default:
                break;
        }

        cout &lt;&lt; &quot;===============================\\n&quot; &lt;&lt; endl;
    }

    void reset() {
        board-&gt;reset();
        status = GameStatus::IN_PROGRESS;
        currentPlayer = player1.get();
        cout &lt;&lt; &quot;Game reset!&quot; &lt;&lt; endl;
    }
};

        case 2:
            player1 = make_unique&lt;HumanPlayer&gt;(&quot;You&quot;, CellState::X);

            break;
        case 3:
            player1 = make_unique&lt;AIPlayer&gt;(&quot;AI 1&quot;, CellState::X);
            player2 = make_unique&lt;AIPlayer&gt;(&quot;AI 2&quot;, CellState::O);

            player1 = make_unique&lt;HumanPlayer&gt;(&quot;Player 1&quot;, CellState::X);
            player2 = make_unique&lt;HumanPlayer&gt;(&quot;Player 2&quot;, CellState::O);
    }

    TicTacToeGame game(move(player1), move(player2));
    game.start();

    return 0;
}

<h3 id="q1-how-to-implement-unbeatable-ai-minimax">Q1: How to implement unbeatable AI (Minimax)?</h3>
<pre><code class="language-cpp">class MinimaxAI : public Player {
private:
    int minimax(Board&amp; board, int depth, bool isMaximizing) {
        CellState winner = board.checkWinner();

        if (winner == this-&gt;symbol) return 10 - depth;
        if (winner != CellState::EMPTY) return depth - 10;
        if (board.isFull()) return 0;

        if (isMaximizing) {
            int bestScore = INT_MIN;
            // Try all moves
            for (int i = 0; i &lt; board.getSize(); i++) {
                for (int j = 0; j &lt; board.getSize(); j++) {
                    if (board.isCellEmpty(i, j)) {
                        board.makeMove(i, j, this-&gt;symbol);
                        int score = minimax(board, depth + 1, false);
                        // Undo move
                        bestScore = max(bestScore, score);
                    }
                }
            }
            return bestScore;
        } else {
            // Minimizing player
            // Similar logic
        }

<h2 id="system-design">System Design</h2>
<pre><code>┌────────────────────────────────────────┐
│    TrafficControlSystem                │
│  ┌──────────────────────────────────┐  │
│  │  TrafficController (Singleton)   │  │

│  ┌──────────────────────────────────┐  │
│  │      TrafficSignal               │  │
│  │  - direction: Direction          │  │

<h2 id="complete-c-implementation">Complete C++ Implementation</h2>
<pre><code class="language-cpp">#include &lt;iostream&gt;
#include &lt;map&gt;
#include &lt;vector&gt;
#include &lt;thread&gt;
#include &lt;mutex&gt;
#include &lt;chrono&gt;
#include &lt;memory&gt;
#include &lt;atomic&gt;

using namespace std;

// ============== Enums ==============

enum class Direction {
    NORTH,
    SOUTH,
    EAST,
    WEST
};

enum class LightColor {
    RED,
    YELLOW,
    GREEN
};

enum class PedestrianSignal {
    WALK,
    DONT_WALK
};

// ============== Observer Interface ==============

class TrafficObserver {
public:
    virtual ~TrafficObserver() = default;
    virtual void onSignalChange(Direction dir, LightColor color) = 0;
    virtual void onEmergency(Direction emergencyDir) = 0;
};

// ============== Traffic Signal ==============

class TrafficSignal {
private:
    Direction direction;
    LightColor currentLight;
    PedestrianSignal pedestrianSignal;
    mutex signalMutex;

    string directionToString() const {
        switch(direction) {
            case Direction::NORTH: return &quot;NORTH&quot;;
            case Direction::SOUTH: return &quot;SOUTH&quot;;
            case Direction::EAST: return &quot;EAST&quot;;
            case Direction::WEST: return &quot;WEST&quot;;
            default: return &quot;UNKNOWN&quot;;
        }
    }

    string lightToString() const {
        switch(currentLight) {
            case LightColor::RED: return &quot;🔴 RED&quot;;
            case LightColor::YELLOW: return &quot;🟡 YELLOW&quot;;
            case LightColor::GREEN: return &quot;🟢 GREEN&quot;;
            default: return &quot;UNKNOWN&quot;;
        }
    }

public:
    TrafficSignal(Direction dir) 
        : direction(dir), currentLight(LightColor::RED), 
          pedestrianSignal(PedestrianSignal::DONT_WALK) {}

    Direction getDirection() const { return direction; }
    LightColor getCurrentLight() const { return currentLight; }

    void changeLight(LightColor newLight) {
        lock_guard&lt;mutex&gt; lock(signalMutex);
        currentLight = newLight;

        // Pedestrian signal logic
        if (newLight == LightColor::GREEN) {
            pedestrianSignal = PedestrianSignal::DONT_WALK;
        } else if (newLight == LightColor::RED) {
            pedestrianSignal = PedestrianSignal::WALK;
        }
    }

    void display() const {
        cout &lt;&lt; &quot;[&quot; &lt;&lt; directionToString() &lt;&lt; &quot;] &quot; &lt;&lt; lightToString();

        if (pedestrianSignal == PedestrianSignal::WALK) {
            cout &lt;&lt; &quot; | Pedestrian: 🚶 WALK&quot;;
        } else {
            cout &lt;&lt; &quot; | Pedestrian: 🚫 DON'T WALK&quot;;
        }

        cout &lt;&lt; endl;
    }
};

// ============== Timing Strategy ==============

class TimingStrategy {
public:
    virtual ~TimingStrategy() = default;
    virtual int getGreenDuration() const = 0;
    virtual int getYellowDuration() const = 0;
    virtual int getRedDuration() const = 0;
};

class StandardTiming : public TimingStrategy {
public:
    int getGreenDuration() const override { return 30; } // 30 seconds
    int getYellowDuration() const override { return 5; }  // 5 seconds
    int getRedDuration() const override { return 35; }    // 35 seconds
};

class PeakHourTiming : public TimingStrategy {
public:
    int getGreenDuration() const override { return 45; } // Longer green
    int getYellowDuration() const override { return 5; }
    int getRedDuration() const override { return 50; }
};

class NightTimeTiming : public TimingStrategy {
public:
    int getGreenDuration() const override { return 20; } // Shorter cycles
    int getYellowDuration() const override { return 3; }
    int getRedDuration() const override { return 23; }
};

// ============== System States ==============

class TrafficController;

class SystemState {
public:
    virtual ~SystemState() = default;
    virtual void handle(TrafficController* controller) = 0;
    virtual string getStateName() const = 0;
};

// Forward declarations
class NorthSouthGreenState;
class EastWestGreenState;
class EmergencyState;

// ============== Traffic Controller ==============

class TrafficController {
private:
    static TrafficController* instance;
    static mutex mtx;

    map&lt;Direction, unique_ptr&lt;TrafficSignal&gt;&gt; signals;
    SystemState* currentState;
    unique_ptr&lt;TimingStrategy&gt; timingStrategy;
    vector&lt;TrafficObserver*&gt; observers;

    unique_ptr&lt;NorthSouthGreenState&gt; nsGreenState;
    unique_ptr&lt;EastWestGreenState&gt; ewGreenState;
    unique_ptr&lt;EmergencyState&gt; emergencyState;

    atomic&lt;bool&gt; running;
    thread controlThread;

    TrafficController() : currentState(nullptr), running(false) {
        // Initialize signals for all directions
        signals[Direction::NORTH] = make_unique&lt;TrafficSignal&gt;(Direction::NORTH);
        signals[Direction::SOUTH] = make_unique&lt;TrafficSignal&gt;(Direction::SOUTH);
        signals[Direction::EAST] = make_unique&lt;TrafficSignal&gt;(Direction::EAST);
        signals[Direction::WEST] = make_unique&lt;TrafficSignal&gt;(Direction::WEST);

        // Default timing strategy
        timingStrategy = make_unique&lt;StandardTiming&gt;();

        // Initialize all signals to RED
        for (auto&amp; [dir, signal] : signals) {
            signal-&gt;changeLight(LightColor::RED);
        }
    }

public:
    static TrafficController* getInstance() {
        lock_guard&lt;mutex&gt; lock(mtx);
        if (instance == nullptr) {
            instance = new TrafficController();
        }
        return instance;
    }

    void initializeStates();

    void setState(SystemState* state) {
        if (currentState) {
            cout &lt;&lt; &quot;\\n[State Transition: &quot; &lt;&lt; currentState-&gt;getStateName() 
                 &lt;&lt; &quot; → &quot; &lt;&lt; state-&gt;getStateName() &lt;&lt; &quot;]&quot; &lt;&lt; endl;
        }
        currentState = state;
    }

    SystemState* getNSGreenState() { return nsGreenState.get(); }
    SystemState* getEWGreenState() { return ewGreenState.get(); }
    SystemState* getEmergencyState() { return emergencyState.get(); }

    TrafficSignal* getSignal(Direction dir) {
        return signals[dir].get();
    }

    TimingStrategy* getTimingStrategy() { return timingStrategy.get(); }

    void setTimingStrategy(unique_ptr&lt;TimingStrategy&gt; strategy) {
        timingStrategy = move(strategy);
        cout &lt;&lt; &quot;Timing strategy updated&quot; &lt;&lt; endl;
    }

    void addObserver(TrafficObserver* observer) {
        observers.push_back(observer);
    }

    void notifySignalChange(Direction dir, LightColor color) {
        for (auto* observer : observers) {
            observer-&gt;onSignalChange(dir, color);
        }
    }

    void notifyEmergency(Direction emergencyDir) {
        for (auto* observer : observers) {
            observer-&gt;onEmergency(emergencyDir);
        }
    }

    void start() {
        if (running) return;

        running = true;
        controlThread = thread(&amp;TrafficController::controlLoop, this);
        cout &lt;&lt; &quot;\\n🚦 Traffic Control System Started 🚦\\n&quot; &lt;&lt; endl;
    }

    void stop() {
        running = false;
        if (controlThread.joinable()) {
            controlThread.join();
        }
        cout &lt;&lt; &quot;\\n🚦 Traffic Control System Stopped 🚦\\n&quot; &lt;&lt; endl;
    }

    void controlLoop() {
        while (running) {
            if (currentState) {
                currentState-&gt;handle(this);
            }
            this_thread::sleep_for(chrono::seconds(1));
        }
    }

    void displayStatus() {
        cout &lt;&lt; &quot;\\n========== TRAFFIC SIGNAL STATUS ==========&quot; &lt;&lt; endl;
        if (currentState) {
            cout &lt;&lt; &quot;Current State: &quot; &lt;&lt; currentState-&gt;getStateName() &lt;&lt; endl;
        }
        cout &lt;&lt; &quot;-------------------------------------------&quot; &lt;&lt; endl;

        for (auto&amp; [dir, signal] : signals) {
            signal-&gt;display();
        }

        cout &lt;&lt; &quot;===========================================\\n&quot; &lt;&lt; endl;
    }

    void handleEmergency(Direction emergencyDir) {
        cout &lt;&lt; &quot;\\n🚨 EMERGENCY VEHICLE DETECTED 🚨&quot; &lt;&lt; endl;
        notifyEmergency(emergencyDir);
        setState(emergencyState.get());
    }

    static void cleanup() {
        if (instance) {
            instance-&gt;stop();
            delete instance;
            instance = nullptr;
        }
    }
};

TrafficController* TrafficController::instance = nullptr;
mutex TrafficController::mtx;

// ============== Concrete System States ==============

class NorthSouthGreenState : public SystemState {
private:
    int elapsedTime;

public:
    NorthSouthGreenState() : elapsedTime(0) {}

    void handle(TrafficController* controller) override {
        TimingStrategy* timing = controller-&gt;getTimingStrategy();

        if (elapsedTime == 0) {
            // Set North-South to GREEN
            controller-&gt;getSignal(Direction::NORTH)-&gt;changeLight(LightColor::GREEN);
            controller-&gt;getSignal(Direction::SOUTH)-&gt;changeLight(LightColor::GREEN);
            controller-&gt;notifySignalChange(Direction::NORTH, LightColor::GREEN);
            controller-&gt;notifySignalChange(Direction::SOUTH, LightColor::GREEN);

            // Set East-West to RED
            controller-&gt;getSignal(Direction::EAST)-&gt;changeLight(LightColor::RED);
            controller-&gt;getSignal(Direction::WEST)-&gt;changeLight(LightColor::RED);

            controller-&gt;displayStatus();
        }

        elapsedTime++;

        // Transition to YELLOW
        if (elapsedTime &gt;= timing-&gt;getGreenDuration()) {
            controller-&gt;getSignal(Direction::NORTH)-&gt;changeLight(LightColor::YELLOW);
            controller-&gt;getSignal(Direction::SOUTH)-&gt;changeLight(LightColor::YELLOW);
            controller-&gt;displayStatus();

            this_thread::sleep_for(chrono::seconds(timing-&gt;getYellowDuration()));

            // Reset and transition to East-West
            elapsedTime = 0;
            controller-&gt;setState(controller-&gt;getEWGreenState());
        }
    }

    string getStateName() const override { return &quot;NORTH-SOUTH GREEN&quot;; }
};

class EastWestGreenState : public SystemState {
private:
    int elapsedTime;

public:
    EastWestGreenState() : elapsedTime(0) {}

    void handle(TrafficController* controller) override {
        TimingStrategy* timing = controller-&gt;getTimingStrategy();

        if (elapsedTime == 0) {
            // Set East-West to GREEN
            controller-&gt;getSignal(Direction::EAST)-&gt;changeLight(LightColor::GREEN);
            controller-&gt;getSignal(Direction::WEST)-&gt;changeLight(LightColor::GREEN);
            controller-&gt;notifySignalChange(Direction::EAST, LightColor::GREEN);
            controller-&gt;notifySignalChange(Direction::WEST, LightColor::GREEN);

            // Set North-South to RED
            controller-&gt;getSignal(Direction::NORTH)-&gt;changeLight(LightColor::RED);
            controller-&gt;getSignal(Direction::SOUTH)-&gt;changeLight(LightColor::RED);

            controller-&gt;displayStatus();
        }

        elapsedTime++;

        // Transition to YELLOW
        if (elapsedTime &gt;= timing-&gt;getGreenDuration()) {
            controller-&gt;getSignal(Direction::EAST)-&gt;changeLight(LightColor::YELLOW);
            controller-&gt;getSignal(Direction::WEST)-&gt;changeLight(LightColor::YELLOW);
            controller-&gt;displayStatus();

            this_thread::sleep_for(chrono::seconds(timing-&gt;getYellowDuration()));

            // Reset and transition to North-South
            elapsedTime = 0;
            controller-&gt;setState(controller-&gt;getNSGreenState());
        }
    }

    string getStateName() const override { return &quot;EAST-WEST GREEN&quot;; }
};

class EmergencyState : public SystemState {
private:
    Direction emergencyDirection;
    int duration;

public:
    EmergencyState() : emergencyDirection(Direction::NORTH), duration(0) {}

    void setEmergencyDirection(Direction dir) {
        emergencyDirection = dir;
        duration = 0;
    }

    void handle(TrafficController* controller) override {
        if (duration == 0) {
            // Set all to RED except emergency direction
            for (auto dir : {Direction::NORTH, Direction::SOUTH, Direction::EAST, Direction::WEST}) {
                if (dir == emergencyDirection) {
                    controller-&gt;getSignal(dir)-&gt;changeLight(LightColor::GREEN);
                } else {
                    controller-&gt;getSignal(dir)-&gt;changeLight(LightColor::RED);
                }
            }
            controller-&gt;displayStatus();
        }

        duration++;

        // Emergency cleared after 20 seconds
        if (duration &gt;= 20) {
            cout &lt;&lt; &quot;\\n✓ Emergency cleared, resuming normal operation\\n&quot; &lt;&lt; endl;
            duration = 0;
            controller-&gt;setState(controller-&gt;getNSGreenState());
        }
    }

    string getStateName() const override { return &quot;EMERGENCY MODE&quot;; }
};

void TrafficController::initializeStates() {
    nsGreenState = make_unique&lt;NorthSouthGreenState&gt;();
    ewGreenState = make_unique&lt;EastWestGreenState&gt;();
    emergencyState = make_unique&lt;EmergencyState&gt;();

    currentState = nsGreenState.get();
}

// ============== Concrete Observer ==============

class MonitoringSystem : public TrafficObserver {
private:
    string name;

public:
    MonitoringSystem(const string&amp; n) : name(n) {}

    void onSignalChange(Direction dir, LightColor color) override {
        // Log signal change (in real system, would log to file/database)
        // cout &lt;&lt; &quot;[&quot; &lt;&lt; name &lt;&lt; &quot;] Signal changed: &quot; &lt;&lt; (int)dir &lt;&lt; &quot; -&gt; &quot; &lt;&lt; (int)color &lt;&lt; endl;
    }

    void onEmergency(Direction emergencyDir) override {
        cout &lt;&lt; &quot;[&quot; &lt;&lt; name &lt;&lt; &quot;] 🚨 Emergency detected on direction: &quot; &lt;&lt; (int)emergencyDir &lt;&lt; endl;
    }
};

// ============== Demo ==============

int main() {
    TrafficController* controller = TrafficController::getInstance();
    controller-&gt;initializeStates();

    // Add monitoring system
    MonitoringSystem monitor(&quot;Central Monitor&quot;);
    controller-&gt;addObserver(&amp;monitor);

    // Display initial status
    controller-&gt;displayStatus();

    // Start traffic control
    controller-&gt;start();

    // Run for 60 seconds with standard timing
    cout &lt;&lt; &quot;Running with STANDARD timing for 60 seconds...&quot; &lt;&lt; endl;
    this_thread::sleep_for(chrono::seconds(60));

    // Switch to peak hour timing
    cout &lt;&lt; &quot;\\n🕐 Switching to PEAK HOUR timing...\\n&quot; &lt;&lt; endl;
    controller-&gt;setTimingStrategy(make_unique&lt;PeakHourTiming&gt;());
    this_thread::sleep_for(chrono::seconds(50));

    // Simulate emergency
    cout &lt;&lt; &quot;\\n🚨 Emergency vehicle approaching from NORTH!\\n&quot; &lt;&lt; endl;
    controller-&gt;handleEmergency(Direction::NORTH);
    this_thread::sleep_for(chrono::seconds(25));

    // Continue normal operation
    this_thread::sleep_for(chrono::seconds(40));

    // Stop system
    TrafficController::cleanup();

    return 0;
}
</code></pre>

<h2 id="key-design-decisions">Key Design Decisions</h2>
<h3 id="1-state-pattern">1. <strong>State Pattern</strong></h3>
<ul>

<li>Easy to add new states</li>
</ul>
<h3 id="2-strategy-pattern-for-timing">2. <strong>Strategy Pattern for Timing</strong></h3>
<ul>
<li>Different timing strategies for different times of day</li>
<li>Easy to switch strategies at runtime</li>
<li>Standard, Peak Hour, Night Time timings</li>
</ul>
<h3 id="3-observer-pattern">3. <strong>Observer Pattern</strong></h3>
<ul>
<li>Monitoring systems can observe signal changes</li>
<li>Decoupled from main controller</li>
<li>Easy to add new observers</li>
</ul>
<h3 id="4-thread-safety">4. <strong>Thread Safety</strong></h3>
<ul>
<li>Mutex protection for signal state changes</li>
<li>Atomic running flag</li>
<li>Safe concurrent access</li>
</ul>

// ============== Enums ==============

enum class LogLevel {
    DEBUG = 0,
    INFO = 1,
    WARN = 2,
    ERROR = 3,
    FATAL = 4
};

// ============== Log Entry ==============

class LogEntry {
private:
    time_t timestamp;
    LogLevel level;
    string message;
    thread::id threadId;

public:
    LogEntry(LogLevel lvl, const string&amp; msg)
        : timestamp(time(nullptr)), level(lvl), message(msg),
          threadId(this_thread::get_id()) {}

    string levelToString() const {
        switch(level) {
            case LogLevel::DEBUG: return &quot;DEBUG&quot;;
            case LogLevel::INFO:  return &quot;INFO &quot;;
            case LogLevel::WARN:  return &quot;WARN &quot;;
            case LogLevel::ERROR: return &quot;ERROR&quot;;
            case LogLevel::FATAL: return &quot;FATAL&quot;;
            default: return &quot;UNKNOWN&quot;;
        }
    }

    string format() const {
        stringstream ss;

        // Format timestamp
        char timeStr[26];
        ctime_r(&amp;timestamp, timeStr);
        timeStr[24] = '\\0'; // Remove newline

        // Format: [TIMESTAMP] [LEVEL] [THREAD] MESSAGE
        ss &lt;&lt; &quot;[&quot; &lt;&lt; timeStr &lt;&lt; &quot;] &quot;
           &lt;&lt; &quot;[&quot; &lt;&lt; levelToString() &lt;&lt; &quot;] &quot;
           &lt;&lt; &quot;[Thread-&quot; &lt;&lt; threadId &lt;&lt; &quot;] &quot;
           &lt;&lt; message;

        return ss.str();
    }

    LogLevel getLevel() const { return level; }
    string getMessage() const { return message; }
    time_t getTimestamp() const { return timestamp; }
};

// ============== Log Sink Interface ==============

class LogSink {
public:
    virtual ~LogSink() = default;
    virtual void write(const LogEntry&amp; entry) = 0;
    virtual void flush() = 0;
};

// ============== Console Sink ==============

class ConsoleSink : public LogSink {
private:
    mutex consoleMutex;
    bool colorEnabled;

    string getColorCode(LogLevel level) const {
        if (!colorEnabled) return &quot;&quot;;

        switch(level) {
            case LogLevel::DEBUG: return &quot;\\033[36m&quot;;  // Cyan
            case LogLevel::INFO:  return &quot;\\033[32m&quot;;  // Green
            case LogLevel::WARN:  return &quot;\\033[33m&quot;;  // Yellow
            case LogLevel::ERROR: return &quot;\\033[31m&quot;;  // Red
            case LogLevel::FATAL: return &quot;\\033[35m&quot;;  // Magenta
            default: return &quot;&quot;;
        }
    }

    string getResetCode() const {
        return colorEnabled ? &quot;\\033[0m&quot; : &quot;&quot;;
    }

public:
    ConsoleSink(bool color = true) : colorEnabled(color) {}

    void write(const LogEntry&amp; entry) override {
        lock_guard&lt;mutex&gt; lock(consoleMutex);
        cout &lt;&lt; getColorCode(entry.getLevel())
             &lt;&lt; entry.format()
             &lt;&lt; getResetCode()
             &lt;&lt; endl;
    }

    void flush() override {
        cout.flush();
    }
};

// ============== File Sink ==============

class FileSink : public LogSink {
private:
    string filename;
    ofstream fileStream;
    mutex fileMutex;
    size_t maxFileSize;
    size_t currentSize;
    int rotationCount;

    void rotateFile() {
        fileStream.close();

        // Rename old file
        string rotatedName = filename + &quot;.&quot; + to_string(++rotationCount);
        rename(filename.c_str(), rotatedName.c_str());

        // Open new file
        fileStream.open(filename, ios::app);
        currentSize = 0;
    }

public:
    FileSink(const string&amp; fname, size_t maxSize = 10 * 1024 * 1024) // 10MB default
        : filename(fname), maxFileSize(maxSize), currentSize(0), rotationCount(0) {

        fileStream.open(filename, ios::app);

        if (!fileStream.is_open()) {
            throw runtime_error(&quot;Failed to open log file: &quot; + filename);
        }

        // Get current file size
        fileStream.seekp(0, ios::end);
        currentSize = fileStream.tellp();
    }

    ~FileSink() {
        if (fileStream.is_open()) {
            fileStream.close();
        }
    }

    void write(const LogEntry&amp; entry) override {
        lock_guard&lt;mutex&gt; lock(fileMutex);

        string formatted = entry.format();
        fileStream &lt;&lt; formatted &lt;&lt; endl;

        currentSize += formatted.length() + 1;

        // Check if rotation needed
        if (currentSize &gt;= maxFileSize) {
            rotateFile();
        }
    }

    void flush() override {
        lock_guard&lt;mutex&gt; lock(fileMutex);
        fileStream.flush();
    }
};

// ============== Async File Sink (Buffered) ==============

class AsyncFileSink : public LogSink {
private:
    string filename;
    ofstream fileStream;
    mutex queueMutex;
    queue&lt;string&gt; logQueue;
    thread writerThread;
    bool running;
    condition_variable cv;

    void writerLoop() {
        while (running || !logQueue.empty()) {
            unique_lock&lt;mutex&gt; lock(queueMutex);

            cv.wait_for(lock, chrono::milliseconds(100), [this] {
                return !logQueue.empty() || !running;
            });

            while (!logQueue.empty()) {
                string entry = logQueue.front();
                logQueue.pop();
                lock.unlock();

                fileStream &lt;&lt; entry &lt;&lt; endl;

                lock.lock();
            }
        }

        fileStream.flush();
    }

public:
    AsyncFileSink(const string&amp; fname) : filename(fname), running(true) {
        fileStream.open(filename, ios::app);

        if (!fileStream.is_open()) {
            throw runtime_error(&quot;Failed to open log file: &quot; + filename);
        }

        writerThread = thread(&amp;AsyncFileSink::writerLoop, this);
    }

    ~AsyncFileSink() {
        running = false;
        cv.notify_all();

        if (writerThread.joinable()) {
            writerThread.join();
        }

        if (fileStream.is_open()) {
            fileStream.close();
        }
    }

    void write(const LogEntry&amp; entry) override {
        lock_guard&lt;mutex&gt; lock(queueMutex);
        logQueue.push(entry.format());
        cv.notify_one();
    }

    void flush() override {
        // Wait for queue to be empty
        while (true) {
            {
                lock_guard&lt;mutex&gt; lock(queueMutex);
                if (logQueue.empty()) break;
            }
            this_thread::sleep_for(chrono::milliseconds(10));
        }
        fileStream.flush();
    }
};

// ============== Logger (Singleton) ==============

class Logger {
private:
    static Logger* instance;
    static mutex instanceMutex;

    LogLevel minLevel;
    vector&lt;unique_ptr&lt;LogSink&gt;&gt; sinks;
    mutex logMutex;

    Logger() : minLevel(LogLevel::DEBUG) {}

public:
    static Logger&amp; getInstance() {
        lock_guard&lt;mutex&gt; lock(instanceMutex);
        if (instance == nullptr) {
            instance = new Logger();
        }
        return *instance;
    }

    // Delete copy constructor and assignment
    Logger(const Logger&amp;) = delete;
    Logger&amp; operator=(const Logger&amp;) = delete;

    void setMinLevel(LogLevel level) {
        lock_guard&lt;mutex&gt; lock(logMutex);
        minLevel = level;
    }

    void addSink(unique_ptr&lt;LogSink&gt; sink) {
        lock_guard&lt;mutex&gt; lock(logMutex);
        sinks.push_back(move(sink));
    }

    void log(LogLevel level, const string&amp; message) {
        // Filter by minimum level
        if (level &lt; minLevel) {
            return;
        }

        LogEntry entry(level, message);

        lock_guard&lt;mutex&gt; lock(logMutex);

        // Write to all sinks
        for (auto&amp; sink : sinks) {
            sink-&gt;write(entry);
        }
    }

    // Convenience methods
    void debug(const string&amp; message) { log(LogLevel::DEBUG, message); }
    void info(const string&amp; message) { log(LogLevel::INFO, message); }
    void warn(const string&amp; message) { log(LogLevel::WARN, message); }
    void error(const string&amp; message) { log(LogLevel::ERROR, message); }
    void fatal(const string&amp; message) { log(LogLevel::FATAL, message); }

    void flush() {
        lock_guard&lt;mutex&gt; lock(logMutex);
        for (auto&amp; sink : sinks) {
            sink-&gt;flush();
        }
    }

    static void cleanup() {
        if (instance) {
            instance-&gt;flush();
            delete instance;
            instance = nullptr;
        }
    }
};

Logger* Logger::instance = nullptr;
mutex Logger::instanceMutex;

    LOG_INFO(&quot;Application started successfully&quot;);
    LOG_WARN(&quot;This is a warning message&quot;);
    LOG_ERROR(&quot;This is an error message&quot;);
    LOG_FATAL(&quot;This is a fatal error message&quot;);

    cout &lt;&lt; &quot;\\n--- Testing Log Level Filtering ---\\n&quot; &lt;&lt; endl;

    // Set minimum level to WARN
    logger.setMinLevel(LogLevel::WARN);

    LOG_DEBUG(&quot;This debug won't be logged&quot;);
    LOG_INFO(&quot;This info won't be logged&quot;);
    LOG_WARN(&quot;This warning will be logged&quot;);
    LOG_ERROR(&quot;This error will be logged&quot;);

    // Reset to DEBUG
    logger.setMinLevel(LogLevel::DEBUG);

    cout &lt;&lt; &quot;\\n--- Testing Multi-threaded Logging ---\\n&quot; &lt;&lt; endl;

// ============== Code Generator ==============

class CodeGenerator {
private:
    static const string BASE62_CHARS;
    static long long counter;
    random_device rd;
    mt19937 gen;

public:
    CodeGenerator() : gen(rd()) {}

    // Convert number to base62 string
    string toBase62(long long num) {
        if (num == 0) return string(1, BASE62_CHARS[0]);

        string result;
        while (num &gt; 0) {
            result = BASE62_CHARS[num % 62] + result;
            num /= 62;
        }

        // Pad to 6 characters
        while (result.length() &lt; 6) {
            result = BASE62_CHARS[0] + result;
        }

        return result;
    }

    // Generate code from counter (deterministic)
    string generateFromCounter() {
        return toBase62(++counter);
    }

    // Generate random code
    string generateRandom(int length = 6) {
        uniform_int_distribution&lt;&gt; dis(0, 61);
        string code;

        for (int i = 0; i &lt; length; i++) {
            code += BASE62_CHARS[dis(gen)];
        }

        return code;
    }

    // Generate from hash
    string generateFromURL(const string&amp; url) {
        hash&lt;string&gt; hasher;
        size_t hashValue = hasher(url);

        // Add timestamp to ensure uniqueness
        hashValue ^= time(nullptr);

        return toBase62(hashValue);
    }
};

const string CodeGenerator::BASE62_CHARS = 
    &quot;0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz&quot;;

long long CodeGenerator::counter = 0;

// ============== URL Shortener ==============

class URLShortener {
private:
    static URLShortener* instance;
    static mutex mtx;

    unordered_map&lt;string, unique_ptr&lt;URLEntry&gt;&gt; shortToLong;  // short -&gt; entry
    unordered_map&lt;string, string&gt; longToShort;  // long -&gt; short
    unordered_set&lt;string&gt; customCodes;
    CodeGenerator codeGenerator;
    string baseURL;

    URLShortener(const string&amp; base = &quot;http://short.url/&quot;) : baseURL(base) {}

    bool isValidShortCode(const string&amp; code) {
        if (code.empty() || code.length() &gt; 10) return false;

        for (char c : code) {
            if (!isalnum(c) &amp;&amp; c != '_' &amp;&amp; c != '-') {
                return false;
            }
        }
        return true;
    }

public:
    static URLShortener* getInstance(const string&amp; baseURL = &quot;http://short.url/&quot;) {
        lock_guard&lt;mutex&gt; lock(mtx);
        if (instance == nullptr) {
            instance = new URLShortener(baseURL);
        }
        return instance;
    }

    // Shorten URL with auto-generated code
    string shortenURL(const string&amp; longURL, const string&amp; userId = &quot;&quot;, 
                     int expiryDays = 0) {
        lock_guard&lt;mutex&gt; lock(mtx);

        // Check if already shortened
        auto it = longToShort.find(longURL);
        if (it != longToShort.end()) {
            cout &lt;&lt; &quot;URL already shortened!&quot; &lt;&lt; endl;
            return baseURL + it-&gt;second;
        }

        // Generate unique short code
        string shortCode;
        int attempts = 0;

        do {
            shortCode = codeGenerator.generateFromURL(longURL);
            attempts++;

            if (attempts &gt; 10) {
                // Fallback to random if too many collisions
                shortCode = codeGenerator.generateRandom();
            }
        } while (shortToLong.find(shortCode) != shortToLong.end());

        // Create entry
        auto entry = make_unique&lt;URLEntry&gt;(shortCode, longURL, userId, expiryDays);
        shortToLong[shortCode] = move(entry);
        longToShort[longURL] = shortCode;

        cout &lt;&lt; &quot;✓ URL shortened successfully!&quot; &lt;&lt; endl;
        return baseURL + shortCode;
    }

    // Shorten with custom code
    string customShortenURL(const string&amp; longURL, const string&amp; customCode,
                           const string&amp; userId = &quot;&quot;, int expiryDays = 0) {
        lock_guard&lt;mutex&gt; lock(mtx);

        if (!isValidShortCode(customCode)) {
            throw invalid_argument(&quot;Invalid custom code format&quot;);
        }

        if (shortToLong.find(customCode) != shortToLong.end()) {
            throw runtime_error(&quot;Custom code already in use&quot;);
        }

        auto entry = make_unique&lt;URLEntry&gt;(customCode, longURL, userId, expiryDays);
        shortToLong[customCode] = move(entry);
        longToShort[longURL] = customCode;
        customCodes.insert(customCode);

        cout &lt;&lt; &quot;✓ Custom URL created successfully!&quot; &lt;&lt; endl;
        return baseURL + customCode;
    }

    // Expand short URL
    string expandURL(const string&amp; shortURL) {
        lock_guard&lt;mutex&gt; lock(mtx);

        // Extract short code from URL
        string shortCode = shortURL;
        if (shortURL.find(baseURL) == 0) {
            shortCode = shortURL.substr(baseURL.length());
        }

        auto it = shortToLong.find(shortCode);
        if (it == shortToLong.end()) {
            throw runtime_error(&quot;Short URL not found&quot;);
        }

        URLEntry* entry = it-&gt;second.get();

        // Check expiration
        if (entry-&gt;isExpired()) {
            cout &lt;&lt; &quot;⚠️  URL has expired&quot; &lt;&lt; endl;
            // Optionally delete expired URLs
            return &quot;&quot;;
        }

        // Record analytics
        entry-&gt;recordClick();

        return entry-&gt;getLongURL();
    }

    // Delete URL
    bool deleteURL(const string&amp; shortCode, const string&amp; userId = &quot;&quot;) {
        lock_guard&lt;mutex&gt; lock(mtx);

        auto it = shortToLong.find(shortCode);
        if (it == shortToLong.end()) {
            return false;
        }

        // Check ownership if userId provided
        if (!userId.empty() &amp;&amp; it-&gt;second-&gt;getUserId() != userId) {
            cout &lt;&lt; &quot;⚠️  Not authorized to delete this URL&quot; &lt;&lt; endl;
            return false;
        }

        string longURL = it-&gt;second-&gt;getLongURL();

        shortToLong.erase(it);
        longToShort.erase(longURL);
        customCodes.erase(shortCode);

        cout &lt;&lt; &quot;✓ URL deleted successfully&quot; &lt;&lt; endl;
        return true;
    }

    // Get analytics
    const Analytics* getAnalytics(const string&amp; shortCode) {
        lock_guard&lt;mutex&gt; lock(mtx);

        auto it = shortToLong.find(shortCode);
        if (it == shortToLong.end()) {
            return nullptr;
        }

        return &amp;(it-&gt;second-&gt;getAnalytics());
    }

    // Display URL info
    void displayURLInfo(const string&amp; shortCode) {
        lock_guard&lt;mutex&gt; lock(mtx);

        auto it = shortToLong.find(shortCode);
        if (it == shortToLong.end()) {
            cout &lt;&lt; &quot;URL not found!&quot; &lt;&lt; endl;
            return;
        }

        it-&gt;second-&gt;display();
    }

    // List all URLs for user
    void listUserURLs(const string&amp; userId) {
        lock_guard&lt;mutex&gt; lock(mtx);

        cout &lt;&lt; &quot;\\n========== URLs for User: &quot; &lt;&lt; userId &lt;&lt; &quot; ==========&quot; &lt;&lt; endl;
        int count = 0;

        for (const auto&amp; [code, entry] : shortToLong) {
            if (entry-&gt;getUserId() == userId) {
                cout &lt;&lt; baseURL &lt;&lt; code &lt;&lt; &quot; -&gt; &quot; &lt;&lt; entry-&gt;getLongURL() &lt;&lt; endl;
                count++;
            }
        }

        cout &lt;&lt; &quot;Total: &quot; &lt;&lt; count &lt;&lt; &quot; URLs&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;====================================================\\n&quot; &lt;&lt; endl;
    }

    // Clean expired URLs
    int cleanExpiredURLs() {
        lock_guard&lt;mutex&gt; lock(mtx);

        vector&lt;string&gt; toDelete;

        for (const auto&amp; [code, entry] : shortToLong) {
            if (entry-&gt;isExpired()) {
                toDelete.push_back(code);
            }
        }

        for (const string&amp; code : toDelete) {
            string longURL = shortToLong[code]-&gt;getLongURL();
            shortToLong.erase(code);
            longToShort.erase(longURL);
        }

        cout &lt;&lt; &quot;✓ Cleaned &quot; &lt;&lt; toDelete.size() &lt;&lt; &quot; expired URLs&quot; &lt;&lt; endl;
        return toDelete.size();
    }

    void displayStats() {
        lock_guard&lt;mutex&gt; lock(mtx);

        cout &lt;&lt; &quot;\\n========== URL Shortener Stats ==========&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;Total URLs: &quot; &lt;&lt; shortToLong.size() &lt;&lt; endl;
        cout &lt;&lt; &quot;Custom URLs: &quot; &lt;&lt; customCodes.size() &lt;&lt; endl;
        cout &lt;&lt; &quot;=========================================\\n&quot; &lt;&lt; endl;
    }

    static void cleanup() {
        delete instance;
        instance = nullptr;
    }
};

URLShortener* URLShortener::instance = nullptr;
mutex URLShortener::mtx;

<h2 id="key-design-decisions">Key Design Decisions</h2>
<h3 id="1-base62-encoding">1. <strong>Base62 Encoding</strong></h3>
<ul>
<li>Uses 0-9, A-Z, a-z (62 characters)</li>
<li>Short codes: 6 characters = 62^6 = 56 billion URLs</li>
<li>Collision resistant</li>
</ul>
<h3 id="2-multiple-generation-strategies">2. <strong>Multiple Generation Strategies</strong></h3>
<ul>
<li>Hash-based (from URL + timestamp)</li>
<li>Counter-based (sequential)</li>
<li>Random generation</li>
<li>Custom codes</li>
</ul>
<h3 id="3-analytics-tracking">3. <strong>Analytics Tracking</strong></h3>
<ul>
<li>Click count</li>
<li>Last accessed time</li>
<li>Easy to extend (referrers, geo-location, etc.)</li>
</ul>
<h3 id="4-expiration-support">4. <strong>Expiration Support</strong></h3>
<ul>
<li>Optional expiry time</li>
<li>Cleanup of expired URLs</li>
<li>Useful for temporary campaigns</li>
</ul>

<h2 id="follow-up-questions">Follow-up Questions</h2>
<p><strong>Q1: How to scale to billions of URLs?</strong>
- Use distributed database (Cassandra, DynamoDB)
- Partition by hash of short code
- Cache frequently accessed URLs (Redis)
- Use CDN for static redirects</p>
<p><strong>Q2: How to handle high traffic (10K requests/sec)?</strong>
- Redis cache for hot URLs
- Read replicas for database
- Load balancers
- Async analytics (message queue)</p>
<p><strong>Q3: How to prevent abuse?</strong></p>
<pre><code class="language-cpp">class RateLimiter {
    unordered_map&lt;string, queue&lt;time_t&gt;&gt; userRequests;

    bool allowRequest(string userId) {
        // Allow 10 requests per minute
        auto&amp; queue = userRequests[userId];
        time_t now = time(nullptr);

        while (!queue.empty() &amp;&amp; queue.front() &lt; now - 60) {
            queue.pop();
        }

        if (queue.size() &gt;= 10) return false;

        queue.push(now);
        return true;
    }
};
</code></pre>
<p><strong>Q4: How to generate truly unique codes at scale?</strong>
- Use ZooKeeper for distributed counter
- Or use Twitter Snowflake algorithm
- Or partition key space across servers</p>

using namespace std;

// ============== Ingredient ==============

class Ingredient {
private:
    string name;
    int quantity;  // in ml or grams
    string unit;

public:
    Ingredient(const string&amp; n, int q, const string&amp; u)
        : name(n), quantity(q), unit(u) {}

    string getName() const { return name; }
    int getQuantity() const { return quantity; }

    void add(int amount) {
        quantity += amount;
        cout &lt;&lt; &quot;Added &quot; &lt;&lt; amount &lt;&lt; unit &lt;&lt; &quot; of &quot; &lt;&lt; name &lt;&lt; endl;
    }

    bool use(int amount) {
        if (quantity &gt;= amount) {
            quantity -= amount;
            return true;
        }
        return false;
    }

    void display() const {
        cout &lt;&lt; name &lt;&lt; &quot;: &quot; &lt;&lt; quantity &lt;&lt; unit &lt;&lt; endl;
    }
};

// ============== Coffee Recipe ==============

class Recipe {
private:
    string coffeeName;
    map&lt;string, int&gt; ingredients;  // ingredient name -&gt; quantity needed

public:
    Recipe(const string&amp; name) : coffeeName(name) {}

    void addIngredient(const string&amp; ingredient, int quantity) {
        ingredients[ingredient] = quantity;
    }

    string getName() const { return coffeeName; }

    const map&lt;string, int&gt;&amp; getIngredients() const {
        return ingredients;
    }

    void display() const {
        cout &lt;&lt; &quot;\\n=== &quot; &lt;&lt; coffeeName &lt;&lt; &quot; Recipe ===&quot; &lt;&lt; endl;

        }
    }
};

// ============== Coffee Machine ==============

class CoffeeMachine {
private:
    map&lt;string, unique_ptr&lt;Ingredient&gt;&gt; ingredients;
    map&lt;string, unique_ptr&lt;Recipe&gt;&gt; recipes;

public:
    CoffeeMachine() {
        // Initialize ingredients
        ingredients[&quot;Coffee&quot;] = make_unique&lt;Ingredient&gt;(&quot;Coffee&quot;, 500, &quot;g&quot;);
        ingredients[&quot;Milk&quot;] = make_unique&lt;Ingredient&gt;(&quot;Milk&quot;, 1000, &quot;ml&quot;);
        ingredients[&quot;Water&quot;] = make_unique&lt;Ingredient&gt;(&quot;Water&quot;, 2000, &quot;ml&quot;);
        ingredients[&quot;Sugar&quot;] = make_unique&lt;Ingredient&gt;(&quot;Sugar&quot;, 200, &quot;g&quot;);

        // Initialize recipes
        setupRecipes();
    }

    void setupRecipes() {
        // Espresso
        auto espresso = make_unique&lt;Recipe&gt;(&quot;Espresso&quot;);
        espresso-&gt;addIngredient(&quot;Coffee&quot;, 20);
        espresso-&gt;addIngredient(&quot;Water&quot;, 50);
        recipes[&quot;Espresso&quot;] = move(espresso);

        // Latte
        auto latte = make_unique&lt;Recipe&gt;(&quot;Latte&quot;);
        latte-&gt;addIngredient(&quot;Coffee&quot;, 20);
        latte-&gt;addIngredient(&quot;Milk&quot;, 150);
        latte-&gt;addIngredient(&quot;Water&quot;, 50);
        recipes[&quot;Latte&quot;] = move(latte);

        // Cappuccino
        auto cappuccino = make_unique&lt;Recipe&gt;(&quot;Cappuccino&quot;);
        cappuccino-&gt;addIngredient(&quot;Coffee&quot;, 20);
        cappuccino-&gt;addIngredient(&quot;Milk&quot;, 100);
        cappuccino-&gt;addIngredient(&quot;Water&quot;, 50);
        recipes[&quot;Cappuccino&quot;] = move(cappuccino);

        // Black Coffee
        auto black = make_unique&lt;Recipe&gt;(&quot;Black Coffee&quot;);
        black-&gt;addIngredient(&quot;Coffee&quot;, 15);
        black-&gt;addIngredient(&quot;Water&quot;, 100);
        recipes[&quot;Black Coffee&quot;] = move(black);
    }

    bool checkIngredients(const Recipe&amp; recipe) {
        for (const auto&amp; [ingredientName, quantityNeeded] : recipe.getIngredients()) {
            if (ingredients.find(ingredientName) == ingredients.end()) {
                cout &lt;&lt; &quot;Missing ingredient: &quot; &lt;&lt; ingredientName &lt;&lt; endl;
                return false;
            }

            if (ingredients[ingredientName]-&gt;getQuantity() &lt; quantityNeeded) {
                cout &lt;&lt; &quot;Insufficient &quot; &lt;&lt; ingredientName &lt;&lt; endl;
                return false;
            }
        }
        return true;
    }

    bool makeCoffee(const string&amp; coffeeType) {
        cout &lt;&lt; &quot;\\n=== Making &quot; &lt;&lt; coffeeType &lt;&lt; &quot; ===&quot; &lt;&lt; endl;

        if (recipes.find(coffeeType) == recipes.end()) {
            cout &lt;&lt; &quot;Unknown coffee type: &quot; &lt;&lt; coffeeType &lt;&lt; endl;
            return false;
        }

        Recipe* recipe = recipes[coffeeType].get();

        // Check ingredients
        if (!checkIngredients(*recipe)) {
            cout &lt;&lt; &quot;Cannot make &quot; &lt;&lt; coffeeType &lt;&lt; &quot;. Please refill ingredients.&quot; &lt;&lt; endl;
            return false;
        }

        // Use ingredients
        for (const auto&amp; [ingredientName, quantityNeeded] : recipe-&gt;getIngredients()) {
            ingredients[ingredientName]-&gt;use(quantityNeeded);
            cout &lt;&lt; &quot;Using &quot; &lt;&lt; quantityNeeded &lt;&lt; &quot; of &quot; &lt;&lt; ingredientName &lt;&lt; endl;
        }

        cout &lt;&lt; &quot;✓ Your &quot; &lt;&lt; coffeeType &lt;&lt; &quot; is ready! Enjoy!&quot; &lt;&lt; endl;
        return true;
    }

    void refill(const string&amp; ingredientName, int amount) {
        if (ingredients.find(ingredientName) != ingredients.end()) {
            ingredients[ingredientName]-&gt;add(amount);
        } else {
            cout &lt;&lt; &quot;Unknown ingredient: &quot; &lt;&lt; ingredientName &lt;&lt; endl;
        }
    }

    void displayInventory() const {
        cout &lt;&lt; &quot;\\n=== Coffee Machine Inventory ===&quot; &lt;&lt; endl;
        for (const auto&amp; [name, ingredient] : ingredients) {
            ingredient-&gt;display();
        }
        cout &lt;&lt; &quot;================================\\n&quot; &lt;&lt; endl;
    }

    void displayMenu() const {
        cout &lt;&lt; &quot;\\n=== Coffee Menu ===&quot; &lt;&lt; endl;
        for (const auto&amp; [name, recipe] : recipes) {
            cout &lt;&lt; &quot;  - &quot; &lt;&lt; name &lt;&lt; endl;
        }
        cout &lt;&lt; &quot;====================\\n&quot; &lt;&lt; endl;
    }
};

<p><strong>Difficulty</strong>: Easy<br />

4. Dice rolling

6. Win condition detection</p>

<h2 id="complete-c-implementation">Complete C++ Implementation</h2>
<pre><code class="language-cpp">#include &lt;iostream&gt;
#include &lt;vector&gt;

#include &lt;string&gt;

#include &lt;ctime&gt;

using namespace std;

// ============== Jump (Snake or Ladder) ==============

class Jump {
private:
    int start;
    int end;

public:
    Jump(int s, int e) : start(s), end(e) {}

    int getStart() const { return start; }
    int getEnd() const { return end; }

    bool isSnake() const { return end &lt; start; }
    bool isLadder() const { return end &gt; start; }
};

// ============== Dice ==============

class Dice {
private:
    int faces;

public:
    Dice(int f = 6) : faces(f) {
        srand(time(nullptr));
    }

    int roll() {
        int value = (rand() % faces) + 1;
        cout &lt;&lt; &quot;🎲 Rolled: &quot; &lt;&lt; value &lt;&lt; endl;
        return value;
    }
};

// ============== Player ==============

class Player {
private:
    string name;
    int position;

public:
    Player(const string&amp; n) : name(n), position(0) {}

    string getName() const { return name; }
    int getPosition() const { return position; }

    void setPosition(int pos) { position = pos; }

    void move(int steps) {
        position += steps;
    }
};

// ============== Board ==============

class Board {
private:
    int size;
    map&lt;int, Jump&gt; jumps;  // position -&gt; Jump

public:
    Board(int s = 100) : size(s) {}

    int getSize() const { return size; }

    void addSnake(int head, int tail) {
        if (head &gt; tail &amp;&amp; head &lt;= size &amp;&amp; tail &gt;= 1) {
            jumps[head] = Jump(head, tail);
            cout &lt;&lt; &quot;🐍 Snake added: &quot; &lt;&lt; head &lt;&lt; &quot; → &quot; &lt;&lt; tail &lt;&lt; endl;
        }
    }

    void addLadder(int bottom, int top) {
        if (top &gt; bottom &amp;&amp; top &lt;= size &amp;&amp; bottom &gt;= 1) {
            jumps[bottom] = Jump(bottom, top);
            cout &lt;&lt; &quot;🪜 Ladder added: &quot; &lt;&lt; bottom &lt;&lt; &quot; → &quot; &lt;&lt; top &lt;&lt; endl;
        }
    }

    int checkJump(int position) {
        if (jumps.find(position) != jumps.end()) {
            Jump jump = jumps[position];
            if (jump.isSnake()) {
                cout &lt;&lt; &quot;   🐍 Oops! Snake bite! Sliding down to &quot; &lt;&lt; jump.getEnd() &lt;&lt; endl;
            } else {
                cout &lt;&lt; &quot;   🪜 Yay! Ladder! Climbing up to &quot; &lt;&lt; jump.getEnd() &lt;&lt; endl;
            }
            return jump.getEnd();
        }
        return position;
    }

    void display() const {
        cout &lt;&lt; &quot;\\n========== Board Setup ==========&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;Board Size: &quot; &lt;&lt; size &lt;&lt; &quot; squares&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;Snakes:&quot; &lt;&lt; endl;
        for (const auto&amp; [pos, jump] : jumps) {
            if (jump.isSnake()) {
                cout &lt;&lt; &quot;  🐍 &quot; &lt;&lt; jump.getStart() &lt;&lt; &quot; → &quot; &lt;&lt; jump.getEnd() &lt;&lt; endl;
            }
        }
        cout &lt;&lt; &quot;Ladders:&quot; &lt;&lt; endl;
        for (const auto&amp; [pos, jump] : jumps) {
            if (jump.isLadder()) {
                cout &lt;&lt; &quot;  🪜 &quot; &lt;&lt; jump.getStart() &lt;&lt; &quot; → &quot; &lt;&lt; jump.getEnd() &lt;&lt; endl;
            }
        }
        cout &lt;&lt; &quot;=================================\\n&quot; &lt;&lt; endl;
    }
};

// ============== Game ==============

class Game {
private:
    Board board;
    vector&lt;Player&gt; players;
    Dice dice;
    int currentPlayerIndex;
    bool gameOver;

public:
    Game(int boardSize = 100) : board(boardSize), currentPlayerIndex(0), gameOver(false) {}

    void addPlayer(const string&amp; name) {
        players.emplace_back(name);
        cout &lt;&lt; &quot;✓ Player added: &quot; &lt;&lt; name &lt;&lt; endl;
    }

    void setupSnakesAndLadders() {
        // Add snakes
        board.addSnake(99, 54);
        board.addSnake(70, 55);
        board.addSnake(52, 42);
        board.addSnake(25, 2);
        board.addSnake(95, 72);

        // Add ladders
        board.addLadder(6, 25);
        board.addLadder(11, 40);
        board.addLadder(60, 85);
        board.addLadder(46, 90);
        board.addLadder(17, 69);
    }

    void startGame() {
        if (players.size() &lt; 2) {
            cout &lt;&lt; &quot;Need at least 2 players to start!&quot; &lt;&lt; endl;
            return;
        }

        cout &lt;&lt; &quot;\\n========== Game Started! ==========&quot; &lt;&lt; endl;
        board.display();

        while (!gameOver) {
            playTurn();
        }
    }

    void playTurn() {
        Player&amp; currentPlayer = players[currentPlayerIndex];

        cout &lt;&lt; &quot;\\n--- &quot; &lt;&lt; currentPlayer.getName() &lt;&lt; &quot;'s turn ---&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;Current position: &quot; &lt;&lt; currentPlayer.getPosition() &lt;&lt; endl;
        cout &lt;&lt; &quot;Press Enter to roll the dice...&quot;;
        cin.get();

        int diceValue = dice.roll();
        int newPosition = currentPlayer.getPosition() + diceValue;

        // Check if position exceeds board size
        if (newPosition &gt; board.getSize()) {
            cout &lt;&lt; &quot;Cannot move! Need exact roll to win.&quot; &lt;&lt; endl;
            newPosition = currentPlayer.getPosition();
        } else {
            cout &lt;&lt; &quot;Moving from &quot; &lt;&lt; currentPlayer.getPosition() 
                 &lt;&lt; &quot; to &quot; &lt;&lt; newPosition &lt;&lt; endl;
            currentPlayer.setPosition(newPosition);

            // Check for snake or ladder
            int finalPosition = board.checkJump(newPosition);
            currentPlayer.setPosition(finalPosition);

            cout &lt;&lt; &quot;Final position: &quot; &lt;&lt; currentPlayer.getPosition() &lt;&lt; endl;

            // Check win condition
            if (currentPlayer.getPosition() == board.getSize()) {
                announceWinner(currentPlayer);
                return;
            }
        }

        // Move to next player
        currentPlayerIndex = (currentPlayerIndex + 1) % players.size();
    }

    void announceWinner(const Player&amp; winner) {
        cout &lt;&lt; &quot;\\n🎉🎉🎉🎉🎉🎉🎉🎉🎉🎉&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;🎉 &quot; &lt;&lt; winner.getName() &lt;&lt; &quot; WINS! 🎉&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;🎉🎉🎉🎉🎉🎉🎉🎉🎉🎉\\n&quot; &lt;&lt; endl;
        gameOver = true;
    }

    void displayStatus() const {
        cout &lt;&lt; &quot;\\n========== Current Status ==========&quot; &lt;&lt; endl;
        for (const auto&amp; player : players) {
            cout &lt;&lt; player.getName() &lt;&lt; &quot;: Position &quot; &lt;&lt; player.getPosition() &lt;&lt; endl;
        }
        cout &lt;&lt; &quot;====================================\\n&quot; &lt;&lt; endl;
    }
};

// ============== Demo ==============

int main() {
    Game game(100);

    cout &lt;&lt; &quot;========== Snakes and Ladders ==========\\n&quot; &lt;&lt; endl;

    // Add players
    game.addPlayer(&quot;Alice&quot;);
    game.addPlayer(&quot;Bob&quot;);
    game.addPlayer(&quot;Charlie&quot;);

    // Setup board
    game.setupSnakesAndLadders();

    // Start game
    game.startGame();

    return 0;
}

<p><strong>Difficulty</strong>: Easy<br />
<strong>Time to Solve</strong>: 20-25 minutes<br />
<strong>Companies</strong>: Amazon, Microsoft, Adobe</p>
<h2 id="problem-statement">Problem Statement</h2>
<p>Design a deck of playing cards that supports:
1. Standard 52-card deck
2. Shuffle deck
3. Deal cards
4. Multiple card games (Poker, Blackjack)
5. Card comparison</p>
<hr />
<h2 id="class-diagram">Class Diagram</h2>
<pre><code>┌──────────────────┐
│      Deck        │
├──────────────────┤
│- cards           │
├──────────────────┤
│+ shuffle()       │
│+ dealCard()      │
│+ reset()         │
└──────┬───────────┘
       │ contains
       ▼
┌──────────────────┐
│      Card        │
├──────────────────┤
│- suit            │
│- rank            │
├──────────────────┤
│+ getValue()      │
│+ display()       │
└──────────────────┘
</code></pre>
<hr />
<h2 id="complete-c-implementation">Complete C++ Implementation</h2>
<pre><code class="language-cpp">#include &lt;iostream&gt;
#include &lt;vector&gt;
#include &lt;algorithm&gt;
#include &lt;random&gt;
#include &lt;ctime&gt;

using namespace std;

// ============== Enums ==============

enum class Suit { HEARTS, DIAMONDS, CLUBS, SPADES };
enum class Rank {
    TWO = 2, THREE, FOUR, FIVE, SIX, SEVEN, EIGHT, NINE, TEN,
    JACK, QUEEN, KING, ACE
};

// ============== Card ==============

class Card {
private:
    Suit suit;
    Rank rank;

public:
    Card(Suit s, Rank r) : suit(s), rank(r) {}

    Suit getSuit() const { return suit; }
    Rank getRank() const { return rank; }

    int getValue() const {
        return static_cast&lt;int&gt;(rank);
    }

    string getSuitString() const {
        switch (suit) {
            case Suit::HEARTS: return &quot;♥&quot;;
            case Suit::DIAMONDS: return &quot;♦&quot;;
            case Suit::CLUBS: return &quot;♣&quot;;
            case Suit::SPADES: return &quot;♠&quot;;
        }
        return &quot;&quot;;
    }

    string getRankString() const {
        switch (rank) {
            case Rank::TWO: return &quot;2&quot;;
            case Rank::THREE: return &quot;3&quot;;
            case Rank::FOUR: return &quot;4&quot;;
            case Rank::FIVE: return &quot;5&quot;;
            case Rank::SIX: return &quot;6&quot;;
            case Rank::SEVEN: return &quot;7&quot;;
            case Rank::EIGHT: return &quot;8&quot;;
            case Rank::NINE: return &quot;9&quot;;
            case Rank::TEN: return &quot;10&quot;;
            case Rank::JACK: return &quot;J&quot;;
            case Rank::QUEEN: return &quot;Q&quot;;
            case Rank::KING: return &quot;K&quot;;
            case Rank::ACE: return &quot;A&quot;;
        }
        return &quot;&quot;;
    }

    void display() const {
        cout &lt;&lt; &quot;[&quot; &lt;&lt; getRankString() &lt;&lt; getSuitString() &lt;&lt; &quot;]&quot;;
    }

    bool operator&lt;(const Card&amp; other) const {
        return getValue() &lt; other.getValue();
    }
};

// ============== Deck ==============

class Deck {
private:
    vector&lt;Card&gt; cards;
    int currentCardIndex;

public:
    Deck() : currentCardIndex(0) {
        initialize();
    }

    void initialize() {
        cards.clear();
        currentCardIndex = 0;

        // Create all 52 cards
        for (int s = 0; s &lt; 4; s++) {
            Suit suit = static_cast&lt;Suit&gt;(s);
            for (int r = 2; r &lt;= 14; r++) {
                Rank rank = static_cast&lt;Rank&gt;(r);
                cards.push_back(Card(suit, rank));
            }
        }
    }

    void shuffle() {
        random_device rd;
        mt19937 g(rd());
        std::shuffle(cards.begin(), cards.end(), g);
        currentCardIndex = 0;
        cout &lt;&lt; &quot;🔀 Deck shuffled!&quot; &lt;&lt; endl;
    }

    Card* dealCard() {
        if (currentCardIndex &gt;= cards.size()) {
            cout &lt;&lt; &quot;⚠ No more cards in deck!&quot; &lt;&lt; endl;
            return nullptr;
        }
        return &amp;cards[currentCardIndex++];
    }

    vector&lt;Card*&gt; dealCards(int count) {
        vector&lt;Card*&gt; dealt;
        for (int i = 0; i &lt; count; i++) {
            Card* card = dealCard();
            if (card) {
                dealt.push_back(card);
            }
        }
        return dealt;
    }

    int remainingCards() const {
        return cards.size() - currentCardIndex;
    }

    void reset() {
        currentCardIndex = 0;
        cout &lt;&lt; &quot;🔄 Deck reset&quot; &lt;&lt; endl;
    }

    void display() const {
        cout &lt;&lt; &quot;\\n========== Deck Contents ==========&quot; &lt;&lt; endl;
        for (size_t i = currentCardIndex; i &lt; cards.size(); i++) {
            cards[i].display();
            cout &lt;&lt; &quot; &quot;;
            if ((i - currentCardIndex + 1) % 13 == 0) cout &lt;&lt; endl;
        }
        cout &lt;&lt; &quot;\\nRemaining: &quot; &lt;&lt; remainingCards() &lt;&lt; &quot; cards&quot; &lt;&lt; endl;
        cout &lt;&lt; &quot;===================================\\n&quot; &lt;&lt; endl;
    }
};

// ============== Hand ==============

class Hand {
private:
    vector&lt;Card*&gt; cards;
    string playerName;

public:
    Hand(const string&amp; name) : playerName(name) {}

    void addCard(Card* card) {
        cards.push_back(card);
    }

    void clear() {
        cards.clear();
    }

    int getTotal() const {
        int total = 0;
        for (const Card* card : cards) {
            total += card-&gt;getValue();
        }
        return total;
    }

    // Blackjack scoring
    int getBlackjackValue() const {
        int total = 0;
        int aces = 0;

        for (const Card* card : cards) {
            int value = card-&gt;getValue();
            if (value &gt; 10 &amp;&amp; value &lt; 14) {  // J, Q, K
                total += 10;
            } else if (value == 14) {  // Ace
                aces++;
                total += 11;
            } else {
                total += value;
            }
        }

        // Adjust for aces
        while (total &gt; 21 &amp;&amp; aces &gt; 0) {
            total -= 10;
            aces--;
        }

        return total;
    }

    void display() const {
        cout &lt;&lt; playerName &lt;&lt; &quot;'s hand: &quot;;
        for (const Card* card : cards) {
            card-&gt;display();
            cout &lt;&lt; &quot; &quot;;
        }
        cout &lt;&lt; &quot;| Value: &quot; &lt;&lt; getBlackjackValue() &lt;&lt; endl;
    }

    size_t size() const {
        return cards.size();
    }
};

// ============== Blackjack Game ==============

class BlackjackGame {
private:
    Deck deck;
    Hand playerHand;
    Hand dealerHand;

public:
    BlackjackGame() : playerHand(&quot;Player&quot;), dealerHand(&quot;Dealer&quot;) {}

    void start() {
        cout &lt;&lt; &quot;\\n========== Blackjack Game ==========\\n&quot; &lt;&lt; endl;

        deck.shuffle();

        // Deal initial cards
        cout &lt;&lt; &quot;Dealing initial cards...&quot; &lt;&lt; endl;
        playerHand.addCard(deck.dealCard());
        dealerHand.addCard(deck.dealCard());
        playerHand.addCard(deck.dealCard());
        dealerHand.addCard(deck.dealCard());

        // Show hands
        playerHand.display();
        cout &lt;&lt; &quot;Dealer's visible card: &quot;;
        dealerHand.display();  // In real game, show only one card
        cout &lt;&lt; endl;

        // Check for blackjack
        if (playerHand.getBlackjackValue() == 21) {
            cout &lt;&lt; &quot;🎉 BLACKJACK! Player wins!&quot; &lt;&lt; endl;
            return;
        }

        // Player's turn
        cout &lt;&lt; &quot;\\n=== Player's Turn ===&quot; &lt;&lt; endl;
        while (playerHand.getBlackjackValue() &lt; 21) {
            cout &lt;&lt; &quot;Hit or Stand? (h/s): &quot;;
            char choice;
            cin &gt;&gt; choice;

            if (choice == 'h' || choice == 'H') {
                playerHand.addCard(deck.dealCard());
                playerHand.display();

                if (playerHand.getBlackjackValue() &gt; 21) {
                    cout &lt;&lt; &quot;💥 BUST! Dealer wins!&quot; &lt;&lt; endl;
                    return;
                }
            } else {
                break;
            }
        }

        // Dealer's turn
        cout &lt;&lt; &quot;\\n=== Dealer's Turn ===&quot; &lt;&lt; endl;
        dealerHand.display();

        while (dealerHand.getBlackjackValue() &lt; 17) {
            cout &lt;&lt; &quot;Dealer hits...&quot; &lt;&lt; endl;
            dealerHand.addCard(deck.dealCard());
            dealerHand.display();

            if (dealerHand.getBlackjackValue() &gt; 21) {
                cout &lt;&lt; &quot;💥 Dealer BUSTS! Player wins!&quot; &lt;&lt; endl;
                return;
            }
        }

        // Compare hands
        int playerValue = playerHand.getBlackjackValue();
        int dealerValue = dealerHand.getBlackjackValue();

        cout &lt;&lt; &quot;\\n=== Result ===&quot; &lt;&lt; endl;
        if (playerValue &gt; dealerValue) {
            cout &lt;&lt; &quot;🎉 Player wins! (&quot; &lt;&lt; playerValue &lt;&lt; &quot; vs &quot; &lt;&lt; dealerValue &lt;&lt; &quot;)&quot; &lt;&lt; endl;

            cout &lt;&lt; &quot;Dealer wins! (&quot; &lt;&lt; dealerValue &lt;&lt; &quot; vs &quot; &lt;&lt; playerValue &lt;&lt; &quot;)&quot; &lt;&lt; endl;
        } else {
            cout &lt;&lt; &quot;Push! (Tie at &quot; &lt;&lt; playerValue &lt;&lt; &quot;)&quot; &lt;&lt; endl;
        }
    }
};

class Location {
private:
    double latitude;
    double longitude;
    time_t timestamp;

public:
    Location(double lat = 0, double lon = 0) 
        : latitude(lat), longitude(lon), timestamp(time(nullptr)) {}

    double getLatitude() const { return latitude; }
    double getLongitude() const { return longitude; }

    // Haversine formula for distance calculation
    double distanceTo(const Location&amp; other) const {
        const double R = 6371.0; // Earth radius in km

        double lat1 = latitude * M_PI / 180.0;
        double lat2 = other.latitude * M_PI / 180.0;
        double dLat = (other.latitude - latitude) * M_PI / 180.0;
        double dLon = (other.longitude - longitude) * M_PI / 180.0;

        double a = sin(dLat/2) * sin(dLat/2) +
                   cos(lat1) * cos(lat2) *
                   sin(dLon/2) * sin(dLon/2);
        double c = 2 * atan2(sqrt(a), sqrt(1-a));

        return R * c;
    }

    void display() const {
        cout &lt;&lt; &quot;(&quot; &lt;&lt; fixed &lt;&lt; setprecision(4) 
             &lt;&lt; latitude &lt;&lt; &quot;, &quot; &lt;&lt; longitude &lt;&lt; &quot;)&quot;;
    }
};

class PricingStrategy {
protected:

    double perKmRate;
    double perMinRate;

public:
    PricingStrategy(double base, double km, double min)
        : baseFare(base), perKmRate(km), perMinRate(min) {}

    virtual ~PricingStrategy() = default;

    virtual double calculateFare(double distance, double duration) {
        return baseFare + (distance * perKmRate) + (duration * perMinRate);
    }

    virtual string getStrategyName() const = 0;
};

        : PricingStrategy(base, km, min), surgeMultiplier(surge) {}

// ============== Driver Matching Strategy ==============

class DriverMatchingStrategy {
public:
    virtual ~DriverMatchingStrategy() = default;
    virtual Driver* findDriver(const vector&lt;Driver*&gt;&amp; availableDrivers, 
                              const Location&amp; pickupLocation, 
                              RideType rideType) = 0;
};

class NearestDriverStrategy : public DriverMatchingStrategy {
public:
    Driver* findDriver(const vector&lt;Driver*&gt;&amp; availableDrivers, 
                      const Location&amp; pickupLocation, 
                      RideType rideType) override {
        Driver* nearest = nullptr;
        double minDistance = DBL_MAX;

        for (Driver* driver : availableDrivers) {
            if (driver-&gt;getStatus() != DriverStatus::AVAILABLE) {
                continue;
            }

            double distance = driver-&gt;getCurrentLocation().distanceTo(pickupLocation);

            if (distance &lt; minDistance) {
                minDistance = distance;
                nearest = driver;
            }
        }

        return nearest;
    }
};

class HighestRatedDriverStrategy : public DriverMatchingStrategy {
public:
    Driver* findDriver(const vector&lt;Driver*&gt;&amp; availableDrivers, 
                      const Location&amp; pickupLocation, 
                      RideType rideType) override {
        Driver* bestRated = nullptr;
        double maxRating = 0.0;

        for (Driver* driver : availableDrivers) {
            if (driver-&gt;getStatus() != DriverStatus::AVAILABLE) {
                continue;
            }

            double distance = driver-&gt;getCurrentLocation().distanceTo(pickupLocation);

            // Only consider drivers within 5 km
            if (distance &lt;= 5.0 &amp;&amp; driver-&gt;getRating() &gt; maxRating) {
                maxRating = driver-&gt;getRating();
                bestRated = driver;
            }
        }

        return bestRated;
    }
};

class RideShareSystem {
private:
    static RideShareSystem* instance;
    static mutex mtx;

    unordered_map&lt;string, unique_ptr&lt;Rider&gt;&gt; riders;
    unordered_map&lt;string, unique_ptr&lt;Driver&gt;&gt; drivers;
    unordered_map&lt;string, unique_ptr&lt;Trip&gt;&gt; trips;

    unique_ptr&lt;DriverMatchingStrategy&gt; matchingStrategy;

    RideShareSystem() {
        matchingStrategy = make_unique&lt;NearestDriverStrategy&gt;();
    }

public:
    static RideShareSystem* getInstance() {
        lock_guard&lt;mutex&gt; lock(mtx);
        if (instance == nullptr) {
            instance = new RideShareSystem();
        }
        return instance;
    }

    void registerRider(unique_ptr&lt;Rider&gt; rider) {
        lock_guard&lt;mutex&gt; lock(mtx);
        string id = rider-&gt;getUserId();
        riders[id] = move(rider);
        cout &lt;&lt; &quot;Rider registered: &quot; &lt;&lt; id &lt;&lt; endl;
    }

    void registerDriver(unique_ptr&lt;Driver&gt; driver) {
        lock_guard&lt;mutex&gt; lock(mtx);
        string id = driver-&gt;getUserId();
        drivers[id] = move(driver);
        cout &lt;&lt; &quot;Driver registered: &quot; &lt;&lt; id &lt;&lt; endl;
    }

    Trip* requestRide(const string&amp; riderId, const Location&amp; pickup, 
                      const Location&amp; destination, RideType type) {
        lock_guard&lt;mutex&gt; lock(mtx);

        auto riderIt = riders.find(riderId);
        if (riderIt == riders.end()) {
            cout &lt;&lt; &quot;Rider not found!&quot; &lt;&lt; endl;
            return nullptr;
        }

        Rider* rider = riderIt-&gt;second.get();

        // Create trip
        auto trip = make_unique&lt;Trip&gt;(rider, pickup, destination, type);
        Trip* tripPtr = trip.get();

        cout &lt;&lt; &quot;\\n[NEW RIDE REQUEST] &quot; &lt;&lt; trip-&gt;getTripId() &lt;&lt; endl;

        vector&lt;Driver*&gt; availableDrivers;
        for (auto&amp; [id, driver] : drivers) {
            if (driver-&gt;getStatus() == DriverStatus::AVAILABLE) {
                availableDrivers.push_back(driver.get());

    }

        delete instance;
        instance = nullptr;
    }

struct Location {
    double latitude;
    double longitude;

    Location(double lat = 0, double lon = 0) : latitude(lat), longitude(lon) {}

    double distanceTo(const Location&amp; other) const {
        // Simplified Euclidean distance (in real system use Haversine)
        double dx = (latitude - other.latitude) * 111; // ~111 km per degree
        double dy = (longitude - other.longitude) * 111;
        return sqrt(dx * dx + dy * dy);
    }
};
