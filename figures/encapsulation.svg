<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" width="780" height="260" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Encapsulation: data + behaviour, guarded</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="390.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="central">Encapsulation: data + behaviour, guarded</text><rect x="280" y="60" width="220" height="114" rx="6" ry="6" fill="#6B7B94"/><text x="390.0" y="75" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="central">BankAccount</text><line x1="280" y1="86" x2="500" y2="86" stroke="#FFFFFF" stroke-width="1"/><text x="290" y="99.5" fill="#FFFFFF" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="central">- balance: double</text><line x1="280" y1="113" x2="500" y2="113" stroke="#FFFFFF" stroke-width="1"/><text x="290" y="126.5" fill="#FFFFFF" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="central">+ deposit(amt)</text><text x="290" y="143.5" fill="#FFFFFF" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="central">+ withdraw(amt)</text><text x="290" y="160.5" fill="#FFFFFF" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="central">+ getBalance()</text><text x="390" y="200" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="central">private data is reachable only through</text><text x="390" y="216" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="middle" dominant-baseline="central">public methods that enforce the rules</text></svg>
