<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>SOLID: five principles of OO design</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="410.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="central">SOLID: five principles of OO design</text><rect x="60" y="60" width="44" height="36" rx="9" ry="9" fill="#3E7CC0"/><text x="82.0" y="78.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="82.0" dy="0">S</tspan></text><text x="120" y="72" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="central">Single Responsibility</text><text x="120" y="88" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="central">one reason to change</text><rect x="60" y="104" width="44" height="36" rx="9" ry="9" fill="#3E7CC0"/><text x="82.0" y="122.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="82.0" dy="0">O</tspan></text><text x="120" y="116" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="central">Open / Closed</text><text x="120" y="132" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="central">open to extend, closed to modify</text><rect x="60" y="148" width="44" height="36" rx="9" ry="9" fill="#3E7CC0"/><text x="82.0" y="166.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="82.0" dy="0">L</tspan></text><text x="120" y="160" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="central">Liskov Substitution</text><text x="120" y="176" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="central">subtypes must be swappable</text><rect x="60" y="192" width="44" height="36" rx="9" ry="9" fill="#3E7CC0"/><text x="82.0" y="210.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="82.0" dy="0">I</tspan></text><text x="120" y="204" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="central">Interface Segregation</text><text x="120" y="220" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="central">many small interfaces</text><rect x="60" y="236" width="44" height="36" rx="9" ry="9" fill="#3E7CC0"/><text x="82.0" y="254.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="82.0" dy="0">D</tspan></text><text x="120" y="248" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="central">Dependency Inversion</text><text x="120" y="264" fill="#9AA0B4" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="10.5" font-weight="500" text-anchor="start" dominant-baseline="central">depend on abstractions</text></svg>
