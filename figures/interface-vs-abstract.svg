<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive"><style>@font-face{font-family:'Virgil';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}</style><title>Interface vs abstract class</title><defs><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7B94"/></marker><marker id="ah-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E7CC0"/></marker><marker id="ah-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F918C"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D65A5F"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D9922B"/></marker><marker id="ah-l" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA0B4"/></marker></defs><text x="410.0" y="26" fill="#6B7B94" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="central">Interface vs abstract class</text><rect x="60" y="70" width="320" height="150" rx="8" ry="8" fill="#6B7B94"/><text x="220.0" y="145.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="220.0" dy="0"></tspan></text><rect x="440" y="70" width="320" height="150" rx="8" ry="8" fill="#3E7CC0"/><text x="600.0" y="145.0" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="600.0" dy="0"></tspan></text><text x="220" y="92" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="central">Interface</text><text x="80" y="120" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="central">• only pure virtual methods</text><text x="80" y="144" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="central">• no state / fields</text><text x="80" y="168" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="central">• a class can implement many</text><text x="80" y="192" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="central">• the what</text><text x="600" y="92" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="central">Abstract class</text><text x="460" y="120" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="central">• may mix concrete + virtual</text><text x="460" y="144" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="central">• can hold state</text><text x="460" y="168" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="central">• single inheritance only</text><text x="460" y="192" fill="#FFFFFF" font-family="'Virgil','Segoe Print','Comic Sans MS',cursive" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="central">• shared base + the what</text></svg>
